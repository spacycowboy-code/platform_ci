# platform-ci 自己的流水线:
#   * 校验模板能被解析(消费方锁 tag,坏模板不该发布出去)
#   * 构建并推送基础镜像
#
# 基础镜像只发一种标签:<pyver>-<sha>,不可变。不发浮动的 <pyver>-latest —— 浮动的基础镜像
# 会让同一份源码在不同时间构出不同产物。服务流水线里的 BASE_IMAGE 因此是一个写死的标签,
# 基础镜像更新时由平台维护者改它并移动 v1。
stages: [check, publish, deploy]

variables:
  REGISTRY: "armdocker.rnd.ericsson.se"
  BASE: "armdocker.rnd.ericsson.se/proj-rp-ps-ai/python-base"
  PY_VERSION: "3.12"

check-templates:
  stage: check
  image: $REGISTRY/dockerhub-ericsson-remote/python:3.12-slim
  script:
    - pip install --quiet pyyaml
    - |
      python - <<'PY'
      import pathlib, sys, yaml

      # GitLab 的自定义标签,本地解析时当成占位值。
      yaml.SafeLoader.add_multi_constructor("!reference", lambda loader, suffix, node: None)

      bad = 0
      for p in sorted(pathlib.Path("templates").glob("*.yml")):
          text = p.read_text(encoding="utf-8")
          head, sep, body = text.partition("\n---\n")
          try:
              # 没有 --- 的是共享片段(只定义以 . 开头的隐藏任务),整份就是 body。
              spec = yaml.safe_load(head) if sep else None
              jobs = yaml.safe_load(body if sep else text) or {}
          except Exception as exc:
              print(f"{p}: 解析失败 {exc}")
              bad = 1
              continue
          skip = ("default", "stages", "variables", "cache", "workflow", "include")
          names = [k for k in jobs if k not in skip]
          if not sep:
              # 没有 --- 的是平台内部的任务文件(不被服务仓 include)
              print(f"{p}: 平台内部,任务 {names}")
              continue
          inputs = ((spec or {}).get("spec") or {}).get("inputs") or {}
          required = [k for k, v in inputs.items() if not isinstance(v, dict) or "default" not in v]
          print(f"{p}: 输入 {len(inputs)} 个(必填 {len(required)}: {required}),任务 {names}")
      sys.exit(bad)
      PY
    # 缓存清理工具的判断逻辑(选哪些层、是否执行删除)也在这里过一遍,不联网。
    - python3 tools/test_prune_build_cache.py
    # 每个环境的 stack.yml 与 versions.txt 必须对得上 —— 漏一行的后果是别人的部署全挂,
    # 所以要在提出改动的这个 MR 上就变红,而不是等到运行时。
    - python3 tools/check_versions_declared.py
    # swarm-apply.sh 的行为(校验先于落盘、失败逐行回滚、versions.txt 兜底),用假 docker 跑。
    - python3 tools/test_swarm_apply.py
    # 生产(compose)那条路径同理。它把 deploy.yml 里那段内联 ssh 脚本**原文取出来**渲染再执行,
    # 所以转义错了这里就会红 —— 那段历史上因为转义坏过两次。
    - python3 tools/test_compose_deploy.py
    # stack.yml 的 swarm 兼容性检查本身也要有测试:闸门最糟的失效方式是看起来在工作却拦不住,
    # 那比没有闸门更糟 —— 后面写 stack.yml 的人会以为有人替他把过关。
    - python3 tools/test_check_stack_config.py

# stack.yml 在 swarm 下是不是真能部署。单独一个任务是因为它要 docker 命令,
# 而上面那个任务跑在 python 镜像上。
#
# 为什么这道闸门值得存在:swarm 的 `stack deploy` 是**整栈重渲染** —— 任何一个服务块写坏,
# 整个栈谁都部不了,不是只有那一个服务失败(单机 compose 的 `up -d <服务>` 只影响它自己)。
# 所以要在提出改动的那个 MR 上变红,而不是等别人点部署时才炸。
#
# `docker stack config` 不需要 daemon(纯客户端渲染,实测过),所以这里不需要 dind ——
# 本项目的 runner 也不允许 privileged。
check-stack:
  stage: check
  image: $REGISTRY/dockerhub-ericsson-remote/docker:26.1.4
  before_script:
    - apk add --no-cache python3 py3-yaml
  script:
    - python3 tools/check_stack_config.py

# 缓存仓只会长,不会缩:kaniko 的 --cache-ttl(默认 336h)过期后只是不再采用,不会删。
# 这个任务按**最后一次被命中的时间**清理,理由与取舍见 tools/prune_build_cache.py 的开头。
#
# 只在定时流水线里跑,且默认是报告模式 —— 要真删得把 PRUNE_APPLY 设成 true(定时计划里设)。
# 这样手工点一下流水线不会误删,而删错的后果也只是下一次构建缓存未命中。
prune-build-cache:
  stage: check
  image: $REGISTRY/dockerhub-ericsson-remote/python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PRUNE_CACHE == "true"'
  script:
    - |
      : "${docker_user:?未设置}"; : "${docker_password:?未设置}"
      if [ "${PRUNE_APPLY:-false}" = "true" ]; then
        python3 tools/prune_build_cache.py --keep-days "${PRUNE_KEEP_DAYS:-30}" --apply
      else
        python3 tools/prune_build_cache.py --keep-days "${PRUNE_KEEP_DAYS:-30}"
      fi

publish-base:
  stage: publish
  # runner 不允许 privileged,所以没有 docker daemon 可用(dind 报
  # "mount: permission denied")。kaniko 在用户态构建,不需要守护进程。
  image:
    name: $REGISTRY/gcr-ericsson-remote/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - |
      : "${docker_user:?未设置}"; : "${docker_password:?未设置}"
      mkdir -p /kaniko/.docker
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY" \
        "$(printf '%s:%s' "$docker_user" "$docker_password" | base64 | tr -d '\n')" \
        > /kaniko/.docker/config.json
    - /kaniko/executor
        --context "$CI_PROJECT_DIR"
        --dockerfile "$CI_PROJECT_DIR/docker/Dockerfile.base"
        --build-arg "PY_VERSION=$PY_VERSION"
        --destination "$BASE:$PY_VERSION-$CI_COMMIT_SHORT_SHA"
        --snapshot-mode=redo --single-snapshot
    - echo "已发布 $BASE:$PY_VERSION-$CI_COMMIT_SHORT_SHA"
    # 只发固定标签,不发 <pyver>-latest:浮动的基础镜像会让同一份源码构出不同产物。
  rules:
    # 只在推送触发时判断 changes:API 或手动触发的流水线没有对比基准,changes 会匹配一切,
    # 于是每次点一下版本集合的按钮都要顺带重建一次基础镜像(实测撞到过,deploy 阶段被它挡住)。
    - if: '$CI_PIPELINE_SOURCE != "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      # 只在配方本身变化时重发;流水线文件的改动与基础镜像内容无关。
      changes: [docker/Dockerfile.base]

# grafana 的看板和数据源不由镜像驱动(它是第三方镜像),所以没有服务仓能触发它的部署。
# 这个按钮补上那条路:把 deploy/<环境>/grafana/ 发到机器上。
#
# 看板改动不需要重启:provider 里 updateIntervalSeconds: 30,grafana 每 30 秒重读一次看板目录,
# 新增和修改都会自动生效(实测)。数据源和 provider.yml 是启动时读的,不会热加载(也实测过),
# 所以只有这两类文件变了才重启 grafana。
deploy-grafana-config:
  stage: deploy
  image: $REGISTRY/dockerhub-ericsson-remote/docker:26.1.4
  rules:
    # 服务仓触发的部署流水线里不要出现这个按钮
    - if: '$DEPLOY_ENV'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
  variables:
    GRAFANA_ENV: prod
    GRAFANA_PORT: "9401"
  environment:
    name: $GRAFANA_ENV
  before_script:
    - apk add --no-cache openssh-client rsync
  script:
    - |
      : "${DEPLOY_HOST:?未设置}"; : "${DEPLOY_USER:?未设置}"; : "${DEPLOY_SSH_KEY:?未设置}"
      SRC="deploy/$GRAFANA_ENV/grafana"
      test -d "$SRC" || { echo "$SRC 不存在"; exit 1; }
      # 目录存在但里面是空的必须拦住:下面那条 rsync 带 --delete,空目录会把机器上的看板
      # 清空,而 provider 的 disableDeletion 是 false —— grafana 30 秒后把看板从自己的库里
      # 删掉,界面上的改动一起消失(那些改动只存在于数据卷里,仓库里没有副本)。
      # 从 git 里删掉一个看板仍然照常生效,拦的只是"全空"这一种情况。
      ls -1 "$SRC"/dashboards/*.json >/dev/null 2>&1 || { echo "$SRC/dashboards 里没有任何 .json,拒绝同步"; exit 1; }
      case "$GRAFANA_ENV" in
        test) HOST_DIR=/proj/rp_ait_prod/services/test-env ;;
        prod) HOST_DIR=/proj/rp_ait_prod/services/prod-env ;;
        *) echo "未知环境 $GRAFANA_ENV"; exit 1 ;;
      esac
      # File 类型变量带 CRLF 且末尾可能缺换行,直接用会 "error in libcrypto"(上次就是这样失败的)
      mkdir -p ~/.ssh
      tr -d '\r' < "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
      printf '\n' >> ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
      ssh-keygen -y -P "" -f ~/.ssh/id_deploy >/dev/null || { echo "私钥不可解析"; exit 1; }
      SSHOPT="-i $HOME/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      SSH="ssh $SSHOPT"
      echo "看板文件:"; ls -1 "$SRC/dashboards" | sed 's/^/  /'
      # 重启判据里必须带上 compose.yml:grafana 的挂载点和端口写在那里,而本 job 是 grafana
      # 唯一的部署入口(它不在 services.txt 里,没有服务仓能触发它)。少了这一条就会出现
      # "provider.yml 的 options.path 已经改了,机器上的 compose.yml 还是旧挂载点",
      # grafana 于是在一个空目录里找看板 —— 配上 disableDeletion: false 就是把看板删掉。
      STATE() { $SSH "$DEPLOY_USER@$DEPLOY_HOST" "cat $HOST_DIR/grafana/provisioning/*/*.y*ml $HOST_DIR/compose.yml 2>/dev/null | md5sum | cut -d' ' -f1"; }
      BEFORE=$(STATE)
      # --delete:从 git 里删掉一个看板,机器上也要消失,否则会留下没人知道的残留
      rsync -rlt --delete -e "$SSH" --itemize-changes "$SRC/" "$DEPLOY_USER@$DEPLOY_HOST:$HOST_DIR/grafana/"
      # 环境描述本身也要送过去,理由同上。服务部署那条路径(templates/deploy.yml)确实会 rsync
      # 整个目录,但它只重建 services.txt 里列出的服务,grafana 不在其中 —— 两条路都得走。
      scp $SSHOPT "deploy/$GRAFANA_ENV/compose.yml" "$DEPLOY_USER@$DEPLOY_HOST:$HOST_DIR/compose.yml"
      AFTER=$(STATE)
      if [ "$BEFORE" != "$AFTER" ]; then
        echo "provisioning 或 compose.yml 变了,重建 grafana"
        $SSH "$DEPLOY_USER@$DEPLOY_HOST" "cd $HOST_DIR && docker compose up -d --force-recreate grafana"
      else
        echo "provisioning 与 compose.yml 都没变,不重启;看板改动 30 秒内自动生效"
      fi
      echo "等 grafana 认到新内容:"
      OK=""
      for i in $(seq 1 8); do
        sleep 6
        OUT=$($SSH "$DEPLOY_USER@$DEPLOY_HOST" "curl -s --max-time 10 'http://localhost:$GRAFANA_PORT/api/search?type=dash-db'" || true)
        echo "$OUT" | grep -q '"uid"' && { OK=1; break; }
      done
      echo "$OUT" | tr ',' '\n' | grep -E '"(title|uid)"' | sed 's/^/  /'
      # 一个看板都没有就是出事了,最典型的就是挂载点与 provider 的 options.path 不一致:
      # 容器里那个目录是空的,disableDeletion: false 于是把库里的看板删掉。必须让 job 红。
      [ -n "$OK" ] || { echo "grafana 里一个看板都没有 —— 检查挂载点与 provider 的 options.path 是否一致"; exit 1; }

# ---------- 入口与路由层的部署入口 ----------
# edge(TLS、域名、443)与 traefik(路由表)都**不在 services.txt 里**,所以没有任何服务仓能
# 触发它们的部署。在这个 job 出现之前,改一条路由的真实步骤是「提 MR → 合并 → 找人 ssh 上去
# 手工覆写文件」,第三步没有记录、没有校验,而且漏掉它的话生产一个字都不会变 —— 看起来却
# 像是已经上线了。2026-10-08 与 10-09 两次改动都是这么手工做的,这个 job 就是来消掉那一步的。
#
# 为什么用 rsync --inplace(这是本 job 最关键的一个选项):
#   compose.yml 里 traefik 的两个配置是**按文件** bind mount 的
#   (./edge-static.yml:/etc/traefik/static.yml、./edge-dynamic.yml:/etc/traefik/dynamic.yml),
#   而普通 rsync 是「写临时文件再 rename」,rename 会换 inode —— 容器里的挂载仍然指着旧
#   inode,于是 traefik 的 watch 什么都察觉不到,配置永远不生效**而且全程不报错**。
#   --inplace 直接写进原文件,inode 不变,traefik 的 file provider 当场热加载。
#   2026-10-09 加 /pmo/dashboard/hwc 那条路由时实测:原地覆写 → 路由立刻生效、零中断、
#   不需要重建任何容器。而 10-08 改 edge/nginx.conf 那次用的是换 inode 的方式,结果
#   `nginx -t` 校验的是旧配置、`nginx -s reload` 报成功而一个字没变。
#
# 重启判据分三档,因为三种配置的生效方式完全不同:
#   * edge-dynamic.yml(路由表)  → **重建 traefik**(见下面那段"为什么不敢靠热加载")
#   * edge-static.yml(入口、超时) → traefik 启动时只读一次,必须重建 traefik
#   * compose.yml 里 **edge 或 traefik 自己那一段** → 挂载点或端口可能变了,重建对应容器
#   * edge/ 下的 nginx 配置 → 挂的是目录,nginx -t 然后 reload,不中断连接
#
# **为什么路由表变了也要重建 traefik,而不是靠 providers.file 的 watch 热加载:**
# 因为那个 watch 实测**不可靠**,而它失效的方式是静默的 —— 2026-10-09 一天之内两种结果都
# 撞到了:
#   * 上午加 /pmo/dashboard/hwc 那条,用 ssh 的 `cat > 文件` 原地覆写 → 热加载成功、零中断;
#   * 下午下线 work-connector,本 job 用 rsync --inplace 原地覆写 → 文件确实写进去了
#     (itemize 是 `<f.st......`,机器上的 md5 与仓库一致、work-connector 只剩注释),
#     但 traefik 的访问日志仍然显示 `"work-connector@file"` 在往已删除的容器转发,
#     表现是那条路径 502。重建 traefik 之后立刻恢复正常(落到 /api/ 兜底,答 401)。
# 两次都是同一个文件、同一个 inode、同一个挂载方式,结果不同 —— 所以这是个会偶发失效的
# 机制。配置是否生效这件事不能依赖偶发成功的机制,宁可每次多花几秒。
#
# 代价说清:重建 traefik 期间 edge 会有几秒 502(edge **不动**,所以不是连接被拒,整站
# 仍然可达、只是网关错误)。比起"配置没生效却报成功"这种静默失败,这个代价值得付。
# 真要回到零中断,正确做法是给 traefik 开 api(绑回环)让本 job 能查实时路由表、
# 验不过再重建 —— 那是另一件事,见仓库 ROADMAP。
#
# **compose.yml 的判据是"只比 edge 与 traefik 那两段",不是比整个文件。** 第一版比的是
# 整个文件,结果任何一处 compose 改动都会重启整站入口 —— 2026-10-09 下线 work-connector
# 与 eridoc-client 那次就撞上了:删掉的 83 行全在那两个服务块里,edge 与 traefik 的定义
# 一个字都没动(两段的哈希前后相同),但整个文件的哈希变了,于是按钮判定要重建 443 那个
# 容器,凭空收一次几秒全站中断的税。而且这个税会在未来每一次不相关的 compose 改动上重复收。
#
# 推论要说清:**别的服务改了 compose 不会由本 job 生效**,它们各自的部署按钮会 rsync 整个
# 环境描述并重建自己那个容器。本 job 仍然把整个 compose.yml 送上去(机器上那份要是权威的),
# 只是不拿它当重启入口的理由。
deploy-edge-config:
  stage: deploy
  image: $REGISTRY/dockerhub-ericsson-remote/docker:26.1.4
  rules:
    # 服务仓触发的部署流水线里不要出现这个按钮
    - if: '$DEPLOY_ENV'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
  variables:
    EDGE_ENV: prod
  environment:
    name: $EDGE_ENV
  before_script:
    - apk add --no-cache openssh-client rsync
  script:
    - |
      : "${DEPLOY_HOST:?未设置}"; : "${DEPLOY_USER:?未设置}"; : "${DEPLOY_SSH_KEY:?未设置}"
      SRC="deploy/$EDGE_ENV"
      case "$EDGE_ENV" in
        prod) HOST_DIR=/proj/rp_ait_prod/services/prod-env; DOMAIN=https://rpai.ews.gic.ericsson.se ;;
        *) echo "本 job 目前只支持 prod:test 的 traefik 在集群里、配置走 swarm config,由 swarm-apply.sh 管"; exit 1 ;;
      esac

      # ---------- 1. 上车前的静态检查 ----------
      # 这三个文件任何一个坏了,后果都是整站级的,所以宁可在这里红。
      for f in edge-static.yml edge-dynamic.yml compose.yml edge/nginx.conf; do
        test -s "$SRC/$f" || { echo "$SRC/$f 不存在或是空文件,拒绝部署"; exit 1; }
      done
      # 路由表至少要有这三段,否则 traefik 会加载一份「语法正确但一条路由都没有」的配置,
      # 表现是整站 404 —— 而 traefik 自己不认为这是错误。
      for k in "routers:" "services:" "middlewares:"; do
        grep -q "^  $k" "$SRC/edge-dynamic.yml" || { echo "edge-dynamic.yml 里缺少 $k 段,拒绝部署"; exit 1; }
      done
      # 每个 router 指向的 service / middleware 必须存在。写错一个名字,那条路由静默失效
      # (traefik 不认为这是错误,只是那条规则不生效)。
      #
      # 必须**按段**查,不能全文 grep:routers / middlewares / services 三段的键缩进完全相同,
      # 全文 grep "^    po:" 会被 router 自己的 po: 匹配上 —— 于是 "service: po" 这条检查
      # 在根本没有 po 这个 service 的情况下也会通过,等于白做。
      SECTION() { awk -v s="  $1:" '$0==s{f=1;next} f&&/^  [a-z]/{exit} f' "$2" | sed -n 's/^    \([a-z0-9_-]*\):.*$/\1/p' | sort -u; }
      SVCS=$(SECTION services "$SRC/edge-dynamic.yml")
      MWS=$(SECTION middlewares "$SRC/edge-dynamic.yml")
      RTRS=$(SECTION routers "$SRC/edge-dynamic.yml")
      [ -n "$SVCS" ] && [ -n "$RTRS" ] || { echo "routers 或 services 段里一个键都没解析出来,拒绝部署"; exit 1; }
      MISSING=""
      for s in $(sed -n 's/^      service: *\([a-z0-9_-]*\).*/\1/p' "$SRC/edge-dynamic.yml" | sort -u); do
        echo "$SVCS" | grep -qx "$s" || MISSING="$MISSING service:$s"
      done
      for m in $(sed -n 's/^      middlewares: *\[\(.*\)\].*/\1/p' "$SRC/edge-dynamic.yml" | tr -d ' ' | tr ',' '\n' | sort -u); do
        [ -z "$m" ] && continue
        echo "$MWS" | grep -qx "$m" || MISSING="$MISSING middleware:$m"
      done
      [ -z "$MISSING" ] || { echo "路由表里有悬空引用:$MISSING"; exit 1; }
      echo "静态检查通过。"
      echo "  router:   $(echo $RTRS | tr '\n' ' ')"
      echo "  service:  $(echo $SVCS | tr '\n' ' ')"

      # ---------- 2. 准备私钥 ----------
      # File 类型变量带 CRLF 且末尾可能缺换行,直接用会 "error in libcrypto"。
      mkdir -p ~/.ssh
      tr -d '\r' < "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
      printf '\n' >> ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
      ssh-keygen -y -P "" -f ~/.ssh/id_deploy >/dev/null || { echo "私钥不可解析"; exit 1; }
      SSHOPT="-i $HOME/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      SSH="ssh $SSHOPT"

      # ---------- 3. 记下改之前的状态 ----------
      HASH() { $SSH "$DEPLOY_USER@$DEPLOY_HOST" "md5sum $HOST_DIR/$1 2>/dev/null | cut -d' ' -f1"; }
      # 只取 compose.yml 里某一个服务块。停止条件是"下一个 0 缩进或 2 缩进的行" ——
      # 2 缩进的既包括兄弟服务键,也包括服务之间那种分节注释(`  # ---- 前端 ----`),
      # 所以不会把下一个服务的注释算进来。块内的注释缩进都 >= 4 空格,不受影响。
      BLOCK() { $SSH "$DEPLOY_USER@$DEPLOY_HOST" "awk -v key='  $1:' '\\$0==key{inb=1; print; next} inb && (/^[^ ]/ || /^  [^ ]/){inb=0} inb{print}' $HOST_DIR/compose.yml 2>/dev/null | md5sum | cut -d' ' -f1"; }
      B_DYN=$(HASH edge-dynamic.yml); B_STATIC=$(HASH edge-static.yml)
      B_EDGE=$(BLOCK edge); B_TRAEFIK=$(BLOCK traefik)
      B_NGINX=$($SSH "$DEPLOY_USER@$DEPLOY_HOST" "cat $HOST_DIR/edge/*.conf 2>/dev/null | md5sum | cut -d' ' -f1")

      # 改之前的基线:状态码 + 响应体 md5。改完逐条对比,任何一条不一样就让 job 红。
      PATHS="/ /api/version /grafana/"
      BASE=$($SSH "$DEPLOY_USER@$DEPLOY_HOST" "for p in $PATHS; do printf '%s=%s/%s ' \"\$p\" \"\$(curl -sk -o /tmp/.eb -w '%{http_code}' --max-time 20 '$DOMAIN'\$p)\" \"\$(md5sum /tmp/.eb | cut -c1-8)\"; done; rm -f /tmp/.eb")
      echo "改之前的基线: $BASE"

      # ---------- 4. 原地同步 ----------
      # --inplace 是刻意的,理由见本 job 开头那段注释。不要换成普通 rsync 或 scp。
      # edge/ 自 !58 起是挂目录,所以可以用 --delete;两个 yml 是挂文件,只能逐个 --inplace。
      rsync --inplace -t -e "$SSH" --itemize-changes "$SRC/edge-static.yml"  "$DEPLOY_USER@$DEPLOY_HOST:$HOST_DIR/edge-static.yml"
      rsync --inplace -t -e "$SSH" --itemize-changes "$SRC/edge-dynamic.yml" "$DEPLOY_USER@$DEPLOY_HOST:$HOST_DIR/edge-dynamic.yml"
      rsync --inplace -t -e "$SSH" --itemize-changes "$SRC/compose.yml"      "$DEPLOY_USER@$DEPLOY_HOST:$HOST_DIR/compose.yml"
      rsync --inplace -rlt --delete -e "$SSH" --itemize-changes "$SRC/edge/" "$DEPLOY_USER@$DEPLOY_HOST:$HOST_DIR/edge/"

      # ---------- 5. 按改了什么决定做什么 ----------
      A_DYN=$(HASH edge-dynamic.yml); A_STATIC=$(HASH edge-static.yml)
      A_EDGE=$(BLOCK edge); A_TRAEFIK=$(BLOCK traefik)
      A_NGINX=$($SSH "$DEPLOY_USER@$DEPLOY_HOST" "cat $HOST_DIR/edge/*.conf 2>/dev/null | md5sum | cut -d' ' -f1")
      RECREATE=""
      [ "$B_DYN"     != "$A_DYN" ]     && { echo "edge-dynamic.yml(路由表)变了 → 不靠 watch 热加载,重建 traefik(理由见本 job 开头)"; RECREATE="$RECREATE traefik"; }
      [ "$B_STATIC"  != "$A_STATIC" ]  && { echo "edge-static.yml 变了 → traefik 启动时才读,要重建"; RECREATE="$RECREATE traefik"; }
      [ "$B_TRAEFIK" != "$A_TRAEFIK" ] && { echo "compose.yml 里 traefik 那一段变了 → 挂载点/端口可能变,要重建 traefik"; RECREATE="$RECREATE traefik"; }
      [ "$B_EDGE"    != "$A_EDGE" ]    && { echo "compose.yml 里 edge 那一段变了 → 挂载点/端口可能变,要重建 edge"; RECREATE="$RECREATE edge"; }
      if [ "$B_NGINX" != "$A_NGINX" ] && [ "$B_EDGE" = "$A_EDGE" ]; then
        echo "edge 的 nginx 配置变了 → 挂的是目录,reload 即可(不中断连接)"
        $SSH "$DEPLOY_USER@$DEPLOY_HOST" "cd $HOST_DIR && docker compose exec -T edge nginx -t" || { echo "新的 nginx 配置校验不通过,已停在这里。机器上的文件已是新版本,修好再点一次。"; exit 1; }
        $SSH "$DEPLOY_USER@$DEPLOY_HOST" "cd $HOST_DIR && docker compose exec -T edge nginx -s reload"
      fi
      if [ -n "$RECREATE" ]; then
        UNIQ=$(echo $RECREATE | tr ' ' '\n' | sort -u | tr '\n' ' ')
        case "$UNIQ" in
          *edge*) echo "重建:$UNIQ ——【edge 持有 443,重建它会有一两秒全站连接被拒】" ;;
          *)      echo "重建:$UNIQ ——【edge 不动,所以是几秒 502 而不是连接被拒,整站仍然可达】" ;;
        esac
        $SSH "$DEPLOY_USER@$DEPLOY_HOST" "cd $HOST_DIR && docker compose up -d --force-recreate --no-deps $UNIQ"
        sleep 12
      fi
      if [ -z "$RECREATE" ] && [ "$B_NGINX" = "$A_NGINX" ]; then
        echo "入口相关的配置一个字都没变,无事可做"
        echo "(compose.yml 里别的服务改了不由本 job 生效 —— 它们各自的部署按钮会重建自己那个容器)"
      fi

      # ---------- 6. 验证 ----------
      # 两个容器都得在跑。traefik 的镜像是 FROM scratch,所以只能看 docker 的健康状态。
      $SSH "$DEPLOY_USER@$DEPLOY_HOST" "docker ps --filter name=rp-ai-edge --filter name=rp-ai-traefik --format '  {{.Names}} {{.Status}}'"
      for c in rp-ai-edge rp-ai-traefik; do
        $SSH "$DEPLOY_USER@$DEPLOY_HOST" "docker ps --format '{{.Names}}' | grep -qx $c" || { echo "$c 没在跑"; exit 1; }
      done
      AFTER=$($SSH "$DEPLOY_USER@$DEPLOY_HOST" "for p in $PATHS; do printf '%s=%s/%s ' \"\$p\" \"\$(curl -sk -o /tmp/.ea -w '%{http_code}' --max-time 20 '$DOMAIN'\$p)\" \"\$(md5sum /tmp/.ea | cut -c1-8)\"; done; rm -f /tmp/.ea")
      echo "改之后: $AFTER"
      # 逐条对比。这几条是「不该因为改路由而变化」的核心路径 —— 变了就是回归,必须红。
      # 新增一条路由不会影响它们;真要故意改掉其中一条的行为,把它从 PATHS 里拿掉并说明理由。
      if [ "$BASE" != "$AFTER" ]; then
        echo "核心路径的状态码或响应体变了 —— 这是回归。"
        echo "  改之前: $BASE"
        echo "  改之后: $AFTER"
        echo "回滚:git revert 那个提交,再点一次这个按钮。"
        exit 1
      fi
      echo "核心路径与改之前完全一致,没有回归。"
      # 顺手把两侧的 5xx 数出来,只打印不判断 —— 这几分钟里的 5xx 可能来自别人的请求。
      $SSH "$DEPLOY_USER@$DEPLOY_HOST" "printf '  edge 近 5 分钟 5xx=%s\n' \"\$(docker logs --since 5m rp-ai-edge 2>&1 | grep -cE 'HTTP/[0-9.]+\" 5')\"; printf '  traefik 近 5 分钟 5xx=%s\n' \"\$(docker logs --since 5m rp-ai-traefik 2>&1 | grep -cE '\" 5[0-9][0-9] ')\""

# ---------- 版本集合 ----------
# 需求里的"前端版本 A + 服务 B 的 B1 + …组成一个稳定版本"。
#
# 真相在两处:机器上的 .env 是"声明用哪些版本",集群的 service spec(tag@sha256)是"实际跑的"。
# 版本集合就是把某一刻的这一组记下来,以后能整组重放。
#
# 为什么记录要人来提交而不是 CI 自动提交:本项目的推送规则是 reject_unsigned_commits,
# CI 没有签名能力。所以 capture 只负责打印,人贴进 deploy/<环境>/releases/<名字>.env 并提交
# —— 这样版本集合是可评审的,而且真相只有 git 一处。
.release-base:
  stage: deploy
  image: $REGISTRY/dockerhub-ericsson-remote/docker:26.1.4
  # 私钥不在这里准备:用哪把钥匙取决于形态(swarm 用 SWARM_SSH_KEY,compose 用 DEPLOY_SSH_KEY),
  # 而形态是在 script 里从 services.txt 读出来的。之前在这里做,$KEY_SRC 还是空的,报 can't open。
  before_script:
    - apk add --no-cache openssh-client rsync

# 备份门户自己的事实表。只在定时流水线里跑(手工也能点,见 rules)。
#
# 为什么是定时流水线而不是机器上的 cron:两台机器的 crontab 都是空的 —— 也就是说 cron 这条路上没人
# 留下过任何东西,放进去也没人会发现。这里有运行记录、失败会通知、脚本在 git 里能被评审,而且它和
# 已有的"每周清缓存"排在同一个地方,找运维相关的东西的人会看到。
#
# 产物**不进 artifact**:里面有用户 EID 与姓名,artifact 是所有能看流水线的人都能下载的。备份只留在
# 目标机器的 700 目录里。恢复步骤见 README 的"备份与恢复"。
backup-portal-facts:
  stage: check
  extends: .release-base
  rules:
    # 第一条必须是"部署流水线里不要出现" —— 被服务仓触发的部署流水线也跑在 main 上,如果这里只写
    # CI_COMMIT_BRANCH == "main",这个手动任务就会出现在**每一条部署流水线**里;而它在 check 阶段,
    # deploy 阶段的 apply 会因此永远不开始。实际后果:所有人的部署都卡住,而服务仓那边只看到
    # deploy-test 成功、线上没换。capture-release 与 apply-release 早就有这条守卫,我漏了。
    - if: '$DEPLOY_ENV'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $BACKUP == "true"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      # allow_failure 必须是 true。它在 check 阶段,而 `when: manual` 加 `allow_failure: false`
      # 会把整条流水线标成 blocked —— 后面的 publish 与 deploy 阶段永远不开始。实际撞到过:
      # 换镜像空间那次合并,publish-base 一直停在 created,因为这个按钮没人点。
      # 定时跑的那条规则不带 allow_failure(默认 false),所以定时备份失败照样让流水线红,这一点不变。
      allow_failure: true
  script:
    - |
      : "${DEPLOY_SSH_KEY:?未设置}"; : "${DEPLOY_HOST:?未设置}"; : "${DEPLOY_USER:?未设置}"
      # 私钥的处理照抄 templates/deploy.yml:去 CRLF、**补结尾换行**、600、再用 ssh-keygen 自检。
      # 少了结尾换行就会报 error in libcrypto,而那条报错完全看不出是缺一个换行 —— 这次又踩了一遍。
      mkdir -p ~/.ssh && chmod 700 ~/.ssh
      tr -d '\r' < "$DEPLOY_SSH_KEY" > ~/.ssh/id_backup
      printf '\n' >> ~/.ssh/id_backup && chmod 600 ~/.ssh/id_backup
      ssh-keygen -y -P "" -f ~/.ssh/id_backup >/dev/null || { echo "私钥不可解析"; exit 1; }
      SSHOPT="-i $HOME/.ssh/id_backup -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes"
      scp $SSHOPT templates/backup.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/rp-ai-backup.sh"
      ssh $SSHOPT "$DEPLOY_USER@$DEPLOY_HOST" \
        "KEEP_DAYS=${BACKUP_KEEP_DAYS:-7} sh /tmp/rp-ai-backup.sh; rc=\$?; rm -f /tmp/rp-ai-backup.sh; exit \$rc"

capture-release:
  extends: .release-base
  rules:
    - if: '$DEPLOY_ENV'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
  variables:
    RELEASE_ENV: test
  script:
    - |
      ENV_DIR="deploy/$RELEASE_ENV"
      test -f "$ENV_DIR/services.txt" || { echo "$ENV_DIR/services.txt 不存在"; exit 1; }
      MODES="$(grep -vE '^[[:space:]]*(#|$)' "$ENV_DIR/services.txt" \
                | sed -n 's/^[^:]*:[[:space:]]*\([a-z]*\).*/\1/p' | sort -u | tr '\n' ' ')"
      echo "环境 $RELEASE_ENV 的形态: $MODES"
      for MODE in $MODES; do
        case "$MODE" in
          swarm) KEY_SRC="$SWARM_SSH_KEY"; HOST="$SWARM_HOST"; USER="$SWARM_USER"; DIR="/opt/rp-ai/$RELEASE_ENV" ;;
          compose) KEY_SRC="$DEPLOY_SSH_KEY"; HOST="$DEPLOY_HOST"; USER="$DEPLOY_USER"
                   case "$RELEASE_ENV" in
                     test) DIR=/proj/rp_ait_prod/services/test-env ;;
                     prod) DIR=/proj/rp_ait_prod/services/prod-env ;;
                   esac ;;
          *) echo "未知形态 $MODE"; exit 1 ;;
        esac
        mkdir -p ~/.ssh
        tr -d '\r' < "$KEY_SRC" > ~/.ssh/id_deploy
        printf '\n' >> ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
        SSHB="-i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        scp $SSHB templates/release.sh "$USER@$HOST:$DIR/release.sh"
        echo "================ $MODE 形态的版本集合 ================"
        ssh $SSHB "$USER@$HOST" "chmod +x '$DIR/release.sh' && '$DIR/release.sh' capture '$RELEASE_ENV' '$MODE'"
      done
      echo "================================================="
      echo "把上面的内容存成 deploy/$RELEASE_ENV/releases/<名字>.env 提交,即固定为一个版本集合。"

apply-release:
  extends: .release-base
  rules:
    - if: '$DEPLOY_ENV'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $RELEASE'
      when: manual
      allow_failure: false
  variables:
    RELEASE_ENV: test
  environment:
    name: $RELEASE_ENV
  script:
    - |
      : "${RELEASE:?要传版本集合的名字}"
      ENV_DIR="deploy/$RELEASE_ENV"
      FILE="$ENV_DIR/releases/$RELEASE.env"
      test -f "$FILE" || { echo "$FILE 不存在"; exit 1; }
      # 文件头里的环境必须与要重放的环境一致。采集任务默认采 test(变量名是 RELEASE_ENV),
      # 传错名字它会静默采出一份 test 的标签;那份文件被存进 deploy/prod/releases/ 之后,
      # 重放就会把测试环境的镜像部署到生产。文件路径拦不住这个错,只有内容能。
      CAPTURED="$(sed -n 's/^#.*环境=\([a-z]*\).*/\1/p' "$FILE" | head -1)"
      if [ -z "$CAPTURED" ]; then
        echo "$FILE 的头部没有『环境=<名字>』那一行,无法确认它采自哪个环境。"
        echo "capture-release 的输出自带这一行,请不要手工删掉它。"; exit 1
      fi
      if [ "$CAPTURED" != "$RELEASE_ENV" ]; then
        echo "拒绝重放:这份版本集合采自 $CAPTURED,而你要重放到 $RELEASE_ENV。"
        echo "两个环境的镜像标签不一样,照着放会把 $CAPTURED 的版本部署到 $RELEASE_ENV。"; exit 1
      fi
      echo "版本集合采自 $CAPTURED,与目标环境一致"
      echo "要重放的版本集合:"; grep -vE '^\s*(#|$)' "$FILE" | sed 's/^/  /'
      PAIRS="$(grep -vE '^\s*(#|$)' "$FILE" | sed 's/#.*//' | tr -d ' ' | tr '\n' ' ')"
      [ -n "$PAIRS" ] || { echo "$FILE 里没有 变量名=标签"; exit 1; }
      MODES="$(grep -vE '^[[:space:]]*(#|$)' "$ENV_DIR/services.txt" \
                | sed -n 's/^[^:]*:[[:space:]]*\([a-z]*\).*/\1/p' | sort -u | tr '\n' ' ')"
      for MODE in $MODES; do
        case "$MODE" in
          swarm) KEY_SRC="$SWARM_SSH_KEY"; HOST="$SWARM_HOST"; USER="$SWARM_USER"; DIR="/opt/rp-ai/$RELEASE_ENV" ;;
          compose) KEY_SRC="$DEPLOY_SSH_KEY"; HOST="$DEPLOY_HOST"; USER="$DEPLOY_USER"
                   case "$RELEASE_ENV" in
                     test) DIR=/proj/rp_ait_prod/services/test-env ;;
                     prod) DIR=/proj/rp_ait_prod/services/prod-env ;;
                   esac ;;
        esac
        mkdir -p ~/.ssh
        tr -d '\r' < "$KEY_SRC" > ~/.ssh/id_deploy
        printf '\n' >> ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
        SSHB="-i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        # 先同步环境描述,再重放版本号。少了这一步,重放出来的是"机器上那份描述 + 这组版本",
        # 描述改过之后就复现不出目标状态 —— 换镜像空间那次就是这样:版本重放成功,但机器上的
        # compose.yml 还是旧的镜像路径,于是拉的还是旧空间的镜像。
        # 排除 *.env:密钥与本环境的版本记录由部署任务维护,不在 git 里。
        ssh $SSHB "$USER@$HOST" "mkdir -p '$DIR' && chmod 750 '$DIR'"
        rsync -az --delete --exclude ".env" --exclude "*.env" -e "ssh $SSHB" "$ENV_DIR/" "$USER@$HOST:$DIR/"
        if [ "$MODE" = swarm ]; then
          scp $SSHB templates/swarm-apply.sh "$USER@$HOST:$DIR/swarm-apply.sh"
          ssh $SSHB "$USER@$HOST" "chmod +x '$DIR/swarm-apply.sh' && '$DIR/swarm-apply.sh' '$RELEASE_ENV' $PAIRS"
        else
          TARGETS="$(sed -n 's/^[^:]*:[[:space:]]*compose[[:space:]]*//p' "$ENV_DIR/services.txt" | tr '\n' ' ')"
          scp $SSHB templates/release.sh "$USER@$HOST:$DIR/release.sh"
          ssh $SSHB "$USER@$HOST" "chmod +x '$DIR/release.sh' && '$DIR/release.sh' apply-compose '$RELEASE_ENV' $TARGETS -- $PAIRS"
        fi
      done

# 被服务仓的部署按钮触发时执行部署。
include:
  - local: templates/deploy.yml
