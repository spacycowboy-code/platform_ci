# platform-ci 自己的流水线:
#   * 校验模板能被解析(消费方锁 tag,坏模板不该发布出去)
#   * 构建并推送基础镜像
#
# 基础镜像标签有两个:<pyver>-<sha>(不可变,用于追溯)与 <pyver>-latest(浮动,
# 供服务流水线的默认 base_tag 使用)。服务的**产物**标签始终不可变;基础镜像的
# 浮动标签只影响下一次构建,不影响已发布的服务镜像。
stages: [check, publish, deploy]

variables:
  REGISTRY: "armdocker.rnd.ericsson.se"
  BASE: "armdocker.rnd.ericsson.se/proj-rvc/rp-ai/python-base"
  PY_VERSION: "3.12"

check-templates:
  stage: check
  image: $REGISTRY/dockerhub-ericsson-remote/python:3.12-slim
  script:
    - pip install --quiet pyyaml
    - |
      python - <<'PY'
      import pathlib, sys, yaml
      bad = 0
      for p in sorted(pathlib.Path("templates").glob("*.yml")):
          head, _, body = p.read_text(encoding="utf-8").partition("\n---\n")
          try:
              spec = yaml.safe_load(head)
              jobs = yaml.safe_load(body)
          except Exception as exc:
              print(f"{p}: 解析失败 {exc}"); bad = 1; continue
          inputs = ((spec or {}).get("spec") or {}).get("inputs") or {}
          required = [k for k, v in inputs.items() if not isinstance(v, dict) or "default" not in v]
          print(f"{p}: 输入 {len(inputs)} 个(必填 {len(required)}: {required}),"
                f"任务 {[k for k in jobs if k not in ('default','stages','variables','cache','workflow')]}")
      sys.exit(bad)
      PY
    # Dockerfile 至少要能被 docker 解析:交给下一阶段的实际构建验证。

publish-base:
  stage: publish
  # runner 不允许 privileged,所以没有 docker daemon 可用(dind 报
  # "mount: permission denied")。kaniko 在用户态构建,不需要守护进程。
  image:
    name: $REGISTRY/gcr-ericsson-remote/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - |
      : "${docker_user:?未设置}"; : "${docker_password:?未设置}"
      mkdir -p /kaniko/.docker
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY" \
        "$(printf '%s:%s' "$docker_user" "$docker_password" | base64 | tr -d '\n')" \
        > /kaniko/.docker/config.json
    - /kaniko/executor
        --context "$CI_PROJECT_DIR"
        --dockerfile "$CI_PROJECT_DIR/docker/Dockerfile.base"
        --build-arg "PY_VERSION=$PY_VERSION"
        --destination "$BASE:$PY_VERSION-$CI_COMMIT_SHORT_SHA"
        --snapshot-mode=redo --single-snapshot
    - echo "已发布 $BASE:$PY_VERSION-$CI_COMMIT_SHORT_SHA"
    # 不再发 <pyver>-latest:没有消费者该用浮动标签,而它的存在正好让"同一份源码
    # 构出不同产物"这种错误有机可乘——本项目已经踩过一次(见 DESIGN.md)。
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [docker/Dockerfile.base, .gitlab-ci.yml]

# 环境部署:每个环境一个任务,只在该环境的描述变更时触发。
include:
  - local: templates/deploy-env.yml
    inputs:
      env: prod
      dir: /proj/rp_ait_prod/services/prod-env
      when: manual
      env_files: "product-structure-information.env=PSI_PROD_ENV ai-portal-be.env=AUDIT_PROD_ENV grafana.env=GRAFANA_PROD_ENV"
  - local: templates/deploy-env.yml
    inputs:
      env: staging-audit
      dir: /proj/rp_ait_prod/services/staging-audit-env
      when: manual
      env_files: "audit-staging.env=AUDIT_STAGING_ENV"
