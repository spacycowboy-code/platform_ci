# 前端流水线:构建静态资源,打成 nginx 镜像并推不可变标签。
#
# 与 Python 服务同一套不变量:kaniko 构建、标签含 commit、标签不可覆盖、部署只拉不建。
#
# 一个产物跑所有环境:nginx 官方镜像会对 /etc/nginx/templates/*.template 做 envsubst,
# 所以后端上游地址由环境注入,不编译进镜像。服务仓提供 nginx.conf.template,
# 里面用 ${...} 占位——路由是服务的事,上游是环境的事。

spec:
  inputs:
    service:
      description: "镜像名,会拼成 proj-rvc/rp-ai/<service>"
    dist_dir:
      description: "构建产物目录,相对于 context,如 dist/app/browser"
    context:
      default: "."
      description: "前端工程所在子目录"
    build_command:
      default: "npm run build"
      default: "//arm.sero.gic.ericsson.se/artifactory/api/npm/proj-bce-npm/"
---

include:
  - local: templates/_build-common.yml

variables:
  REGISTRY: "armdocker.rnd.ericsson.se"
  IMAGE: "armdocker.rnd.ericsson.se/proj-rvc/rp-ai/$[[ inputs.service ]]"

stages: [build]

build:
  stage: build
  extends: .kaniko
  variables:
    TAG: "$CI_COMMIT_SHORT_SHA"
    CTX: "$CI_PROJECT_DIR/$[[ inputs.context ]]"
  script:
    # 私有 registry 的凭据写进构建上下文里的 .npmrc,而不是 --build-arg:
    # build-arg 会留在镜像配置里,而上下文不会被推送。
    - |
      if [ -n "$NPM_AUTH_B64" ]; then
        {
          echo "//arm.sero.gic.ericsson.se/artifactory/api/npm/proj-bce-npm/:_auth=$NPM_AUTH_B64"
          echo "//arm.sero.gic.ericsson.se/artifactory/api/npm/proj-bce-npm/:always-auth=true"
        } >> "$CTX/.npmrc"
        echo "已注入 npm 凭据(仅存在于构建上下文)"
      fi
    - |
      cat > "$CTX/Dockerfile.thin" <<EOF
      FROM $REGISTRY/dockerhub-ericsson-remote/node:22-alpine AS build
      WORKDIR /app
      COPY package.json package-lock.json .npmrc ./
      RUN npm ci && rm -f .npmrc
      COPY . .
      RUN $[[ inputs.build_command ]]

      FROM $REGISTRY/dockerhub-ericsson-remote/nginx:1.27-alpine
      # 上游地址由环境在容器启动时注入(nginx 官方镜像对 templates 做 envsubst)。
      COPY nginx.conf.template /etc/nginx/templates/default.conf.template
      COPY --from=build /app/$[[ inputs.dist_dir ]] /usr/share/nginx/html
      EOF
      grep -v _auth "$CTX/Dockerfile.thin"
    - !reference [.tag-guard, script]
    - |
      # 不推送时只构建做校验,推送时才写标签(打了 git tag 就多推一个同名标签)。
      if [ "${PUSH_IMAGE:-false}" = "true" ]; then
        DEST="--destination $IMAGE:$TAG"
        [ -n "$CI_COMMIT_TAG" ] && DEST="$DEST --destination $IMAGE:$CI_COMMIT_TAG"
      else
        DEST="--no-push"
        echo "MR 流水线:只校验构建,不推送镜像"
      fi
    - |
      /kaniko/executor \
        --context "$CTX" \
        --dockerfile "$CTX/Dockerfile.thin" \
        $DEST \
        --snapshot-mode=redo --single-snapshot
    - echo "推送完成:$IMAGE:$TAG"
    - |
      if [ "${PUSH_IMAGE:-false}" = "true" ]; then
        echo "================ 怎么发布这个产物 ================"
        echo "把环境描述里对应服务的 image 改成下面这一行:"
        echo
        echo "    image: $IMAGE:$TAG"
        echo
        echo "验收(改完自动部署): $CI_SERVER_URL/rp-ai-miao/platform-ci/-/edit/main/deploy/staging-audit/compose.yml"
        echo "生产(改完还要手动触发 deploy-prod): $CI_SERVER_URL/rp-ai-miao/platform-ci/-/edit/main/deploy/prod/compose.yml"
        echo "=================================================="
      fi
  rules:
    # main:产出发布用的镜像。
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        PUSH_IMAGE: "true"
    # 任意分支,手动带上 BUILD_IMAGE=1:也产出镜像,用于把该分支放到验收环境。
    - if: '$CI_COMMIT_BRANCH && $BUILD_IMAGE == "1"'
      variables:
        PUSH_IMAGE: "true"
    # MR:只验证能不能构建,不推送。镜像仓库里的标签删不掉(推送账号无删除权限),
    # 每个 MR 提交都推一个会让仓库无限累积。
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        PUSH_IMAGE: "false"
