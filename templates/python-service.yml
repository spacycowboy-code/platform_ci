# 服务流水线:lint / test / 构建并推镜像。部署不在这里——部署是环境的动作,
# 由 platform-ci 的 deploy/ 目录驱动(见 DESIGN.md)。
#
# 消费仓的 .gitlab-ci.yml:
#
#   include:
#     - project: rp-ai-miao/platform-ci
#       ref: v0.2.0                 # 锁 tag,不要用 main
#       file: templates/python-service.yml
#       inputs:
#         service: product-structure-information
#         app_module: hw_change_analysis.app:app
#
# 需要的组级变量:docker_user / docker_password(推镜像用)。
# 服务仓不需要 Dockerfile,也不需要 compose。

# 服务只声明属于自己的东西。Python 版本、基础镜像、ruff 版本都由平台决定,
# 不作为输入——它们同时出现在 lint/test 与构建里,分开设置只会出现不一致。
spec:
  inputs:
    service:
      description: "镜像名,同时用作容器名:proj-rvc/rp-ai/<service>"
    app_module:
      description: "uvicorn 应用路径,例如 hw_change_analysis.app:app"
    apt_packages:
      default: ""
      description: "本服务额外的系统包,空则不装"
    extra_pip:
      default: ""
      description: "本服务额外的 pip 安装命令,例如 pipx 装的 CLI 工具"
    ruff_select:
      # 阻塞的规则集。平台给下限,服务可以提高:
      # E9 语法错误、F63/F7 明显写错的表达式、F82 未定义名字——这些报出来基本都是真问题。
      default: "E9,F63,F7,F82"
      description: "会让流水线失败的 ruff 规则"
---

include:
  - local: templates/_build-common.yml

default:
  image: armdocker.rnd.ericsson.se/proj-rvc/rp-ai/python-base:3.12-b3708562

stages: [lint, test, build]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  REGISTRY: "armdocker.rnd.ericsson.se"
  IMAGE: "armdocker.rnd.ericsson.se/proj-rvc/rp-ai/$[[ inputs.service ]]"
  BASE_IMAGE: "armdocker.rnd.ericsson.se/proj-rvc/rp-ai/python-base:3.12-b3708562"

cache:
  key:
    files: [requirements.txt]
  paths: [.pip-cache/]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

lint:
  stage: lint
  image: armdocker.rnd.ericsson.se/proj-rvc/rp-ai/python-base:3.12-b3708562
  before_script:
    - pip install -q ruff==0.8.4
  script:
    # 阻塞的只有这几类:语法错误、未定义名字、f-string 缺占位符——几乎不会误报,
    # 报出来就是真问题。全量检查只提示:存量告警清不清,是各服务自己的事。
    - ruff check --select $[[ inputs.ruff_select ]] --output-format=concise .
    - ruff check --output-format=concise . || echo "(以上为提示,不阻塞)"

test:
  stage: test
  image: armdocker.rnd.ericsson.se/proj-rvc/rp-ai/python-base:3.12-b3708562
  before_script:
    - pip install -q --upgrade pip
    - pip install -q -r requirements.txt
    # 测试依赖归服务:仓里有 requirements-dev.txt 就用它,平台不猜。
    - |
      if [ -f requirements-dev.txt ]; then
        pip install -q -r requirements-dev.txt
      else
        pip install -q pytest
      fi
  script:
    # 先确认应用能被导入:导入失败时 pytest 的报错往往指向别处。
    - python -c "import importlib,os; importlib.import_module(os.environ['APP_MODULE'].split(':')[0]); print('导入正常')"
    - |
      # 仓库根目录要可导入:测试文件常以 <包>.tests.<模块> 引用自己,
      # 缺这一行会得到 ModuleNotFoundError。
      export PYTHONPATH="$CI_PROJECT_DIR:$PYTHONPATH"
      ec=0
      pytest -q || ec=$?
      # 5 = 没收集到测试。仓里还没有测试不算失败,但要说出来。
      if [ "$ec" -eq 5 ]; then echo "该仓还没有测试"; ec=0; fi
      exit "$ec"
  variables:
    APP_MODULE: "$[[ inputs.app_module ]]"

# 构建薄层并推不可变标签。薄层在这里生成,所以服务仓没有 Dockerfile。
# 用 kaniko 而非 docker build:runner 不允许 privileged,没有守护进程可用。
# 标签含 commit sha;已存在则跳过(见 _build-common.yml 的 .tag-guard)。
build:
  stage: build
  extends: .kaniko
  variables:
    # 产物由 commit 标识。服务仓打 git tag 时,那次流水线会额外推一个同名标签。
    TAG: "$CI_COMMIT_SHORT_SHA"
    APT_PACKAGES: "$[[ inputs.apt_packages ]]"
    EXTRA_PIP: "$[[ inputs.extra_pip ]]"
    APP_MODULE: "$[[ inputs.app_module ]]"
  script:
    - !reference [.tag-guard, script]
    # 引号包住的 heredoc:下面就是 Dockerfile 原文,不做任何变量替换。
    # 可变的部分都是 ARG,由 kaniko 用 --build-arg 传进去。
    - |
      cat > Dockerfile.thin <<'DOCKERFILE'
      ARG BASE_IMAGE
      FROM ${BASE_IMAGE}

      ARG APT_PACKAGES=""
      RUN if [ -n "$APT_PACKAGES" ]; then \
            apt-get update && \
            apt-get install -y --no-install-recommends $APT_PACKAGES && \
            rm -rf /var/lib/apt/lists/*; \
          fi

      COPY requirements.txt .
      RUN pip install --no-cache-dir -r requirements.txt

      ARG EXTRA_PIP=""
      RUN if [ -n "$EXTRA_PIP" ]; then sh -c "$EXTRA_PIP"; fi

      COPY . .

      ARG APP_MODULE
      ARG GIT_COMMIT
      ENV APP_MODULE=${APP_MODULE} APP_GIT_COMMIT=${GIT_COMMIT}
      DOCKERFILE
    - |
      # 约定:仓库根目录有 docker-entrypoint.sh 就用它作容器入口(启动前跑迁移之类)。
      # Dockerfile 表达不了条件 ENTRYPOINT,所以在这里追加。
      if [ -f docker-entrypoint.sh ]; then
        printf 'RUN chmod +x /app/docker-entrypoint.sh\nENTRYPOINT ["/app/docker-entrypoint.sh"]\n' >> Dockerfile.thin
        echo "检测到 docker-entrypoint.sh,已设为容器入口"
      fi
      cat Dockerfile.thin
    - |
      # 不推送时只构建做校验,推送时才写标签(打了 git tag 就多推一个同名标签)。
      if [ "${PUSH_IMAGE:-false}" = "true" ]; then
        DEST="--destination $IMAGE:$TAG"
        [ -n "$CI_COMMIT_TAG" ] && DEST="$DEST --destination $IMAGE:$CI_COMMIT_TAG"
      else
        DEST="--no-push"
        echo "MR 流水线:只校验构建,不推送镜像"
      fi
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile.thin" \
        --build-arg "BASE_IMAGE=$BASE_IMAGE" \
        --build-arg "APT_PACKAGES=$APT_PACKAGES" \
        --build-arg "EXTRA_PIP=$EXTRA_PIP" \
        --build-arg "APP_MODULE=$APP_MODULE" \
        --build-arg "GIT_COMMIT=$CI_COMMIT_SHORT_SHA" \
        $DEST \
        --snapshot-mode=redo --single-snapshot \
        --skip-unused-stages
    - echo "推送完成:$IMAGE:$TAG"
    - |
      if [ "${PUSH_IMAGE:-false}" = "true" ]; then
        echo "================ 怎么发布这个产物 ================"
        echo "把环境描述里对应服务的 image 改成下面这一行:"
        echo
        echo "    image: $IMAGE:$TAG"
        echo
        echo "验收(改完自动部署): $CI_SERVER_URL/rp-ai-miao/platform-ci/-/edit/main/deploy/staging-audit/compose.yml"
        echo "生产(改完还要手动触发 deploy-prod): $CI_SERVER_URL/rp-ai-miao/platform-ci/-/edit/main/deploy/prod/compose.yml"
        echo "=================================================="
      fi
  rules:
    # main:产出发布用的镜像。
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        PUSH_IMAGE: "true"
    # 任意分支,手动带上 BUILD_IMAGE=1:也产出镜像,用于把该分支放到验收环境。
    - if: '$CI_COMMIT_BRANCH && $BUILD_IMAGE == "1"'
      variables:
        PUSH_IMAGE: "true"
    # MR:只验证能不能构建,不推送。镜像仓库里的标签删不掉(推送账号无删除权限),
    # 每个 MR 提交都推一个会让仓库无限累积。
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        PUSH_IMAGE: "false"
