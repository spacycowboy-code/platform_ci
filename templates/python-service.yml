# 服务流水线:lint / test / 构建并推镜像。部署不在这里——部署是环境的动作,
# 由 platform-ci 的 deploy/ 目录驱动(见 DESIGN.md)。
#
# 消费仓的 .gitlab-ci.yml:
#
#   include:
#     - project: rp-ai-miao/platform-ci
#       ref: v0.2.0                 # 锁 tag,不要用 main
#       file: templates/python-service.yml
#       inputs:
#         service: product-structure-information
#         app_module: hw_change_analysis.app:app
#
# 需要的组级变量:docker_user / docker_password(推镜像用)。
# 服务仓不需要 Dockerfile,也不需要 compose。

spec:
  inputs:
    service:
      description: "镜像名,同时用作容器名:proj-rvc/rp-ai/<service>"
    app_module:
      description: "uvicorn 应用路径,例如 hw_change_analysis.app:app"
    version:
      default: "0.1"
      description: "语义版本前缀;完整标签是 <version>-<short-sha>"
    python_version:
      default: "3.12"
    base_tag:
      default: "3.12-latest"
      description: "基础镜像标签,由 platform-ci 发布"
    apt_packages:
      default: ""
      description: "本服务额外的系统包,空则不装"
    extra_pip:
      default: ""
      description: "本服务额外的 pip 安装命令,例如 pipx 装的 CLI 工具"
    ruff_version:
      default: "0.8.4"
---

default:
  image: python:$[[ inputs.python_version ]]-slim

stages: [lint, test, build]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  REGISTRY: "armdocker.rnd.ericsson.se"
  IMAGE: "armdocker.rnd.ericsson.se/proj-rvc/rp-ai/$[[ inputs.service ]]"
  BASE_IMAGE: "armdocker.rnd.ericsson.se/proj-rvc/rp-ai/python-base:$[[ inputs.base_tag ]]"

cache:
  key:
    files: [requirements.txt]
  paths: [.pip-cache/]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

lint:
  stage: lint
  before_script:
    - pip install ruff==$[[ inputs.ruff_version ]]
  script:
    - ruff check .
  allow_failure: true

test:
  stage: test
  before_script:
    - pip install -r requirements.txt pytest
  script:
    # 起不来的应用不值得跑测试。
    - python -c "import importlib; m,_,a='$[[ inputs.app_module ]]'.partition(':'); getattr(importlib.import_module(m), a); print('app imported OK')"
    # 没有测试(pytest 退出码 5)不算失败;本服务要跳过的测试写在自己的 pytest 配置里。
    - |
      export PYTHONPATH="$CI_PROJECT_DIR:$PYTHONPATH"
      ec=0; pytest -q || ec=$?
      [ "$ec" -eq 5 ] && { echo "No tests collected yet"; ec=0; }
      exit "$ec"

# 构建薄层并推不可变标签。薄层在这里生成,所以服务仓没有 Dockerfile。
# 同一标签只推一次:标签含 commit sha,重复流水线会命中已存在的标签并跳过。
build:
  stage: build
  image: $REGISTRY/dockerhub-ericsson-remote/docker:26.1.4
  services:
    - name: $REGISTRY/dockerhub-ericsson-remote/docker:26.1.4-dind
      alias: docker
  variables:
    TAG: "$[[ inputs.version ]]-$CI_COMMIT_SHORT_SHA"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  script:
    - |
      : "${docker_user:?未设置 — 在组级 CI 变量里配置}"
      : "${docker_password:?未设置 — 在组级 CI 变量里配置}"
      echo "$docker_password" | docker login "$REGISTRY" -u "$docker_user" --password-stdin
    - |
      if docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
        echo "$IMAGE:$TAG 已存在,跳过构建(标签不可覆盖)"; exit 0
      fi
    - |
      cat > Dockerfile.thin <<EOF
      FROM $BASE_IMAGE
      $([ -n "$[[ inputs.apt_packages ]]" ] && echo "RUN apt-get update && apt-get install -y --no-install-recommends $[[ inputs.apt_packages ]] && rm -rf /var/lib/apt/lists/*")
      COPY requirements.txt .
      RUN pip install --no-cache-dir -r requirements.txt
      $([ -n "$[[ inputs.extra_pip ]]" ] && echo "RUN $[[ inputs.extra_pip ]]")
      COPY . .
      ENV APP_MODULE=$[[ inputs.app_module ]] APP_GIT_COMMIT=$CI_COMMIT_SHORT_SHA
      EOF
      cat Dockerfile.thin
    - docker build -f Dockerfile.thin -t "$IMAGE:$TAG" .
    - docker push "$IMAGE:$TAG"
    - echo "推送完成:$IMAGE:$TAG — 在 platform-ci 的 deploy/<env>/compose.yml 里改成这个标签即发布"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
