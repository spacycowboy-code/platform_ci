# 服务流水线:lint / test / 构建并推镜像。部署不在这里——部署是环境的动作,
# 由 platform-ci 的 deploy/ 目录驱动(见 DESIGN.md)。
#
# 消费仓的 .gitlab-ci.yml:
#
#   include:
#     - project: rp-ai-miao/platform-ci
#       ref: v0.2.0                 # 锁 tag,不要用 main
#       file: templates/python-service.yml
#       inputs:
#         service: product-structure-information
#         app_module: hw_change_analysis.app:app
#
# 需要的组级变量:docker_user / docker_password(推镜像用)。
# 服务仓不需要 Dockerfile,也不需要 compose。

spec:
  inputs:
    service:
      description: "镜像名,同时用作容器名:proj-rvc/rp-ai/<service>"
    app_module:
      description: "uvicorn 应用路径,例如 hw_change_analysis.app:app"
    version:
      default: "0.1"
      description: "语义版本前缀;完整标签是 <version>-<short-sha>"
    python_version:
      default: "3.12"
    base_tag:
      # 固定标签,不用 latest:同一份源码配上后来的基础镜像会构出不同产物,
      # 那样"标签能反查 commit"就只在服务层成立。基础镜像换代由平台改这里并发版本。
      default: "3.12-b3708562"
      description: "基础镜像标签,由 platform-ci 发布"
    apt_packages:
      default: ""
      description: "本服务额外的系统包,空则不装"
    entrypoint:
      # 容器启动前要先做的事(如先跑数据库迁移)。给的是仓里的脚本路径,
      # 由它自己在结尾 exec 真正的进程——启动方式属于服务。
      default: ""
      description: "仓内的 entrypoint 脚本路径"
    extra_pip:
      default: ""
      description: "本服务额外的 pip 安装命令,例如 pipx 装的 CLI 工具"
    ruff_version:
      default: "0.8.4"
---

include:
  - local: templates/_build-common.yml

default:
  image: python:$[[ inputs.python_version ]]-slim

stages: [lint, test, build]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  REGISTRY: "armdocker.rnd.ericsson.se"
  IMAGE: "armdocker.rnd.ericsson.se/proj-rvc/rp-ai/$[[ inputs.service ]]"
  BASE_IMAGE: "armdocker.rnd.ericsson.se/proj-rvc/rp-ai/python-base:$[[ inputs.base_tag ]]"

cache:
  key:
    files: [requirements.txt]
  paths: [.pip-cache/]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

lint:
  stage: lint
  image: python:$[[ inputs.python_version ]]-slim
  before_script:
    - pip install -q ruff==$[[ inputs.ruff_version ]]
  script:
    # 阻塞的只有这几类:语法错误、未定义名字、f-string 缺占位符——几乎不会误报,
    # 报出来就是真问题。全量检查只提示:存量告警清不清,是各服务自己的事。
    - ruff check --select E9,F63,F7,F82 --output-format=concise .
    - ruff check --output-format=concise . || echo "(以上为提示,不阻塞)"

test:
  stage: test
  image: python:$[[ inputs.python_version ]]-slim
  before_script:
    - pip install -q --upgrade pip
    - pip install -q -r requirements.txt
    # 测试依赖归服务:仓里有 requirements-dev.txt 就用它,平台不猜。
    - |
      if [ -f requirements-dev.txt ]; then
        pip install -q -r requirements-dev.txt
      else
        pip install -q pytest
      fi
  script:
    # 先确认应用能被导入:导入失败时 pytest 的报错往往指向别处。
    - python -c "import importlib,os; importlib.import_module(os.environ['APP_MODULE'].split(':')[0]); print('导入正常')"
    - |
      # 仓库根目录要可导入:测试文件常以 <包>.tests.<模块> 的形式引用自己。
      # 这一行在 v0.4.3 重写这个任务时被我丢掉了,直到 product-structure-information
      # 升上来才暴露(ModuleNotFoundError)。
      export PYTHONPATH="$CI_PROJECT_DIR:$PYTHONPATH"
      ec=0
      pytest -q || ec=$?
      # 5 = 没收集到测试。仓里还没有测试不算失败,但要说出来。
      if [ "$ec" -eq 5 ]; then echo "该仓还没有测试"; ec=0; fi
      exit "$ec"
  variables:
    APP_MODULE: "$[[ inputs.app_module ]]"

# 构建薄层并推不可变标签。薄层在这里生成,所以服务仓没有 Dockerfile。
# 用 kaniko 而非 docker build:runner 不允许 privileged,没有守护进程可用。
# 标签含 commit sha;已存在则跳过(见 _build-common.yml 的 .tag-guard)。
build:
  stage: build
  extends: .kaniko
  variables:
    # 产物由它的 commit 标识。需要语义化版本时在服务仓打 git tag,
    # 那次流水线会额外推一个同名标签——版本号是服务的事,不该由平台给默认值。
    TAG: "$CI_COMMIT_SHORT_SHA"
  script:
    - !reference [.tag-guard, script]
    - |
      cat > Dockerfile.thin <<EOF
      FROM $BASE_IMAGE
      $([ -n "$[[ inputs.apt_packages ]]" ] && echo "RUN apt-get update && apt-get install -y --no-install-recommends $[[ inputs.apt_packages ]] && rm -rf /var/lib/apt/lists/*")
      COPY requirements.txt .
      RUN pip install --no-cache-dir -r requirements.txt
      $([ -n "$[[ inputs.extra_pip ]]" ] && echo "RUN $[[ inputs.extra_pip ]]")
      COPY . .
      ENV APP_MODULE=$[[ inputs.app_module ]] APP_GIT_COMMIT=$CI_COMMIT_SHORT_SHA
      $([ -n "$[[ inputs.entrypoint ]]" ] && echo "RUN chmod +x $[[ inputs.entrypoint ]]")
      $([ -n "$[[ inputs.entrypoint ]]" ] && echo "ENTRYPOINT [\"$[[ inputs.entrypoint ]]\"]")
      EOF
      cat Dockerfile.thin
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile.thin" \
        --destination "$IMAGE:$TAG" \
        ${CI_COMMIT_TAG:+--destination "$IMAGE:$CI_COMMIT_TAG"} \
        --snapshot-mode=redo --single-snapshot \
        --skip-unused-stages
    - echo "推送完成:$IMAGE:$TAG — 在 platform-ci 的 deploy/<env>/compose.yml 里改成这个标签即发布"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
