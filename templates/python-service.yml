# 后端服务的共享流水线:lint + test + deploy。
#
# 用法(消费仓的 .gitlab-ci.yml):
#
#   include:
#     - project: rp-ai-miao/platform-ci
#       ref: v0.1.0            # 必须锁 tag,不要用 main
#       file: templates/python-service.yml
#       inputs:
#         app_module: "api:app"
#         rsync_excludes: "--exclude \"data/\""
#
# 消费仓仍需自备的 CI 变量:DEPLOY_HOST / DEPLOY_USER / DEPLOY_DIR /
# DEPLOY_SSH_KEY(File) / PROD_ENV(File),可选 DEPLOY_PORT。这些是各仓私有,
# 不上提到组级。

spec:
  inputs:
    app_module:
      description: "uvicorn 的应用路径,例如 api:app"
    python_version:
      default: "3.12"
      description: "构建与测试用的 Python 版本"
    ruff_version:
      default: "0.8.4"
    rsync_excludes:
      default: ""
      description: '部署同步时额外排除的路径,例如 --exclude "data/"'
    import_check:
      type: boolean
      default: true
      description: "test 阶段是否做一次导入自检"
    deploy_when:
      default: "manual"
      options: ["manual", "on_success"]
      description: "main 分支上的部署是手动还是自动"
---

default:
  image: python:$[[ inputs.python_version ]]-slim

stages:
  - lint
  - test
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

cache:
  key:
    files:
      - requirements.txt
  paths:
    - .pip-cache/

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

lint:
  stage: lint
  before_script:
    - python -m pip install --upgrade pip
    - pip install ruff==$[[ inputs.ruff_version ]]
  script:
    - ruff check .
  allow_failure: true

test:
  stage: test
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pytest
  script:
    # 导入自检:能起来的应用才值得跑测试。
    - |
      if [ "$[[ inputs.import_check ]]" = "true" ]; then
        python -c "from $(echo '$[[ inputs.app_module ]]' | cut -d: -f1) import $(echo '$[[ inputs.app_module ]]' | cut -d: -f2); print('app imported OK')"
      fi
    # 没有测试(pytest 退出码 5)不算失败;仓库自己的排除项写在自己的 pytest 配置里。
    - |
      export PYTHONPATH="$CI_PROJECT_DIR:$PYTHONPATH"
      ec=0
      pytest -q || ec=$?
      if [ "$ec" -eq 5 ]; then echo "No tests collected yet"; ec=0; fi
      exit "$ec"

# 部署:把代码同步到服务器,再在服务器上构建并重启容器。
# 服务器上的 .env 由 PROD_ENV 变量推送覆盖;ssh/ 与 .env 不参与代码同步。
deploy:
  stage: deploy
  image: armdocker.rnd.ericsson.se/dockerhub-ericsson-remote/docker:26.1.4
  before_script:
    - apk add --no-cache openssh-client rsync
  script:
    - |
      : "${DEPLOY_HOST:?not set — add DEPLOY_HOST in CI/CD Variables}"
      : "${DEPLOY_USER:?not set — add DEPLOY_USER in CI/CD Variables}"
      : "${DEPLOY_DIR:?not set — add DEPLOY_DIR in CI/CD Variables}"
      echo "Deploying to ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_DIR} (port ${DEPLOY_PORT:-22})"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # 归一化私钥:去掉 CR、补尾部换行,再验证它能被解析(这两点是 libcrypto 报错的常见原因)。
    - |
      tr -d '\r' < "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
      printf '\n' >> ~/.ssh/id_deploy
      chmod 600 ~/.ssh/id_deploy
      if ssh-keygen -y -P "" -f ~/.ssh/id_deploy >/dev/null 2>&1; then
        echo "SSH private key parsed OK"
      else
        echo "ERROR: DEPLOY_SSH_KEY is not a valid passphrase-less private key."
        exit 1
      fi
    - 'SSHBASE="-i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p ${DEPLOY_PORT:-22}"'
    - 'rsync -az --delete --exclude ".git" --exclude ".env" --exclude "ssh" $[[ inputs.rsync_excludes ]] -e "ssh $SSHBASE" ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/"'
    - 'rsync -az -e "ssh $SSHBASE" "$PROD_ENV" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/.env"'
    - 'ssh $SSHBASE "$DEPLOY_USER@$DEPLOY_HOST" "cd \"$DEPLOY_DIR\" && GIT_COMMIT=\"$CI_COMMIT_SHORT_SHA\" docker compose up -d --build && docker compose ps"'
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: $[[ inputs.deploy_when ]]
