# 环境部署:把某个环境的部署描述应用到它的宿主机。
# 只拉镜像、不构建——构建发生在服务流水线里,产物是不可变标签。
#
# platform-ci 自己的 .gitlab-ci.yml 这样用:
#
#   include:
#     - local: templates/deploy-env.yml
#       inputs: { env: test, dir: /proj/rp_ait_prod/services/test-env, when: on_success }
#
# 需要的变量(组级已有):DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY(File)
# 以及镜像仓库凭据 docker_user / docker_password。

spec:
  inputs:
    env:
      description: "环境名,对应 deploy/<env>/"
    dir:
      description: "宿主机上的部署目录"
    when:
      default: "manual"
      options: ["manual", "on_success"]
    env_files:
      # 环境密钥归环境:形如 "目标文件名=CI变量名",空格分隔,可多个。
      # 变量必须是 File 型;内容投放到环境目录,不进 git。
      default: ""
      description: '如 "svc.env=SVC_PROD_ENV"'

---

"deploy-$[[ inputs.env ]]":
  stage: deploy
  image: $REGISTRY/dockerhub-ericsson-remote/docker:26.1.4
  variables:
    ENV_DIR: "deploy/$[[ inputs.env ]]"
    HOST_DIR: "$[[ inputs.dir ]]"
  before_script:
    - apk add --no-cache openssh-client rsync
  script:
    - |
      : "${DEPLOY_HOST:?未设置}"; : "${DEPLOY_USER:?未设置}"
      : "${docker_user:?未设置}"; : "${docker_password:?未设置}"
      mkdir -p ~/.ssh && chmod 700 ~/.ssh
      tr -d '\r' < "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
      printf '\n' >> ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
      ssh-keygen -y -P "" -f ~/.ssh/id_deploy >/dev/null || { echo "私钥不可解析"; exit 1; }
    - 'SSHBASE="-i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"'
    # 只同步这个环境的描述,不同步任何源码——服务器上不再需要源码。
    - 'ssh $SSHBASE "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p $HOST_DIR"'
    - 'rsync -az --delete -e "ssh $SSHBASE" "$ENV_DIR/" "$DEPLOY_USER@$DEPLOY_HOST:$HOST_DIR/"'
    # 密钥在 rsync --delete 之后投放,否则会被同步删掉。
    - |
      ENV_FILES="$[[ inputs.env_files ]]"
      for pair in $ENV_FILES; do
        dest="${pair%%=*}"; var="${pair#*=}"
        eval "src=\$$var"
        [ -n "$src" ] && [ -f "$src" ] || { echo "变量 $var 未设置或不是 File 型"; exit 1; }
        scp $SSHBASE "$src" "$DEPLOY_USER@$DEPLOY_HOST:$HOST_DIR/$dest"
        echo "已投放 $dest(来自 $var)"
      done
    # 登录镜像仓库后拉取并对齐状态:up -d 只重建标签变化的服务。
    # 密钥经 stdin 送到远端,不放进 ssh 的命令串——否则它会出现在远端的进程参数里,
    # 任何能在那台机器上跑 ps 的人都看得到。
    - |
      printf '%s' "$docker_password" | ssh $SSHBASE "$DEPLOY_USER@$DEPLOY_HOST" \
        "docker login $REGISTRY -u '$docker_user' --password-stdin >/dev/null"
    - |
      ssh $SSHBASE "$DEPLOY_USER@$DEPLOY_HOST" "
        set -e
        cd '$HOST_DIR'
        docker compose pull
        docker compose up -d --remove-orphans
        docker compose ps
      "
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: ["deploy/$[[ inputs.env ]]/**/*"]
      when: $[[ inputs.when ]]
