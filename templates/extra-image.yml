# 用服务仓自带的 Dockerfile 构一个不可变镜像。
#
# 什么时候用它:同一个仓要出第二个镜像,且它的配方与共享薄层实质不同。
# 例:审计判定器要在镜像里装 kiro-cli——那不是"装依赖 + 拷源码"能表达的。
#
# 共享薄层没有"任意构建步骤"这种输入,配方实质不同的镜像走这个模板,Dockerfile 放在
# 需要它的服务仓里。
#
# 不变量与共享模板一致:kaniko 构建(runner 无守护进程)、标签含 commit、不可覆盖。

spec:
  inputs:
    service:
      description: "镜像名,会拼成 proj-rvc/rp-ai/<service>"
    dockerfile:
      description: "服务仓里的 Dockerfile 路径"
    job_name:
      default: "build-extra"
      description: "任务名,同一仓有多个额外镜像时要区分"
    stage:
      default: "build"
---

include:
  - local: templates/_build-common.yml

"$[[ inputs.job_name ]]":
  stage: $[[ inputs.stage ]]
  extends: .kaniko
  variables:
    IMAGE: "$REGISTRY/proj-rvc/rp-ai/$[[ inputs.service ]]"
    TAG: "$CI_COMMIT_SHORT_SHA"
  script:
    - !reference [.tag-guard, script]
    - |
      if /kaniko/executor --context "$CI_PROJECT_DIR" \
           --dockerfile "$CI_PROJECT_DIR/$[[ inputs.dockerfile ]]" \
           --destination "$IMAGE:$TAG" \
           --build-arg "GIT_COMMIT=$CI_COMMIT_SHORT_SHA" \
           --snapshot-mode=redo --single-snapshot; then
        echo "推送完成:$IMAGE:$TAG"
      else
        echo "构建失败。若失败原因是访问外网(例如安装第三方 CLI),说明该镜像不能在 runner 上构建。"
        exit 1
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
