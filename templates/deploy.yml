# 被服务仓的部署按钮触发时执行部署。收到三个变量:
#   DEPLOY_ENV      test / prod
#   DEPLOY_SERVICE  镜像名
#   DEPLOY_TAG      commit sha
#
# 环境描述里有 stack.yml 且里面有这个服务的版本变量,就走 swarm(部署到 manager);
# 否则走 compose(部署到单机)。搬迁期间两种并存:同一个环境目录里,已搬的服务在 stack.yml,
# 未搬的在 compose.yml。
#
# 两种形态做的事一样:记下这个服务的新版本、同步描述到机器、投放密钥、让运行状态对齐描述。

apply:
  stage: deploy
  image: $REGISTRY/dockerhub-ericsson-remote/docker:26.1.4
  rules:
    - if: '$DEPLOY_ENV'
  environment:
    name: $DEPLOY_ENV
  variables:
    # 需要完整克隆:CI 默认浅克隆(depth 20),从浅克隆推送会被服务端拒绝。
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache openssh-client rsync git
  script:
    - |
      : "${DEPLOY_SERVICE:?未传}"; : "${DEPLOY_TAG:?未传}"
      ENV_DIR="deploy/$DEPLOY_ENV"
      VAR="$(echo "$DEPLOY_SERVICE" | tr 'a-z-' 'A-Z_')_TAG"
      # 部署方式由环境描述里 services.txt 那一行的**第一个词**决定,这是唯一权威。
      # 不能靠"stack.yml 里有没有它"推断:迁移期间一个服务本来就同时出现在两个文件里,
      # 任何推断都必然歧义(曾因此埋下"下一次发版静默切集群"的地雷)。
      LINE="$(sed -n "s/^$DEPLOY_SERVICE:[[:space:]]*//p" "$ENV_DIR/services.txt")"
      [ -n "$LINE" ] || { echo "$ENV_DIR/services.txt 里没有 $DEPLOY_SERVICE 这一行"; exit 1; }
      MODE="${LINE%% *}"; [ "$MODE" = "$LINE" ] && TARGETS="" || TARGETS="${LINE#* }"
      case "$MODE" in
        swarm|compose) ;;
        *) echo "services.txt 里 $DEPLOY_SERVICE 的模式是 '$MODE',只能是 swarm 或 compose"; exit 1 ;;
      esac
      if [ "$MODE" = swarm ]; then
        : "${SWARM_HOST:?未设置}"; : "${SWARM_USER:?未设置}"
        TARGET_HOST="$SWARM_HOST"; TARGET_USER="$SWARM_USER"; KEY_SRC="$SWARM_SSH_KEY"
        HOST_DIR="/opt/rp-ai/$DEPLOY_ENV"   # 父目录由主机一次性准备(属主=部署用户);/opt 本身不可写
      else
        : "${DEPLOY_HOST:?未设置}"; : "${DEPLOY_USER:?未设置}"
        TARGET_HOST="$DEPLOY_HOST"; TARGET_USER="$DEPLOY_USER"; KEY_SRC="$DEPLOY_SSH_KEY"
        case "$DEPLOY_ENV" in
          test) HOST_DIR=/proj/rp_ait_prod/services/test-env ;;
          prod) HOST_DIR=/proj/rp_ait_prod/services/prod-env ;;
          *) echo "未知环境 $DEPLOY_ENV"; exit 1 ;;
        esac
      fi
      # swarm 模式读 stack.yml,compose 模式读 compose.yml
      [ "$MODE" = swarm ] && DESC=stack.yml || DESC=compose.yml
      test -f "$ENV_DIR/$DESC" || { echo "$MODE 模式需要 $ENV_DIR/$DESC,但它不存在"; exit 1; }
      echo "部署方式=$MODE 目标目录=$HOST_DIR"
    # 版本不写进 git:本实例的推送规则要求 GPG 签名,CI 无法签名提交。改为写机器上环境目录里的
    # .env。它是**声明的期望版本**;swarm 下**生效状态**的真相是集群本身(stack deploy 会把 tag
    # 解析成 digest 存进服务定义)。compose 直接读 .env;stack deploy 不读 .env,要先 source 再部署。
    - |
      mkdir -p ~/.ssh && chmod 700 ~/.ssh
      tr -d '\r' < "$KEY_SRC" > ~/.ssh/id_deploy
      printf '\n' >> ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
      ssh-keygen -y -P "" -f ~/.ssh/id_deploy >/dev/null || { echo "私钥不可解析"; exit 1; }
    - 'SSHBASE="-i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"'
    - 'ssh $SSHBASE "$TARGET_USER@$TARGET_HOST" "mkdir -p $HOST_DIR && chmod 750 $HOST_DIR"'
    # 排除 .env:它记录本环境当前各服务的版本,由部署任务维护,不在 git 里。
    - 'rsync -az --delete --exclude ".env" --exclude "*.env" -e "ssh $SSHBASE" "$ENV_DIR/" "$TARGET_USER@$TARGET_HOST:$HOST_DIR/"'
    # 密钥在 rsync --delete 之后投放,否则会被同步删掉。
    - |
      # 每行 目标文件名=变量名[=形态]。形态省略即 compose。只投放属于本次目标机器的密钥 ——
      # 服务还没搬进集群,它的密钥就不该出现在 manager 上。
      ENV_FILES="$(grep -v '^#' "$ENV_DIR/env-files.txt" 2>/dev/null || true)"
      for triple in $ENV_FILES; do
        dest="${triple%%=*}"; rest="${triple#*=}"
        var="${rest%%=*}"; kind="${rest#*=}"
        [ "$kind" = "$var" ] && kind=compose
        [ "$kind" = "$MODE" ] || { echo "跳过 $dest(属于 $kind,本次是 $MODE)"; continue; }
        eval "src=\$$var"
        [ -n "$src" ] && [ -f "$src" ] || { echo "变量 $var 未设置或不是 File 型"; exit 1; }
        scp $SSHBASE "$src" "$TARGET_USER@$TARGET_HOST:$HOST_DIR/$dest"
        echo "已投放 $dest"
      done
    - |
      printf '%s' "$docker_password" | ssh $SSHBASE "$TARGET_USER@$TARGET_HOST" \
        "docker login $REGISTRY -u '$docker_user' --password-stdin >/dev/null"
    - |
      if [ "$MODE" = swarm ]; then
        EXTRA_VAR=""
        [ -n "$DEPLOY_EXTRA_SERVICE" ] && EXTRA_VAR="$(echo "$DEPLOY_EXTRA_SERVICE" | tr 'a-z-' 'A-Z_')_TAG"
        # 部署逻辑放在一个独立脚本里执行,不写成 ssh 双引号里的一大段 shell:
        # 那样每个 $ 和引号都要多层转义,已经因此坏过两次。
        scp $SSHBASE templates/swarm-apply.sh "$TARGET_USER@$TARGET_HOST:$HOST_DIR/swarm-apply.sh"
        ssh $SSHBASE "$TARGET_USER@$TARGET_HOST" \
          "chmod +x '$HOST_DIR/swarm-apply.sh' && '$HOST_DIR/swarm-apply.sh' '$DEPLOY_ENV' '$VAR' '$DEPLOY_TAG' '$EXTRA_VAR'"
        exit 0
      fi
      # ---------- 以下是 compose(单机)形态 ----------
      # 要重建哪些 compose 服务,来自 services.txt 那一行模式之后的部分。
      if [ -n "$DEPLOY_EXTRA_SERVICE" ]; then
        EL="$(sed -n "s/^$DEPLOY_EXTRA_SERVICE:[[:space:]]*//p" "$ENV_DIR/services.txt")"
        TARGETS="$TARGETS ${EL#* }"
      fi
      [ -n "$TARGETS" ] || { echo "services.txt 里 $DEPLOY_SERVICE 是 compose 模式但没列出要重建的服务"; exit 1; }
      echo "本次只重建: $TARGETS"
      EXTRA_VAR=""
      [ -n "$DEPLOY_EXTRA_SERVICE" ] && EXTRA_VAR="$(echo "$DEPLOY_EXTRA_SERVICE" | tr 'a-z-' 'A-Z_')_TAG"
      ssh $SSHBASE "$TARGET_USER@$TARGET_HOST" "
        set -e
        cd '$HOST_DIR'
        touch .env
        # 只改这一个服务的版本,其它服务保持原样。
        sed -i '/^$VAR=/d' .env
        echo '$VAR=$DEPLOY_TAG' >> .env
        if [ -n '$EXTRA_VAR' ]; then
          sed -i '/^$EXTRA_VAR=/d' .env
          echo '$EXTRA_VAR=$DEPLOY_TAG' >> .env
        fi
        sort -o .env .env
        echo '--- 本环境当前各服务的版本(.env) ---'
        cat .env
        docker compose pull $TARGETS
        docker compose up -d $TARGETS
        echo '--- 本次实际运行的镜像 ---'
        for c in \$(docker compose ps -q $TARGETS); do
          docker inspect \$c --format '{{.Name}} {{.Config.Image}} {{.Image}}'
        done
      "
