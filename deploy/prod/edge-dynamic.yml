# 对外路径 → 服务。这份映射属于环境:四个服务在代码里的前缀都是 /api/,彼此冲突,
# 只有把它们放在一起的这一层才知道谁挂哪个对外前缀、要不要改写。
#
# 这张表是**逐条照着前端镜像里那份 nginx.conf.template 复刻的**(rp-ai-portal-fe 仓库),
# 因为今天真正在做路由的是那一层。搬过来的目的只有一个:改一条路由不必再发一次前端版本。
# 所以这里的任何一条与那边不一致,就是 bug —— 下面每条都标了它对应模板里的哪一段。
#
# 形态是"Traefik 待在 rp-ai-edge 后面":edge 继续持有 443、证书与 302 跳转,
# 只把 proxy_pass 的目标从 frontend:80 换成 traefik:80。所以这一层**不碰 TLS**,
# 收到的已经是解密后的 HTTP。见 edge-static.yml 开头。
#
# 迁移期间两种后端并存:
#   * 已搬进集群的写服务名
#   * 未搬的写老机器的 主机:端口
# 现在全部是服务名 —— 生产 14 个服务同在 compose 的默认项目网络里,名字直接解析得到;
# 上集群之后它们在同一个 overlay 上,写法一个字都不用改。
# 改完这个文件,若 Traefik 已经以 swarm 形态运行,要给 stack.yml 里 configs 的名字换版本号
# (swarm config 不可变);compose 形态是 bind mount,改完重启 traefik 即可。
http:
  routers:
    # 优先级显式给,不依赖"规则越长越优先"这个默认行为
    # 对应模板 location /api/product-structure/
    psi:
      rule: "PathPrefix(`/api/product-structure/`)"
      priority: 100
      entryPoints: [web]
      middlewares: [psi-strip, psi-add]
      service: psi
    # /api/work-connector/ 那条路由已于 2026-10-09 删除(Work Connector 下线:七天日志里
    # 一次真实调用都没有,20085 次请求全部是容器自己的健康检查)。
    #
    # **没有在这里留一条 return 404 的挡板,和下面 /api/eridoc/ 的做法不同** —— 因为两者
    # 在这一层的落点本来就不一样:eridoc 那条指向 fe(前端容器里那层 nginx 自己返回 404),
    # 所以它必须留着;work-connector 这条原来直连服务,服务已经从环境描述里移除,留着只会
    # 是一条指向空处的规则。删掉之后这个路径落到下面的 audit(PathPrefix `/api/`,
    # priority 50),由门户后端答 404 —— 对一个已下线的工具来说这是正确答案。
    #
    # 一条值得记下来的结论:**前端那层的 404 对域名流量不生效。** 生产的链路是
    # edge -> traefik -> 服务,而这一层原来直接把 /api/work-connector/ 转给服务,根本不
    # 经过前端容器。所以前端那个 MR(rp-ai-portal-fe !104)关掉的是界面入口与 dev 代理,
    # 真正关掉接口的是本次改动 —— 前端仓写的「三层一起关」,在生产其实是四层,
    # 边缘路由表是第四层,而且是唯一真正挡住域名流量的那一层。
    # 对应模板 location /api/eridoc/ —— 那里是 `return 404`。
    #
    # EriDoc 取件已停用:它所有读取都走一个共享函数账号,于是任何登录门户的人都能取到那个
    # 账号能看到的任何文档,而 EriDoc 自己的审计日志说不出是谁取的。
    # 交给 fe 而不是在这里造一个 404:前端那层已经显式 `return 404`,照原样转过去行为完全一致,
    # 而且恢复时只需要 revert 前端那一个提交,这里不用跟着改。
    # 优先级要高过下面 /api/ 的 50,否则会落到门户后端。
    eridoc:
      rule: "PathPrefix(`/api/eridoc/`)"
      priority: 100
      entryPoints: [web]
      service: fe
    # 对应模板 location /api/ —— 门户后端的全部接口都在 /api/* 下,前缀原样保留。
    audit:
      rule: "PathPrefix(`/api/`)"
      priority: 50
      entryPoints: [web]
      service: audit
    # 对应模板 location ^~ /grafana/
    grafana:
      rule: "PathPrefix(`/grafana/`)"
      priority: 50
      entryPoints: [web]
      service: grafana
    # PO 报表看板(服务 po-reporting-portal,仓库 rp-ai-miao/pmo/dashboard-portal)。
    #
    # 这条是**本层独有的**:前端模板里没有对应的 location,因为前端从来没有服务过这个路径。
    # 在这之前它只有裸端口入口 http://100.77.162.66:9020,没有域名、没有 TLS。所以这不是
    # "复刻模板"而是新增一条对外路径 —— 这正是把路由表搬到本层之后才做得到的事:
    # 加一条对外路径不再需要发一次前端版本。
    #
    # 为什么一个 stripPrefix 就够(不需要第二条不剥前缀的路由):v2 起这个应用是 FastAPI 单页,
    # 资源与接口调用**全是相对路径**(服务仓 docs/PLATFORM_CI_PATCH.md 第 4 点写明了这一点;
    # v1 的 Flask 多页版有 `window.location.href="/pm/"+name` 这种绝对跳转,当年确实要额外
    # 一条 /pm/ 路由)。相对路径的前提是**浏览器的基准地址必须以斜杠结尾**,所以下面那条
    # po-slash 不是可选项:少一个尾斜杠时 `static/x.js` 会解析到 /pmo/dashboard/static/x.js,
    # 剥掉前缀后就是一个不存在的路径,表现为页面能开但样式和数据全空。
    #
    # 上传(xlsx,带 UPLOAD_TOKEN)走同一条路由。edge 那层 client_max_body_size 是 0(不限),
    # 所以不会出现"端口直连能传、走域名被 413 打回"这种只在域名入口复现的毛病。
    po:
      rule: "PathPrefix(`/pmo/dashboard/hwc/`)"
      priority: 100
      entryPoints: [web]
      middlewares: [po-strip]
      service: po
    # 少一个尾斜杠时补上。priority 要比上面那条高,否则 PathPrefix 先匹配、这条永远不生效。
    po-slash:
      rule: "Path(`/pmo/dashboard/hwc`)"
      priority: 110
      entryPoints: [web]
      middlewares: [po-slash-redirect]
      service: po
    # 对应模板 location / 与那条静态资源的 location:
    # index.html 回退(try_files)、/ 的 no-cache、静态资源的 expires 7d 都在前端容器里,
    # 所以整个 / 交给它,这些行为自动保留 —— 不要在这一层重新实现缓存头。
    fe:
      rule: "PathPrefix(`/`)"
      priority: 1
      entryPoints: [web]
      service: fe

  middlewares:
    # 复刻 `proxy_pass ${PSI_UPSTREAM}/api/`:
    # /api/product-structure/vem/x -> psi 的 /api/vem/x(psi 的路由挂在 /api/vem 下)
    psi-strip:
      stripPrefix:
        prefixes: ["/api/product-structure"]
    psi-add:
      addPrefix:
        prefix: "/api"
    # PO 报表看板:整个前缀都剥掉,应用在容器里仍然认为自己挂在根上。
    # 注意 prefixes 不带尾斜杠(traefik 的 stripPrefix 约定),而上面的 rule 带 ——
    # rule 带斜杠是为了不误匹配 /pmo/dashboard/hwcxxx 这类前缀相同的路径。
    po-strip:
      stripPrefix:
        prefixes: ["/pmo/dashboard/hwc"]
    # 用**相对** Location,不要重建绝对 URL。
    #
    # 原来写的是 regex `^(https?://[^/]+)/pmo/dashboard/hwc$` + replacement `${1}/...`,
    # 看着合理,实测跳到了 **http://**:本层在 edge 后面,TLS 已经被 edge 解掉,所以 traefik
    # 眼里这个请求的 scheme 就是 http,`${1}` 捕到的自然是 `http://rpai...`。结果用户访问
    # https 的地址会被打回明文 http,再由 edge 的 80 端口 302 回 https —— 多一跳,而且那一跳
    # 带着完整路径走在明文上。test 那边同样的写法没暴露这个问题,因为 test 本来就是纯 http。
    #
    # 相对 Location(RFC 7231 允许)由浏览器按当前地址解析,scheme 和主机都原样保留,
    # 既不写死域名、也不会降级到明文。router 已经用 Path() 精确匹配,所以 regex 用 `.*` 即可。
    po-slash-redirect:
      redirectRegex:
        regex: ".*"
        replacement: "/pmo/dashboard/hwc/"
        permanent: true

  services:
    psi:
      loadBalancer:
        # 一个服务名条目就够:副本之间的分流由 swarm 的 VIP + 内核 IPVS 做,不在这一层。
        # 注意它是**按 TCP 连接**分流而不是按请求 —— 顺序调用复用一条连接会落在同一个副本,
        # 并发才铺开。要按请求轮转就得绕过 VIP、在这里列出每个副本的地址,通常不值得。
        servers: [{url: "http://product-structure-information:8000"}]
    po:
      loadBalancer:
        # 服务名直达,不走宿主机的 9020。实测 traefik 与 po-reporting-portal 同在
        # prod-env_default 网络,从该网络按服务名打 /health 返回 {"status":"ok"}。
        #
        # 9020 这个宿主机端口暂时保留(服务仓文档里写着"沿用,不变"),但有了这条路由之后
        # 它就只剩"老用户的旧书签"这一个用途,可以和 9000/9010 一起在 2.2 里收掉。
        servers: [{url: "http://po-reporting-portal:8000"}]
    audit:
      loadBalancer:
        # 曾经写的是 100.77.162.66:9000(绕宿主机发布端口走一圈)。改成服务名的理由同
        # compose.yml 里 frontend 那三个上游:那条路在集群上是坏的,而且 9000 这个
        # 宿主机端口迟早要收掉。
        servers: [{url: "http://audit-backend:8000"}]
    grafana:
      loadBalancer:
        # 前缀必须保留:grafana 自己的资源链接依赖它,而且它由 GF_SERVER_ROOT_URL 决定
        # (compose.yml 里是 https://rpai.ews.gic.ericsson.se/grafana/)—— 入口变更时要同步改。
        #
        # 曾经写的是 100.77.162.66:9401。那个宿主机端口现在只剩验收环境的 traefik 在用
        # (deploy/test/edge-dynamic.yml),本层改成服务名之后,收掉它的前提就只剩那一个依赖。
        servers: [{url: "http://grafana:3000"}]
    fe:
      loadBalancer:
        # 曾经写的是 100.77.162.66:9001,那是个坑:9001 现在由 edge 持有并只回 302 到域名,
        # 本层按那个地址转发会形成跳转环(旧文件里标着 TODO)。前端的真实入口是容器内的 80,
        # 在同一个网络里按服务名直达,既没有跳转环也不经过宿主机端口。
        servers: [{url: "http://frontend:80"}]
