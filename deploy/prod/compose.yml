# 这台机器上跑什么。镜像标签由部署任务写在环境目录的 .env 里;下面的默认值是上次已知的版本,
# 只在 .env 里没有对应项时生效——判断线上实际跑什么看 .env 或部署日志,不要看这里。
# 生产环境。这个文件的 git 历史就是这台机器的部署记录。
#
# 发布 = 改 image: 那一行的标签并合并,然后手动触发 deploy-prod。
# 回滚 = revert 那次提交,再触发一次——不需要重新构建。
#
# 密钥不在这里:product-structure-information.env 由部署任务从 CI 的 File 变量
# PSI_PROD_ENV 投放到本目录。
services:
  eridoc-client:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/eridoc-client:${ERIDOC_CLIENT_TAG:-not-deployed}
    container_name: eridoc-client
    restart: unless-stopped
    env_file:
      - eridoc-client.env
    environment:
      # 身份来自本服务自己发的 bearer token(webapp/auth.py 的 auth_mode=token):
      # Authorization: Bearer <token>,常数时间比对,每个 token 映射到一个调用方名字,
      # 每次请求写一条审计日志。写在这里而不是 env 文件里:这不是密钥,而且 compose 的
      # environment 覆盖 env_file —— 之前这一行写 proxy,正是它把 env 文件里早已配好的
      # ERIDOC_WEB_TOKENS 压住、让 token 模式一直没生效。
      #
      # 为什么不再用 proxy:proxy 信任反代注入的 X-Forwarded-User,唯一的安全前提是
      # "本服务只能经那个反代访问"。下面发布了宿主机端口,这个前提就不成立了 ——
      # 那时任何人自带一个 X-Forwarded-User 就能冒充别人读 EriDoc 全库。所以
      # **发布端口与 auth_mode=token 必须同时成立**,只改一个就是一个洞。
      #
      # 代价:门户前端那条 /api/eridoc/ 走的是注入 X-Forwarded-User,与 token 模式不兼容。
      # 现在无影响 —— 那条路由在前端 nginx 里已是显式 404(EriDoc Access 已下线)。
      # 将来要恢复门户入口,得让那一层改成注入 Authorization 头,而不是改回 proxy。
      ERIDOC_WEB_AUTH_MODE: "token"
      # 浏览器里的下载要整份过一遍内存(前端拿 blob 存盘,见 rp-ai-portal 的
      # eridoc.service.ts),所以打包上限从默认 2 GiB 收到 50 MB。超限是 413,
      # 前端把 message 与 stats 原样显示,让人去分批下。
      ERIDOC_WEB_ZIP_MAX_BYTES: "52428800"
    # 对外端口:给 Swagger(/api/docs)和 API 调用方一个不经门户的入口。
    # 9050 的来历:本文件里已声明的宿主端口是 80、443、8901、9000(审计后端)、
    # 9001(edge 老入口)、9010(psi)、9020(po-reporting-portal)、9030(拓扑工具)、
    # 9040(reqflow-result-check)、9201(rtep)、9300(genius-ac)、9401(grafana),
    # 测试环境另占 9100、9101;9050 是 90x0 序列的下一个空位。
    # **判据是"文件里声明的" ∪ "机器上在听的",不是只看机器**:第一版这里写了 9040,
    # 机器上实测确实空闲,但 reqflow-result-check 早已在本文件里声明了它、只是还没上线 ——
    # 照那个写法上去就是两个服务抢同一个端口。加端口前两份清单都要重算。
    #
    # 这个洞有多大,说清楚:本服务用一个持有"Read Access to All Documents"的共享
    # function ID(ecnrpai)读 EriDoc,所以端口一开,任何拿到 token 的人就能读全库;
    # 而 EriDoc 自己的审计只记得那个共享 ID —— 本服务的审计日志是唯一还能回答
    # "谁读了哪份文档"的地方。因此 ERIDOC_WEB_TOKENS 要按调用方一人一个
    # (它就是 名字:token 的列表),共用一个 token 等于放弃归因。
    #
    # /api/docs 与 /api/openapi.json 本身没挂鉴权依赖,所以端口开放后 API 结构对内网
    # 可见(数据不可见,试调用仍要填 token)。要连结构也藏起来得改 webapp/main.py。
    ports:
      - "9050:8000"
    volumes:
      # 审计日志(谁读了哪份文档)写在 /app/data/log/<日期>/,是这个服务存在的理由之一,
      # 必须跨部署保留,所以挂到宿主机而不是留在容器里。
      - /proj/rp_ait_prod/logs/eridoc-client:/app/data
    healthcheck:
      # 本服务的免鉴权健康端点是 /api/health,不是其它服务的 /health。
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  product-structure-information:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/product-structure-information:${PRODUCT_STRUCTURE_INFORMATION_TAG:-925f24b0}
    container_name: product-structure-information
    restart: unless-stopped
    env_file:
      - product-structure-information.env
    # 容器内统一 8000;9010 是这台机器上对外的端口,属于环境的事实。
    ports:
      - "9010:8000"
    volumes:
      - /proj/rp_ait_prod/logs/product-structure-information:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  rtep-flow-manager:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/rtep-flow-manager:${RTEP_FLOW_MANAGER_TAG:-ce5a702d}
    container_name: rtep-flow-manager
    restart: unless-stopped
    ports:
      - "9201:8000"
    volumes:
      - /proj/rp_ait_prod/logs/rtep-flow-manager:/app/logs
      - /proj/rp_ait_prod/data/rtep-flow-manager:/app/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # 没有 env_file:该服务的 PROD_ENV 与服务器上的 .env 都是空的,生产从来没给它配过
    # 环境变量(代码里读的 RTEP_SMTP_* 目前全未设置)。这是既有状态,迁移不改它。
  po-reporting-portal:
      image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/po-reporting-portal:${PO_REPORTING_PORTAL_TAG:-not-deployed}
      container_name: po-reporting-portal
      restart: unless-stopped
      ports:
        - "9020:8000"
      volumes:
        - /proj/rp_ait_prod/logs/po-reporting-portal:/app/logs
        - /proj/rp_ait_prod/data/po-reporting-portal:/app/data
      env_file:
        - po-reporting-portal.env
      healthcheck:
        test: ["CMD", "python", "-c",
               "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status
  == 200 else 1)"]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 15s
      # v2(2026-09):Flask+数据打包进镜像 → FastAPI+网页上传。数据不再进镜像,改为落盘到
      # 持久卷 /app/data(current.xlsx + history/)。用 bind mount 到 /proj/rp_ait_prod/data/...
      # 与 rtep-flow-manager 同一约定:宿主机路径,容器/镜像重建后数据仍在(换机器才会丢,可网页重传)。
      # env_file 注入 UPLOAD_TOKEN(网页上传口令),内容由部署任务从 PO_PORTAL_PROD_ENV 投放。
      # 详见服务仓 docs/PLATFORM_CI_PATCH.md。
  
  # agent-artifex 属于本环境但当前不运行(容器自 2026-08-05 起是 Exited)。
  # profiles 让 docker compose up 跳过它;删掉 profiles 两行即启动。
  audit-backend:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/rp-ai-portal-be:${RP_AI_PORTAL_BE_TAG:-f33b3587}
    container_name: ai-portal-be-backend
    restart: unless-stopped
    env_file:
      # 这份文件由部署任务从 File 变量 AUDIT_PROD_ENV 投放,不进 git。除库、LDAP、JWT 之外,
      # 从 rp-ai-portal-be v1.5.0 起还需要一项:
      #
      #   GITLAB_USER_AGENTS_TOKEN  用户上传的 Agent 包要在 rp-ai/rp-ai-user-agents 下建项目
      #                             并推送,用的是**那个组的** group access token
      #                             (Owner + api,write_repository),不是同一份文件里的
      #                             GITLAB_TOKEN —— 后者是全域只读,只用来同步另外两个组。
      #
      # tool 也能传包那一版起,再加一项:
      #
      #   GITLAB_USER_TOOLS_TOKEN   tool 的包进 rp-ai/rp-ai-user-tools,是**另一个组**。组访问
      #                             令牌只能访问它所属的那一个组,所以这是第二个凭据,不是同
      #                             一个值换个名字。也没有合成一个的办法:那要一个建在父组
      #                             rp-ai 上的令牌,而它会顺带拿到技能仓和 sync 那两个组的写
      #                             权限 —— 比这个功能需要的大得多。
      #
      # 缺了它们不会崩:对应类型的包上传答 503 并**点名缺哪个变量**,市场其余功能照常。也就是
      # 说症状是"某一类上传一直 503",而不是启动失败 —— 所以写在这里,否则没人会想到是环境变量。
      - ai-portal-be.env
    environment:
      # 判定器地址不在这里配:调它的是**引擎**,用的是 audit_llm_base_url(默认
      # http://audit-judge:8790/v1)。这里原来有一行 AUDIT_JUDGE_URL,两个仓的代码都没有这个字段,
      # 门户读不到它 —— 留着只会让人以为改它有用。
      # 审计引擎。地址写在这里(与判定器同一模式),token 在 AUDIT_PROD_ENV 里 —— 地址不是密钥,
      # 放在描述文件里看得见;token 是。
      AUDIT_ENGINE_URL: "http://skill-audit:8000"
      # 门户给自己的提交签名用的**公钥路径**。路径不是密钥,所以和上面那条同一个理由:写在
      # 这里看得见,不进 File 变量。密钥文件本身由下面的只读挂载提供。
      #
      # 为什么需要它:上传包的目标组(rp-ai/rp-ai-user-tools、rp-ai/rp-ai-user-agents)开着
      # GitLab 的「Reject unsigned commits」推送规则,而门户是 git init/commit/push 发布的。
      # 不配这一项时包上传会走到最后一步才被 pre-receive 钩子拒收,门户答 503 并点名这个变量。
      GIT_SIGNING_KEY: "/etc/portal-signing/portal-signing.pub"
    ports:
      - "9000:8000"
    volumes:
      # 技能仓的工作副本。容器内路径与代码里的默认值一致,改一处要同时改另一处。
      # 只剩日志。技能仓的工作副本和推送私钥已经去掉:内容按引用走 GitLab 接口读写,鉴权是
      # portal-skill-repo-prod 这个项目访问令牌(api + Developer + main 推送白名单)。
      - /proj/rp_ait_prod/logs/ai-portal-be:/app/logs
      # 门户给自己的提交签名用的密钥对,只读。目录里两个文件:portal-signing(私钥,0600)和
      # portal-signing.pub。容器以 root 跑,所以读得到 0600 的那个。
      #
      # **两个都要挂**:GIT_SIGNING_KEY 指的是公钥,而 `ssh-keygen -Y sign` 按同名去掉 .pub
      # 找私钥 —— 只挂公钥的话看起来完全正常,签名时才失败,而报错来自 ssh-keygen、措辞离原因
      # 很远。门户现在会在建 GitLab 项目**之前**检查这两个文件,缺哪个都直接答 503 并说明。
      #
      # 密钥不能有 passphrase:容器里没有 ssh-agent 能解锁它。公钥要挂在某个 GitLab 账号的
      # SSH signing keys 上(组访问令牌的 bot 用户加不了密钥),见 CREDENTIALS.md。
      - /proj/rp_ait_prod/secrets/portal-signing:/etc/portal-signing:ro
    depends_on:
      - audit-judge
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  audit-reconciler:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/rp-ai-portal-be:${RP_AI_PORTAL_BE_TAG:-f33b3587}
    container_name: ai-portal-be-reconciler
    restart: unless-stopped
    env_file:
      - ai-portal-be.env
    environment:
      RECONCILE_INTERVAL: "300"
    entrypoint: ["python", "-m", "app.reconcile", "--watch"]
    depends_on:
      - audit-backend

  # 审计引擎。从门户仓解耦出来(仓库 rp-ai-miao/skill-audit),边界见门户仓的
  # .kiro/specs/skill-audit/service-split.md。
  #
  # 门户镜像里已经不装扫描器了,所以**这个服务必须先在生产跑起来,再部署门户**;顺序反了的话,门户
  # 每次审计都拿不到结论 —— 新上传全部转人工复核,重发布已上线技能返回 503。
  #
  # 无状态:审计结果全在响应里返回,由门户的 gate 落库,容器自己不存业务数据。单机形态下就一个实例。
  # 下面那个挂载是**只写的诊断输出**,不是状态:删掉它服务照跑,只是事后查不到现场。
  skill-audit:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/skill-audit:${SKILL_AUDIT_TAG:-a17952ee}
    container_name: ai-portal-be-audit-engine
    restart: unless-stopped
    env_file:
      - skill-audit.env
    expose:
      - "8000"
    # 上限不是可选项:一次扫描最长 900 秒,而这台机器同时跑着生产和测试的全部服务。没有上限的话,一次
    # 跑飞的扫描能把内存吃光,受害的是同机的生产后端和数据库 —— 而审计本身是"不通过就转复核"的旁路,
    # 它把主链路拖垮是不可接受的交换。数值与测试环境一致。
    mem_limit: 2g
    cpus: "2.0"
    volumes:
      # 日志。此前这两个服务只写 stdout,进 json-file 驱动 —— 容器一重建现场就没了,而
      # "扫描为什么给了这个结论"这类问题都是事后才被问起的。镜像里 skill-audit 仓根目录的
      # log_conf.yaml 让 uvicorn 同时写 stdout 和 /app/logs/{backend,access}.log(10 MB × 5)。
      #
      # **和判定器必须是两个不同的目录**:RotatingFileHandler 滚动时是 rename + 重开,两个容器
      # 写同一个文件的话,滚动后一方还握着改名前的 inode 继续写,那些行就再也找不到了。
      - /proj/rp_ait_prod/logs/skill-audit:/app/logs
    healthcheck:
      # 只证明进程活着。它不检查判定器与扫描器 —— 引擎 healthy 不等于审计链路 healthy。
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  audit-judge:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/skill-audit-judge:${SKILL_AUDIT_JUDGE_TAG:-f33b3587}
    container_name: ai-portal-be-judge
    restart: unless-stopped
    env_file:
      - ai-portal-be.env
    expose:
      - "8790"
    healthcheck:
      # 判定器降级现在容器层面可见:此前它只在业务上表现为"所有上传都转复核"。
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8790/health').status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      # 判定器的登录态。卷名写死成现有的名字:compose 默认按项目目录派生卷名,
      # 换目录就会挂到一对空卷上,判定器表现为未登录,所有上传 fail-closed 转复核。
      - judge-kiro-home:/root/.kiro
      - judge-kiro-share:/root/.local/share/kiro-cli
      # 日志,与引擎同一套配置但**另一个目录**(理由见引擎那一段)。判定器的日志比引擎更该留:
      # "未登录"这个故障在业务上只表现为"所有上传都转复核",真正的原因写在它自己的输出里。
      - /proj/rp_ait_prod/logs/skill-audit-judge:/app/logs

  grafana:
    image: grafana/grafana:11.1.0
    container_name: rp-ai-grafana
    restart: unless-stopped
    env_file:
      - grafana.env
    environment:
      # 必须与对外入口一致:Grafana 的自生成链接和 Live 的 websocket 地址都由它决定。
      # 写成 http 的话 https 页面里会嵌 http 绝对地址,被浏览器按混合内容拦掉,实时面板断线。
      # 入口变更时这一行要同步改。
      GF_SERVER_ROOT_URL: "https://rpai.ews.gic.ericsson.se/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: "lax"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    ports:
      # 这个端口现在仍然对局域网开放,而 grafana 开着匿名 Viewer、Skill DB 数据源又是
      # proxy 模式 —— 任何能到这里的人不登录就能对门户库跑 SQL(实测:匿名 POST
      # /api/ds/query 带 rawSql 直接返回数据;那台 MySQL 上还有别的团队的库)。
      # 这是个已知且未关闭的洞,不是设计。
      #
      # 2026-08-30 试过只绑 127.0.0.1 + 172.17.0.1(docker0 网关),生产侧一切正常,
      # 但验收环境的 /grafana/ 立刻 502:那个环境是 swarm,两个节点各一个副本,它的
      # traefik 直接连 100.77.162.66:9401(见 deploy/test/edge-dynamic.yml),而 traefik
      # 刻意没有节点约束 —— 落在另一个节点时,网桥网关和回环都到不了。所以已回退。
      #
      # 关掉这个洞的前提是先消掉"跨节点访问这台机器的 9401"这个依赖,两条路:
      #   1. 验收环境有自己的 grafana 实例(在 stack 的 overlay 网络里按服务名访问),
      #      provisioning 用 configs 下发 —— 那个 stack 已经在用这个机制发 traefik 配置。
      #      顺带解开另一件事:验收环境有了自己的实例才能做"删掉数据卷验证可重建"的演练。
      #   2. 只放行两个 swarm 节点的地址(DOCKER-USER 链)。代价是这条状态在仓库里看不见。
      # 在那之前,至少该给数据源换一个只读、只限门户库的 MySQL 用户,把最坏后果限成"读一个库"。
      #
      #   127.0.0.1     本机排障(与 frontend 的 8901 同一个用法)
      #   172.17.0.1    docker0 网关。本仓库里已经没有消费者了 —— 前端自 2026-10-08 起
      #                 按服务名 grafana:3000 访问,不再经过宿主机端口。留着只为临时排障,
      #                 可以和下一条一起收掉。
      #   100.77.162.66 本机局域网地址。这一条就是上面说的洞,只为验收环境的 swarm 而留。
      #                 逐个写明而不是写 "9401:3000",是为了不额外监听 IPv6 与其它网卡。
      - "127.0.0.1:9401:3000"
      - "172.17.0.1:9401:3000"
      - "100.77.162.66:9401:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      # 数据源与仪表盘定义随环境描述一起同步过去,不再从服务器上的源码目录挂。
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # 刻意挂在 /etc 下而不是 /var/lib/grafana/dashboards:后者在数据卷里面,宿主机上
      # 源目录缺失时 docker 会在卷里造一个空目录,再叠上 provider 的 disableDeletion: false
      # 就成了"看板被静默删除"的路径。挂在 /etc 下之后,数据卷里只剩 grafana 自己的状态。
      # 这个路径与 provisioning/dashboards/provider.yml 的 options.path 必须一致。
      - ./grafana/dashboards:/etc/grafana/dashboards:ro

  # ---- genius-ac:AC 领域助手,引擎 + 判定器 ----
  # 一个仓构建两个镜像。判定器持有模型访问(kiro-cli 的 SSO 登录态),引擎不持有任何模型凭据,
  # 只按 LLM_API_BASE 指向判定器 —— 所以判定器的端口就是模型额度本身,不发布到宿主机。
  genius-ac:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/genius-ac:${GENIUS_AC_TAG:-not-deployed}
    container_name: genius-ac
    restart: unless-stopped
    env_file:
      - genius-ac.env
    ports:
      # 对外发布,与 psi(9010)、rtep(9201)、审计后端(9000)同一种做法:
      # http://100.77.162.66:9300 直接可达,不经过门户 nginx。9xxx 是本机对外服务的号段,
      # 89xx 留给只绑回环的(frontend 的 8901)。
      #
      # **这个口子没有鉴权**:GENIUS_AC_PROD_ENV 里是 AUTH_MODE=none,引擎的中间件
      # (main.py:78)因此不检查任何头。引擎会把请求转给判定器,而判定器持有 kiro-cli 的
      # 登录态 —— 所以能到达 9300 的人就能花模型额度。内网可达即可用,这是明知的取舍。
      # 要收紧就把变量改成 AUTH_MODE=token + ENGINE_TOKEN=<串>,引擎启动时会强制校验
      # (main.py:53 对 token 模式下空 ENGINE_TOKEN 直接 RuntimeError)。
      - "9300:8000"
    # 上限不是可选项:这台机器同时跑着生产的全部服务。没有上限的话,引擎一次跑飞就把同机的
    # 门户后端和数据库挤死,而表现出来是"门户挂了",离原因很远 —— 与 skill-audit 同一个理由。
    # 数值按实测留余量:引擎稳态约 70MiB(2026-09-16 docker stats),索引 KB 时会高一些。
    mem_limit: 1g
    cpus: "1.0"
    environment:
      # 部署的 commit,/health 会报出来、界面右下角当徽标显示。与镜像 tag 同一个值。
      APP_GIT_COMMIT: ${GENIUS_AC_TAG:-not-deployed}
      # 三个数据源的位置。**代码真的读这三个变量**(genius_ac/ac_kb_docs.py:51、
      # ac_learn_code.py:40、ac_db.py:59),不设就退到代码里写死的开发机路径。
      # 值等于下面 volumes 里的挂载点 —— 宿主机路径与容器内路径刻意 1:1,
      # 这样"机器上在哪"和"容器里在哪"永远是同一个字符串,不会一边改一边忘。
      #
      # 为什么指向某个人的 home 而不是 /proj/rp_ait_prod/data:这三份数据现在只存在于
      # 那里,是这个服务从手工部署时期就在用的原始位置。搬到 /proj 是下一步(见 DEPLOY.md),
      # 不和"接进 CI"这一步混在一起做 —— 一次只变一件事。
      GENIUS_AC_KB_DIR: /home/enawnfa/ac/ai-assets/knowledge/code/antennacalibration
      GENIUS_AC_CHECKOUT: /home/enawnfa/ac/antennacalibration
      GENIUS_AC_DB_DIR: /home/enawnfa/ac/moduleSysBp8/antennaCalibration
      # 让容器里的 git 认这个 checkout。目录属主是 enawnfa 的 uid,容器以 root 跑,
      # git 的 safe.directory 保护因此拒绝操作它:
      #     fatal: detected dubious ownership in repository at '/home/enawnfa/ac/antennacalibration'
      # 表现不是报错崩掉,而是**静默丢掉版本归属**:learn() 用 git rev-parse 记录学的是哪个
      # commit(ac_learn_code.py:179-180),拿不到就写 None,于是代码层的知识条目说不出
      # "这一行来自哪个版本";/api/ac/admin/status 里 ac_code.head 一直是 null 就是这个。
      # 检索本身照常工作,所以从界面上看不出来。
      #
      # 用 GIT_CONFIG_* 三件套而不是 git config --global:后者要往容器里写文件,
      # 每次换容器都得重做。范围只给这一个目录,不写 * —— 没必要在容器里整个关掉这道保护。
      # KB 目录不需要:实测它往上五层都没有 .git,不是 git 仓库
      # (所以刷新按钮对它报 "KB is vendored (not a live git repo)",那是对的)。
      # 判定器不需要:它不 import ac_learn_code,agent 也没有 shell 工具,跑不到 git。
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /home/enawnfa/ac/antennacalibration
    volumes:
      # 引擎自己也要 KB。它的 _lifespan(main.py:58)在索引为空时跑 index_ac_docs ——
      # 而索引在容器可写层里,每次换容器都是空的,所以每次部署引擎都要重新读一遍 KB。
      # 少挂这一份的表现是 Understanding 永远答不出东西,而容器 healthy、日志一行
      # "doc index skipped"。
      #
      # 用长语法且 create_host_path: false:短语法在源路径不存在时 docker 会**造一个空目录**,
      # 而 ac_kb_docs.py:109 对不存在/空目录直接 return —— 于是 KB 空、检索零命中,
      # 容器却 healthy。宁可起不来。
      - type: bind
        source: /home/enawnfa/ac/ai-assets/knowledge/code/antennacalibration
        target: /home/enawnfa/ac/ai-assets/knowledge/code/antennacalibration
        read_only: true
        bind: {create_host_path: false}
      # 代码 checkout。ac_learn_code 按 commit 学代码、kb_code 按文件行号存条目,
      # 所以这一份**没有**镜像内的兜底(KB 文档有,见 ac_kb_docs.py 的 _VENDORED_KB_DIR)。
      #
      # read_only 是刻意的,但要知道它的代价:界面上那个刷新按钮
      # (POST /api/ac/admin/refresh)在重新索引之前会先对这个目录和 KB 目录各跑一次
      # git fetch + reset --hard(main.py:1017/1023 的 _git_pull)。那两步在这里**跑不通**,
      # 两个独立的原因,2026-09-16 都实测过:
      #   1. 挂载是只读的(容器内 /proc/mounts 标 ro,.git 目录 test -w 为假)
      #   2. 即使可写也过不去 —— 远端是 https://gerrit-sigma.gic.ericsson.se,容器里没有
      #      任何 git 凭据,fetch 直接 "could not read Username"
      # _git_pull 把错误收进返回的 JSON 就继续往下走,所以按钮**照样报成功**、重新索引也
      # 真的做了 —— 只是索引的是磁盘上那份没变的代码。也就是说:**刷新按钮不会让代码变新**,
      # 让它变新的动作在宿主机上(谁 git pull 这个目录),那个动作目前没有归属人。
      # 要让按钮真的能拉,得先决定给容器一个 Gerrit 服务账号凭据、再把这里改成可写 ——
      # 两件都不是配置层面能单独解决的,别顺手把 read_only 去掉了当修好。
      - type: bind
        source: /home/enawnfa/ac/antennacalibration
        target: /home/enawnfa/ac/antennacalibration
        read_only: true
        bind: {create_host_path: false}
      # AC 无线参数库。Understanding 的 "DB config" 视图与那个刷新按钮读这里,
      # 索引成 source_type=ac_db。同样没有镜像内兜底。
      - type: bind
        source: /home/enawnfa/ac/moduleSysBp8
        target: /home/enawnfa/ac/moduleSysBp8
        read_only: true
        bind: {create_host_path: false}
      # Jira 读取用的 token(main.py:120 的后台 ingest 与 jira_ingest.py:327 都按
      # /root/.jira_token 读)。
      #
      # 这里刻意**不走** env-files.txt 那条投放通道,虽然那才是这台机器上凭据的常规做法。
      # 2026-09-16 试过一次又撤回来了,理由是可见范围:这是 Iris 本人的 Jira 个人访问令牌
      # (PAT),放进 platform-ci 的 CI 变量后,这个项目的 11 个 Maintainer/Owner 都能在
      # 设置页明文看到它 —— File 型变量勾不了 masked,而 masked 本来也只管日志、不管设置页。
      # 挂在她 home 下反而只有她和 root 能读,对**个人**凭据来说那是更小的暴露面。
      # 代价是这个凭据没有轮换路径,而且她清理目录或换机器时容器会起不来
      # (create_host_path: false,起不来比静默读到空文件好)。这是明知的取舍。
      #
      # 真正的解法不是在这两者之间选,而是换掉凭据的性质:申请一个 Jira 功能账号,
      # 像这台机器上另外两个外部凭据那样(LDAP 绑定用 ecnrpai@ericsson.se、
      # GitLab 用 project_139337_bot_)。功能账号的 token 放 CI 变量就没有这个顾虑,
      # 那时再搬。**在那之前别再把它挪进 CI 变量** —— 那一步已经走过一次并撤回。
      - type: bind
        source: /home/enawnfa/.jira_token
        target: /root/.jira_token
        read_only: true
        bind: {create_host_path: false}
      # 索引 / 学习进度 / synthesis 写回的知识条目。全都落在 DATA_DIR
      # (_paths.py:DATA_DIR = 项目根/.kiro/agents-mine/ac-assistant/data),即容器可写层 ——
      # 不挂卷的话每次部署都丢:kb_index.sqlite 要重建(可接受),但 learning_progress.sqlite
      # (每个人的学习进度)和 knowledge_base.json(ac_tickets.upsert_entry 写回的条目,
      # MAINTAINERS 专门为它设了准入门槛)是真数据。
      # 命名卷首次创建时会用镜像里的内容播种,所以镜像自带的 knowledge_base.json 不会丢;
      # 反过来,卷一旦存在,后续镜像里更新的那份**不会**再覆盖它 —— 写回既然落在这里,
      # 卷里那份就是权威的那份。
      - genius-ac-data:/app/.kiro/agents-mine/ac-assistant/data
    healthcheck:
      # /health 不鉴权,正是为此存在(auth_mode=token 只挡 /api/*)。容器内监听 8000。
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  genius-ac-judge:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/genius-ac-judge:${GENIUS_AC_JUDGE_TAG:-not-deployed}
    container_name: genius-ac-judge
    restart: unless-stopped
    # 与引擎同一个 env 文件:JUDGE_TOKEN 必须等于引擎的 LLM_API_KEY,分成两个文件就等于
    # 给"两边不一致"留了位置,而它的表现是每次 ask 都 401。
    env_file:
      - genius-ac.env
    environment:
      # kiro-cli 的工作目录 —— agent 的 read / grep / glob / code 四个工具就在这个目录下
      # 看代码(agent json 的 allowedTools 只有这四个,没有 shell)。
      # 名字看起来像个通用变量,其实是 pydantic-settings 的映射:Settings.work_dir
      # (config.py:51)自动认 WORK_DIR,judge.py:82 把它当 AcpClient 的 cwd 传下去。
      #
      # 这里**刻意不设** GENIUS_AC_CHECKOUT:judge.py 只 import genius_ac.acp 与
      # genius_ac.config,不 import ac_learn_code(那三个 ac_* 模块只被引擎 app/main.py
      # 用);Settings 里也没有 checkout 字段(extra="ignore",所以会被直接丢掉);agent
      # 又没有 shell 工具跑不了 python -m。三条都核实过,设了是个死变量。
      WORK_DIR: /home/enawnfa/ac/antennacalibration
    # 上限的理由同引擎,但数值给得宽:判定器里跑的是 kiro-cli,一个会话能开多大内存没有
    # 天然上界,而它是这个服务唯一持有模型登录态的进程 —— 被 OOM 杀掉就是"所有提问都失败"。
    # 实测稳态约 430MiB(2026-09-16 docker stats),留约 9 倍余量。
    mem_limit: 4g
    cpus: "2.0"
    # 不发布端口。它是一个模型访问入口,能到达就能花额度、跑任意 prompt。
    # 引擎在同一个 compose 网络里按服务名访问它(genius-ac-judge:8790)。
    expose:
      - "8790"
    healthcheck:
      # 判定器降级(未登录、模型不可用)在业务上只表现为"所有提问都失败",
      # 真正的原因在它自己的输出里 —— 所以要有容器层面的可见性。
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8790/health').status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      # kiro-cli 的 SSO 登录态。不在任何备份里;丢了就要手动再 kiro-cli login 一次。
      # 镜像名不能改:卷名与它绑定,改名会挂到一对空卷上,表现为未登录。
      - genius-ac-kiro-home:/root/.kiro
      - genius-ac-kiro-share:/root/.local/share/kiro-cli
      # 代码 checkout,只读。宿主机路径与容器内路径 1:1,并由上面的 WORK_DIR 指向同一个
      # 字符串 —— agent 的 read / grep / glob / code 四个工具就在这里看代码。
      # 判定器不挂 KB 文档:它用镜像里自带的那份快照
      # (ac_kb_docs.py 的 _VENDORED_KB_DIR = kb/antennacalibration,Dockerfile.judge:39
      # 的 COPY kb ./kb 拷进去的),文档变动少、随镜像走即可。
      #
      # 长语法 + create_host_path: false:短语法在源路径不存在时 docker 会造一个空目录,
      # 而空目录对检索等于没挂 —— 容器照样 healthy、只是什么都学不到。宁可起不来。
      - type: bind
        source: /home/enawnfa/ac/antennacalibration
        target: /home/enawnfa/ac/antennacalibration
        read_only: true
        bind: {create_host_path: false}
      # 索引与知识条目。与引擎共用同一个卷。写入方是**引擎**:ac_learn_code / ac_kb_docs /
      # ac_db 三个模块只被 app/main.py import,judge.py 只 import acp 与 config。
      # (此处原先写的"判定器的 ac_learn_code 往里写"是错的,2026-09-16 核实后改。)
      # 判定器仍要挂这个卷:它跑的 kiro-cli agent 通过 read/grep/glob/code 读同一份数据,
      # 不共用就看不见引擎学到的东西。
      - genius-ac-data:/app/.kiro/agents-mine/ac-assistant/data

  # ---- 前端 ----
  # 与 staging 跑同一个镜像 digest,区别只在下面三个上游地址。
  work-connector:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/work-connector:${WORK_CONNECTOR_TAG:-not-deployed}
    container_name: work-connector
    restart: unless-stopped
    environment:
      # 展示时区。后端用它决定"今天"从几点开始 —— 容器是 UTC,不设的话"今天"会从
      # 北京时间早上 8 点算起。
      WC_TZ: "Asia/Shanghai"
      # 生产界面在门户里,同源,不需要 CORS。留空即关掉。
      WC_CORS_ORIGINS: ""
    # **不发布端口,也不 expose。** 与 eridoc-client 是同一个结论但不同的理由:
    # eridoc-client 通过一个共用服务账号读取,未认证到达就等于发放本人无权看的文档;
    # 这个服务不持有任何凭据,每个调用自带调用者本人的 Graph token 并严格以那个人的身份
    # 行事,所以未认证的人拿不到他本来没有的东西 —— 没有可提升的权限。
    # 真正的理由是:一个可达的端口会让这台机器变成任何人都能用的 graph.microsoft.com 中继。
    healthcheck:
      # /api/health 不需要 token,正是为此存在。容器内监听 8000(基础镜像的 APP_PORT)。
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/rp-ai-portal-fe:${RP_AI_PORTAL_FE_TAG:-63acaea6}
    container_name: rp-ai-portal-fe
    restart: unless-stopped
    ports:
      # 只绑回环,不对网络开放。唯一对外入口是 edge(443),它在同一个 compose 网络里
      # 按服务名访问本服务。留这个口子有两个用途:在两层结构里隔离故障(是 edge 坏了
      # 还是应用坏了),以及 edge 出问题时的降级入口。
      # 对外的 9001 现在由 edge 持有并只回 302 到域名。
      - "127.0.0.1:8901:80"
    environment:
      # 五个上游一律走服务名。14 个服务同在默认项目网络里,名字现在就解析得到 ——
      # 此前这三项绕宿主机端口走一圈(容器 → 宿主机 9000/9010/9401 → 容器),等价但多一跳,
      # 而且它在集群上是坏的:swarm 不支持 extra_hosts 的 host-gateway,这个名字解析不出来;
      # 即使解析出来它也只指向"副本所在那台机器"。前端在集群上是多副本一台一个,所以症状是
      # 一半请求 502、一半正常 —— 这种故障离原因很远,所以提前在单机形态下改掉并验证。
      #
      # 2026-10-08 在生产上验过:同镜像同网络起一个只绑回环的一次性容器,只改这三个变量,
      # 与在跑的容器逐条对比 /、/api/version、/api/health、/api/product-structure/health、
      # /api/product-structure/vem/、/grafana/、/api/work-connector/health、/api/eridoc/
      # 八条路径,状态码与响应体 md5 全部相同。psi 那两条是 404 而非 502,说明请求确实到了
      # psi(代理不通会是 502)。反面探针:把 AUDIT_UPSTREAM 故意写错一个字,nginx 直接
      # emerg 拒绝加载配置、容器以 1 退出 —— 失败是响亮的,不会半坏着没人发现。
      #
      # 9000/9010/9401 三个宿主机端口照旧发布,直连它们的东西不受本改动影响。
      AUDIT_UPSTREAM: "http://audit-backend:8000"
      PSI_UPSTREAM: "http://product-structure-information:8000"
      GRAFANA_UPSTREAM: "http://grafana:3000"
      # 这两项本来就是服务名:那个服务不再发布宿主机端口,
      # 只在这个 compose 项目的网络里可达 —— 这正是它的鉴权模式所要求的。
      ERIDOC_UPSTREAM: "http://eridoc-client:8000"
      # 同理走服务名。**这一项不能缺**:envsubst 对未定义变量替换成空串,配置里就会出现
      # `proxy_pass /api/;`,nginx 起不来 —— 挂的是整个门户,不是那一个工具。
      # 而且 nginx 在加载配置时就解析 proxy_pass 里的主机名,所以 work-connector 容器
      # 必须先于新版 frontend 存在,否则同样起不来。顺序见 work-connector/DEPLOY.md。
      WC_UPSTREAM: "http://work-connector:8000"
    healthcheck:
      # 打 127.0.0.1 而不是 localhost:容器 /etc/hosts 里 localhost 同时解析到 ::1,
      # busybox wget 优先走 IPv6,而 nginx 只监听 0.0.0.0——旧的探测因此一直被拒,
      # 容器长期显示 unhealthy 而站点其实是好的。
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- 对外入口 ----
  # 唯一对外入口。只做两件事:终止 TLS、把老入口 9001 跳到新域名。路由一概不管 ——
  # /api/、/api/product-structure/、/grafana/ 全由前端容器内那层 nginx 决定,那是应用的
  # 一部分(随前端版本变);这一层持有主机名、证书、TLS 参数(随环境变)。所以 edge/nginx.conf
  # 刻意写得处处比前端容器内更宽松,前端调自己的超时和上传上限时这里不用跟着改。
  #
  # 为什么不把 TLS 塞进前端镜像:证书由 CLM 手工签发、没有 ACME,续期与前端发版是两条独立的
  # 时间线,焊进镜像等于把换证书变成一次应用发版;而且前端镜像与 staging 共用同一 digest,
  # 加 TLS 会让两个环境分叉。
  #
  # 证书不进 git,也不能放在本目录 —— 部署是 rsync --delete,放这里会被下次部署清掉。
  # 手工投放到 /proj/rp_ait_prod/certs/rpai/,与 ai-portal-be 的部署密钥同一模式
  # (终态应由部署任务从 CI File 变量投放)。挂的是**目录**而不是两个文件:续期换 inode,
  # 挂文件的话容器内永远看不到新证书,reload 后仍是旧证书且不报错。
  # 续期步骤见 /proj/rp_ait_prod/certs/rpai/RENEWAL.md
  #
  # 不挂 /var/log/nginx:本镜像把 access.log/error.log 做成了指向 /dev/stdout、/dev/stderr
  # 的符号链接,盖上宿主机目录会把它们埋掉(docker logs 就空了),还会在没有轮转的情况下
  # 往磁盘堆文件。日志走容器标准输出。
  #
  # 本服务不在 services.txt 里:用的是第三方镜像,没有对应构建流水线,部署任务不会重建它
  # —— 与 grafana 一样,改了配置要手动 docker compose up -d edge。
  edge:
    image: nginx:1.27-alpine
    container_name: rp-ai-edge
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # 老入口。前端已不再对外发布 9001,这个端口现在由本服务持有,只回 302。
      - "9001:9001"
    volumes:
      # 挂**目录**而不是挂 edge/nginx.conf 这一个文件。理由与下面证书那条完全相同,
      # 而且是 2026-10-08 实打实踩过一次:部署是 rsync,它不在原文件里改字,而是写一个新
      # 文件再改名顶上去 —— 新文件是新 inode。挂单个文件时 docker 记住的是 inode 而不是
      # 路径,所以容器里**永远是旧内容**:`nginx -t` 校验的是旧配置、`nginx -s reload`
      # 返回成功、而配置一个字没换,并且全程不报错。那次切换以为生效了,是用 `nginx -T`
      # 配一个带唯一标记的请求才查出来的。
      #
      # 挂目录之后 inode 不会变,rsync 换掉里面的文件容器立刻看得见,改配置只要 reload,
      # 不必重建容器、443 不中断。
      #
      # 容器里的文件名随之变成 conf.d/nginx.conf(不再是 default.conf)。这没有影响:
      # 主配置 include 的是 conf.d/*.conf。而且整个 conf.d 被这个目录盖住,镜像自带的
      # default.conf 一起消失,不会再有两份监听 80 的 server 块。
      - ./edge:/etc/nginx/conf.d:ro
      - /proj/rp_ait_prod/certs/rpai:/etc/nginx/certs:ro
    depends_on:
      - frontend
    healthcheck:
      # 打专用的 8081/healthz,不打 80 或 9001:那两个都返回 302,busybox wget 会跟着跳到
      # 外网域名上,健康检查就变成了在测 DNS 和证书。
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- 路由层 ----
  # 目标:把"哪个对外路径去哪个服务"这张表从前端镜像里搬到环境描述里,这样改一条路由
  # 不必再发一次前端版本。表在 edge-dynamic.yml,逐条照前端那份 nginx.conf.template 复刻。
  #
  # 形态是**待在 edge 后面**,不是取代它:
  #   浏览器 --443--> edge(TLS、域名、302)--> traefik(路由)--> 各服务
  # 所以它不碰 443、不碰证书、不和谁抢端口。
  #
  # 2026-10-08 分两步上线:先只绑回环 8902、在生产上与当时仍在服务的前端路由(8901)逐条
  # 对比 10 条路径(状态码与响应体 md5 全等、缓存头一致、traefik 访问日志里 6 个 router
  # 落点全对),通过之后才把 edge/nginx.conf 里 `set $fe` 从 frontend:80 改成 traefik:80。
  # 回退就是把那一行改回去并 reload edge(配置是 bind mount,reload 无需重建容器)。
  #
  # 8902 这个回环端口保留:它是"绕过 edge 单独测路由层"的入口,与 frontend 的 8901、
  # grafana 的 127.0.0.1:9401 同一个用法 —— 出问题时能一刀切开是 edge 还是路由层。
  #
  # 本服务不在 services.txt 里:第三方镜像、没有对应构建流水线,部署任务不会重建它 ——
  # 与 edge 和 grafana 一样,改了配置要手动 docker compose up -d traefik。
  # 注意 dynamic.yml 是 watch: true 热加载的,**只改路由不需要重启**;改 static.yml 才要。
  traefik:
    image: armdocker.rnd.ericsson.se/dockerhub-ericsson-remote/traefik:v3.5
    container_name: rp-ai-traefik
    restart: unless-stopped
    command: ["--configFile=/etc/traefik/static.yml"]
    ports:
      # 只绑回环,不对网络开放。对外流量由 edge 在 443 收下后转进来。
      - "127.0.0.1:8902:80"
    volumes:
      # compose 形态下用 bind mount;上集群之后换成 docker config(见 stack.yml)。
      - ./edge-static.yml:/etc/traefik/static.yml:ro
      - ./edge-dynamic.yml:/etc/traefik/dynamic.yml:ro
    healthcheck:
      # 这个镜像是 FROM scratch(没有 shell、没有 wget),所以唯一可用的探测方式是 traefik
      # 自己的子命令,它要求 static.yml 里开着 ping 端点。2026-10-08 用一次性容器验过:
      # 返回 "OK: http://:8080/ping"、退出码 0。
      test: ["CMD", "traefik", "healthcheck", "--configFile=/etc/traefik/static.yml"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- 拓扑配置工具(纯静态单页)----
  # 仓库 rp-ai-miao/rsw/digital-chip-topology-configurator。一个自包含的 index.html
  # (HTML/CSS/JS 全内联、无外部资源),所以没有后端、没有上游、不挂目录、不要密钥,
  # 这一段比别的都短。
  #
  # 端口 9030:这台机器上 90xx 段已占 9000(审计后端)、9001(edge 老入口)、9010(psi)、
  # 9020(po-reporting-portal),另有 9201、9300(genius-ac);9030 是 90x0 这条序列的下一个。
  #
  # 不挂在 edge 的 nginx 后面:那份路由映射是门户的,把一个无关的独立工具页插进去要占一个
  # 路径前缀、并且改了要手动 `docker compose up -d edge`(edge 不在 services.txt 里)。
  # 给它一个自己的端口更便宜、也更好回退 —— 删掉这一段就没了,门户零改动。
  topology-configurator:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/digital-chip-topology-configurator:${DIGITAL_CHIP_TOPOLOGY_CONFIGURATOR_TAG:-not-deployed}
    container_name: digital-chip-topology-configurator
    restart: unless-stopped
    ports:
      - "9030:80"
    healthcheck:
      # 127.0.0.1 而不是 localhost:后者同时解析到 ::1,而镜像里的 nginx 只监听 IPv4,
      # 探测会一直被拒、容器长期 unhealthy 而站点其实是好的(前端那段撞过)。
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- ReqFlow 结果核查:界面 + 判定器 ----
  # 一个仓构建两个镜像(rp-ai-miao/ps/reqflow-result-check)。核查本身**不需要模型** ——
  # 三步对比、少选分诊、来源定位、HTML 报告全是算出来的;需要模型的只有「逐条复核谁对」这一件
  # 事。所以判定器不可用时界面照常可用,只少「谁对」那一栏(服务仓 checker/llm_results.py 的
  # 读取纪律把这件事写成了测试)。
  reqflow-result-check:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/reqflow-result-check:${REQFLOW_RESULT_CHECK_TAG:-not-deployed}
    container_name: reqflow-result-check
    restart: unless-stopped
    ports:
      # 9040 是按现有规律取的下一个十位(9000 audit-backend / 9010 psi / 9020 po /
      # 9030 topology)。生产的 edge 是 nginx 而不是 Traefik,走路径前缀要改 nginx 配置,
      # 所以这里和其他几个服务一样直接给端口。测试环境那侧不占端口,走 :9101/reqflow/。
      #
      # **这个口子没有鉴权。** 和 genius-ac 的 9300 是同一类明知的取舍,但多一层:包里是
      # AIR 3284 的真实需求内容 —— 能到达 9040 的人既能看这些内容,也能花模型额度
      # (界面会把请求转给判定器,而判定器持有 kiro-cli 的登录态)。2026-09-20 由 Miao 明确
      # 接受。要收紧得在服务仓加登录,不是改这里。
      - "9040:8000"
    # reqflow-result-check.env(File 型 CI 变量 REQFLOW_RESULT_CHECK_PROD_ENV)里的键 ——
    # 那份文件不在 git 里,键的存在在这个仓库中完全不可见,所以按 PLATFORM.md 的约定列在这里:
    #   REQFLOW_OPENAI_ENDPOINT_URL   指向判定器,写全路径:
    #                                 http://reqflow-result-check-judge:8790/v1/chat/completions
    #                                 服务仓 reqflow/llm_client.py 里这个变量是**整体覆盖**端点,
    #                                 所以不受它那条写死的 azure 路径影响
    #   REQFLOW_AUTH_TOKEN            界面调判定器时带的令牌,必须与判定器的
    #                                 REQFLOW_JUDGE_TOKEN 同值,否则每次复核 401
    #   REQFLOW_JUDGE_TOKEN           判定器侧校验的那一串(同上)
    #   REQFLOW_JUDGE_KIRO_MODEL      判定器用哪个模型。**钉死,不要 auto** —— 核查报告的可信度
    #                                 建立在「这批结论是哪个模型给的」上,auto 换了没人看得出来。
    #                                 这里用 claude-opus-5 而非另外三个判定器的 sonnet:
    #                                 这个判定器裁决的是「另一个大模型判错了还是人判错了」
    env_file:
      - reqflow-result-check.env
    healthcheck:
      # 用 127.0.0.1 而不是 localhost:localhost 会走 ::1,而这个服务(Flask 经 a2wsgi 由
      # uvicorn 起)只监听 IPv4,现象是「容器 unhealthy 但服务能访问」—— README 的排错表里
      # 专门列了这一条。
      #
      # 刻意不探判定器:探它要真跑一次 ACP(几十秒、花配额),而健康检查失败会让 compose 重建
      # 容器。判定器登录态失效的表现是每次复核都失败,不是界面 unhealthy。
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 启动时要 import openpyxl 那条链,冷启动慢一截。
      start_period: 40s
    volumes:
      # 日志,与其他服务同一套约定(log_conf.yaml 让 uvicorn 同时写 stdout 和 /app/logs)。
      - /proj/rp_ait_prod/logs/reqflow-result-check:/app/logs
      # 数据:用户上传的两份 Excel、baseline / PRG / 判定规则、以及 full_analysis.jsonl
      # (「谁对」那一栏读它)。不挂出来就在容器可写层里,重建容器即全丢。
      #
      # 末尾那一层 data/ 是刻意的:宿主机侧要和仓库结构长得一样(仓库里 data/ 是真实存在的
      # 一层,由 8 个 .gitkeep 占位保留),人往里放 baseline / PRG 时按仓库结构找目录最省事。
      # 与 rtep-flow-manager / po-reporting-portal 那种 <服务名>:/app/data 的"平"形状不同,
      # 代价是路径里出现两个 data —— 前一个是平台数据区,后一个是仓库里的那一层。
      - /proj/rp_ait_prod/data/reqflow-result-check/data:/app/data

  # ReqFlow 核查的判定器。和另外三个判定器(audit-judge / genius-ac-judge,以及集群里的
  # sequence-diagram-judge / fi-analysis-judge)一个都不能共用:
  #   · 卷独占 —— 同一个 kiro-cli 配置目录被两个容器同时写会互相踩;
  #   · 端点 agent 不同 —— 这个要求回一个 JSON **对象**(与 audit-judge 同类),
  #     fi 那个要 JSON 数组、seqdiag 那个要 PlantUML。喂错了两次尝试全白跑。
  reqflow-result-check-judge:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/reqflow-result-check-judge:${REQFLOW_RESULT_CHECK_JUDGE_TAG:-not-deployed}
    container_name: reqflow-result-check-judge
    restart: unless-stopped
    # 与界面同一个 env 文件:REQFLOW_JUDGE_TOKEN 必须等于界面带的那个令牌,分成两个文件就等于
    # 给"两边不一致"留了位置,而它的表现是每次复核都 401。
    env_file:
      - reqflow-result-check.env
    # 不发布端口。它是一个模型访问入口,能到达就能花额度、跑任意 prompt。
    # 界面在同一个 compose 网络里按服务名访问它(reqflow-result-check-judge:8790)。
    expose:
      - "8790"
    healthcheck:
      # 判定器降级(未登录、模型不可用)在业务上只表现为"复核那一栏一直空着",
      # 真正的原因在它自己的输出里 —— 所以要有容器层面的可见性。
      # 注意它**不检查登录态**(那要真跑一次 ACP):healthy 不等于能出结论。
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8790/health').status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      # kiro-cli 的 SSO 登录态。不在任何备份里;丢了就要手动再 kiro-cli login 一次。
      - reqflow-kiro-home:/root/.kiro
      - reqflow-kiro-share:/root/.local/share/kiro-cli
      # 日志。判定器的日志比界面更该留:"未登录"这个故障在业务上只表现为"复核那一栏空着",
      # 真正的原因写在它自己的输出里。
      - /proj/rp_ait_prod/logs/reqflow-result-check-judge:/app/logs

volumes:
  # 声明为外部卷:这些数据先于本描述存在,compose 不该按项目名新建一套。
  judge-kiro-home:
    external: true
    name: ai-portal-be_judge-kiro-home
  judge-kiro-share:
    external: true
    name: ai-portal-be_judge-kiro-share
  grafana-data:
    external: true
    name: ai-portal-be_grafana-data
  # 判定器的 SSO 登录态。写 external 且名字写死,理由是 app/judge.py 的模块注释点名要求的:
  # 派生名跟着 compose 项目目录走,换一次目录就挂到一对空卷上,表现为"未登录" —— 而登录态是
  # 这个服务唯一、且最难恢复的状态(要人手动 kiro-cli login)。名字不带目录前缀,正是为了
  # 让它不随目录变化。首次部署前在主机上建一次:
  #   docker volume create genius-ac_kiro-home && docker volume create genius-ac_kiro-share
  genius-ac-kiro-home:
    external: true
    name: genius-ac_kiro-home
  genius-ac-kiro-share:
    external: true
    name: genius-ac_kiro-share
  # 引擎与判定器共用。同上写死名字:换目录不该让人的学习进度和知识条目消失。
  genius-ac-data:
    external: true
    name: genius-ac_data
  # ReqFlow 核查判定器的 SSO 登录态。同样 external + 名字写死,理由同上:派生名跟着 compose
  # 项目目录走,换一次目录就挂到一对空卷上,表现为"未登录",而那离真实原因很远。
  # 首次部署前在主机上建一次:
  #   docker volume create reqflow-result-check_judge-kiro-home
  #   docker volume create reqflow-result-check_judge-kiro-share
  reqflow-kiro-home:
    external: true
    name: reqflow-result-check_judge-kiro-home
  reqflow-kiro-share:
    external: true
    name: reqflow-result-check_judge-kiro-share
