# 生产环境。这个文件的 git 历史就是这台机器的部署记录。
#
# 发布 = 改 image: 那一行的标签并合并,然后手动触发 deploy-prod。
# 回滚 = revert 那次提交,再触发一次——不需要重新构建。
#
# 密钥不在这里:product-structure-information.env 由部署任务从 CI 的 File 变量
# PSI_PROD_ENV 投放到本目录。
services:
  product-structure-information:
    image: armdocker.rnd.ericsson.se/proj-rvc/rp-ai/product-structure-information:925f24b0@sha256:01e369ea4fda18bf1665aa246df0e72c525db133fe0e0578553e0b99aab3c24c
    container_name: product-structure-information
    restart: unless-stopped
    env_file:
      - product-structure-information.env
    # 容器内统一 8000;9010 是这台机器上对外的端口,属于环境的事实。
    ports:
      - "9010:8000"
    volumes:
      - /proj/rp_ait_prod/logs/product-structure-information:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  rtep-flow-manager:
    image: armdocker.rnd.ericsson.se/proj-rvc/rp-ai/rtep-flow-manager:ce5a702d@sha256:6444c98c8b4467011863152106b3fc5e385166e1b6b6f7279b0843ffaabdbb9d
    container_name: rtep-flow-manager
    restart: unless-stopped
    ports:
      - "9201:8000"
    volumes:
      - /proj/rp_ait_prod/logs/rtep-flow-manager:/app/logs
      - /proj/rp_ait_prod/data/rtep-flow-manager:/app/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # 没有 env_file:该服务的 PROD_ENV 与服务器上的 .env 都是空的,生产从来没给它配过
    # 环境变量(代码里读的 RTEP_SMTP_* 目前全未设置)。这是既有状态,迁移不改它。

  # agent-artifex 属于本环境但当前不运行(容器自 2026-08-05 起是 Exited)。
  # profiles 让 docker compose up 跳过它;删掉 profiles 两行即启动。
  agent-artifex:
    image: armdocker.rnd.ericsson.se/proj-rvc/rp-ai/agent-artifex:ead8343c@sha256:40ddebadd9ec815bf838ac7e5d4cc3a4c4b08ac599ff1fd4914a7566875c1483
    container_name: agent-artifex
    restart: unless-stopped
    profiles:
      - stopped
    ports:
      - "10000:8000"
    volumes:
      - /proj/rp_ait_prod/logs/agent-artifex:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- 技能审计栈 ----
  # 三个容器共用两个镜像:后端与对账器是同一个镜像的两种角色,判定器是另一个镜像。
  # 容器名保持原样(ai-portal-be-*),前端 nginx 按宿主机端口 9000 反代,与容器名无关。
  audit-backend:
    image: armdocker.rnd.ericsson.se/proj-rvc/rp-ai/rp-ai-portal-be:f33b3587@sha256:93cbb243e60ed3bacba001c876ffeab5cdbd23817c8d25521ce33c561b1aef93
    container_name: ai-portal-be-backend
    restart: unless-stopped
    env_file:
      - ai-portal-be.env
    environment:
      AUDIT_JUDGE_URL: "http://audit-judge:8790"
    ports:
      - "9000:8000"
    volumes:
      # 技能仓的工作副本。容器内路径与代码里的默认值一致,改一处要同时改另一处。
      - /proj/rp_ait_prod/data/ai-portal-be/rp-ai-skill:/proj/radio_ivc_rvc_workspace/ezhgmio/rp-ai-skill
      - /proj/rp_ait_prod/logs/ai-portal-be:/app/logs
      # 推技能仓用的部署密钥,只读。
      # 推技能仓用的部署密钥,只读。路径仍在旧部署目录下,因此该目录不能退役;
      # 终态是像其它环境密钥一样由部署任务投放(见 DESIGN.md 待别人处理)。
      - /proj/rp_ait_prod/services/ai-portal-be/ssh:/root/.ssh:ro
    depends_on:
      - audit-judge
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  audit-reconciler:
    image: armdocker.rnd.ericsson.se/proj-rvc/rp-ai/rp-ai-portal-be:f33b3587@sha256:93cbb243e60ed3bacba001c876ffeab5cdbd23817c8d25521ce33c561b1aef93
    container_name: ai-portal-be-reconciler
    restart: unless-stopped
    env_file:
      - ai-portal-be.env
    environment:
      RECONCILE_INTERVAL: "300"
    entrypoint: ["python", "-m", "app.reconcile", "--watch"]
    depends_on:
      - audit-backend

  audit-judge:
    image: armdocker.rnd.ericsson.se/proj-rvc/rp-ai/skill-audit-judge:f33b3587@sha256:607e6358ba7ba0b7902eafa6bfe11e03239927b97c03cd9b4830e2d9eb31e246
    container_name: ai-portal-be-judge
    restart: unless-stopped
    env_file:
      - ai-portal-be.env
    expose:
      - "8790"
    healthcheck:
      # 判定器降级现在容器层面可见:此前它只在业务上表现为"所有上传都转复核"。
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8790/health').status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      # 判定器的登录态。卷名写死成现有的名字:compose 默认按项目目录派生卷名,
      # 换目录就会挂到一对空卷上,判定器表现为未登录,所有上传 fail-closed 转复核。
      - judge-kiro-home:/root/.kiro
      - judge-kiro-share:/root/.local/share/kiro-cli

  grafana:
    image: grafana/grafana:11.1.0
    container_name: rp-ai-grafana
    restart: unless-stopped
    env_file:
      - grafana.env
    environment:
      GF_SERVER_ROOT_URL: "http://100.77.162.66:9001/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: "lax"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    ports:
      - "9401:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      # 数据源与仪表盘定义随环境描述一起同步过去,不再从服务器上的源码目录挂。
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  # ---- 前端 ----
  # 与 staging 跑同一个镜像 digest,区别只在下面三个上游地址。
  frontend:
    image: armdocker.rnd.ericsson.se/proj-rvc/rp-ai/rp-ai-portal-fe:63acaea6@sha256:c8bea82cbc323e22025521951056006ebffc97f06aef30b7aa4a0a747e838d31
    container_name: rp-ai-portal-fe
    restart: unless-stopped
    ports:
      - "9001:80"
    environment:
      AUDIT_UPSTREAM: "http://host.docker.internal:9000"
      PSI_UPSTREAM: "http://host.docker.internal:9010"
      GRAFANA_UPSTREAM: "http://host.docker.internal:9401"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # 打 127.0.0.1 而不是 localhost:容器 /etc/hosts 里 localhost 同时解析到 ::1,
      # busybox wget 优先走 IPv6,而 nginx 只监听 0.0.0.0——旧的探测因此一直被拒,
      # 容器长期显示 unhealthy 而站点其实是好的。
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # 声明为外部卷:这些数据先于本描述存在,compose 不该按项目名新建一套。
  judge-kiro-home:
    external: true
    name: ai-portal-be_judge-kiro-home
  judge-kiro-share:
    external: true
    name: ai-portal-be_judge-kiro-share
  grafana-data:
    external: true
    name: ai-portal-be_grafana-data
