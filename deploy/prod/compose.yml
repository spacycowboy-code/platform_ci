# 这台机器上跑什么。镜像标签由部署任务写在环境目录的 .env 里;下面的默认值是上次已知的版本,
# 只在 .env 里没有对应项时生效——判断线上实际跑什么看 .env 或部署日志,不要看这里。
# 生产环境。这个文件的 git 历史就是这台机器的部署记录。
#
# 发布 = 改 image: 那一行的标签并合并,然后手动触发 deploy-prod。
# 回滚 = revert 那次提交,再触发一次——不需要重新构建。
#
# 密钥不在这里:product-structure-information.env 由部署任务从 CI 的 File 变量
# PSI_PROD_ENV 投放到本目录。
services:
  eridoc-client:
    image: armdocker.rnd.ericsson.se/proj-rvc/rp-ai/eridoc-client:${ERIDOC_CLIENT_TAG:-not-deployed}
    container_name: eridoc-client
    restart: unless-stopped
    env_file:
      - eridoc-client.env
    # 容器内统一 8000;8756 是这台机器上对外的端口,属于环境的事实。
    ports:
      - "8756:8000"
    volumes:
      # 审计日志(谁读了哪份文档)写在 /app/data/log/<日期>/,是这个服务存在的理由之一,
      # 必须跨部署保留,所以挂到宿主机而不是留在容器里。
      - /proj/rp_ait_prod/logs/eridoc-client:/app/data
    healthcheck:
      # 本服务的免鉴权健康端点是 /api/health,不是其它服务的 /health。
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  product-structure-information:
    image: armdocker.rnd.ericsson.se/proj-rvc/rp-ai/product-structure-information:${PRODUCT_STRUCTURE_INFORMATION_TAG:-925f24b0}
    container_name: product-structure-information
    restart: unless-stopped
    env_file:
      - product-structure-information.env
    # 容器内统一 8000;9010 是这台机器上对外的端口,属于环境的事实。
    ports:
      - "9010:8000"
    volumes:
      - /proj/rp_ait_prod/logs/product-structure-information:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  rtep-flow-manager:
    image: armdocker.rnd.ericsson.se/proj-rvc/rp-ai/rtep-flow-manager:${RTEP_FLOW_MANAGER_TAG:-ce5a702d}
    container_name: rtep-flow-manager
    restart: unless-stopped
    ports:
      - "9201:8000"
    volumes:
      - /proj/rp_ait_prod/logs/rtep-flow-manager:/app/logs
      - /proj/rp_ait_prod/data/rtep-flow-manager:/app/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # 没有 env_file:该服务的 PROD_ENV 与服务器上的 .env 都是空的,生产从来没给它配过
    # 环境变量(代码里读的 RTEP_SMTP_* 目前全未设置)。这是既有状态,迁移不改它。

  # agent-artifex 属于本环境但当前不运行(容器自 2026-08-05 起是 Exited)。
  # profiles 让 docker compose up 跳过它;删掉 profiles 两行即启动。
  agent-artifex:
    image: armdocker.rnd.ericsson.se/proj-rvc/rp-ai/agent-artifex:${AGENT_ARTIFEX_TAG:-ead8343c}
    container_name: agent-artifex
    restart: unless-stopped
    profiles:
      - stopped
    ports:
      - "10000:8000"
    volumes:
      - /proj/rp_ait_prod/logs/agent-artifex:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- 技能审计栈 ----
  # 三个容器共用两个镜像:后端与对账器是同一个镜像的两种角色,判定器是另一个镜像。
  # 容器名保持原样(ai-portal-be-*),前端 nginx 按宿主机端口 9000 反代,与容器名无关。
  audit-backend:
    image: armdocker.rnd.ericsson.se/proj-rvc/rp-ai/rp-ai-portal-be:${RP_AI_PORTAL_BE_TAG:-f33b3587}
    container_name: ai-portal-be-backend
    restart: unless-stopped
    env_file:
      - ai-portal-be.env
    environment:
      AUDIT_JUDGE_URL: "http://audit-judge:8790"
    ports:
      - "9000:8000"
    volumes:
      # 技能仓的工作副本。容器内路径与代码里的默认值一致,改一处要同时改另一处。
      - /proj/rp_ait_prod/data/ai-portal-be/rp-ai-skill:/proj/radio_ivc_rvc_workspace/ezhgmio/rp-ai-skill
      - /proj/rp_ait_prod/logs/ai-portal-be:/app/logs
      # 推技能仓用的部署密钥,只读。
      # 推技能仓用的部署密钥,只读。路径仍在旧部署目录下,因此该目录不能退役;
      # 终态是像其它环境密钥一样由部署任务投放(见 DESIGN.md 待别人处理)。
      - /proj/rp_ait_prod/services/ai-portal-be/ssh:/root/.ssh:ro
    depends_on:
      - audit-judge
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  audit-reconciler:
    image: armdocker.rnd.ericsson.se/proj-rvc/rp-ai/rp-ai-portal-be:${RP_AI_PORTAL_BE_TAG:-f33b3587}
    container_name: ai-portal-be-reconciler
    restart: unless-stopped
    env_file:
      - ai-portal-be.env
    environment:
      RECONCILE_INTERVAL: "300"
    entrypoint: ["python", "-m", "app.reconcile", "--watch"]
    depends_on:
      - audit-backend

  audit-judge:
    image: armdocker.rnd.ericsson.se/proj-rvc/rp-ai/skill-audit-judge:${SKILL_AUDIT_JUDGE_TAG:-f33b3587}
    container_name: ai-portal-be-judge
    restart: unless-stopped
    env_file:
      - ai-portal-be.env
    expose:
      - "8790"
    healthcheck:
      # 判定器降级现在容器层面可见:此前它只在业务上表现为"所有上传都转复核"。
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8790/health').status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      # 判定器的登录态。卷名写死成现有的名字:compose 默认按项目目录派生卷名,
      # 换目录就会挂到一对空卷上,判定器表现为未登录,所有上传 fail-closed 转复核。
      - judge-kiro-home:/root/.kiro
      - judge-kiro-share:/root/.local/share/kiro-cli

  grafana:
    image: grafana/grafana:11.1.0
    container_name: rp-ai-grafana
    restart: unless-stopped
    env_file:
      - grafana.env
    environment:
      GF_SERVER_ROOT_URL: "http://100.77.162.66:9001/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: "lax"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    ports:
      - "9401:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      # 数据源与仪表盘定义随环境描述一起同步过去,不再从服务器上的源码目录挂。
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  # ---- 前端 ----
  # 与 staging 跑同一个镜像 digest,区别只在下面三个上游地址。
  frontend:
    image: armdocker.rnd.ericsson.se/proj-rvc/rp-ai/rp-ai-portal-fe:${RP_AI_PORTAL_FE_TAG:-63acaea6}
    container_name: rp-ai-portal-fe
    restart: unless-stopped
    ports:
      - "9001:80"
    environment:
      AUDIT_UPSTREAM: "http://host.docker.internal:9000"
      PSI_UPSTREAM: "http://host.docker.internal:9010"
      GRAFANA_UPSTREAM: "http://host.docker.internal:9401"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # 打 127.0.0.1 而不是 localhost:容器 /etc/hosts 里 localhost 同时解析到 ::1,
      # busybox wget 优先走 IPv6,而 nginx 只监听 0.0.0.0——旧的探测因此一直被拒,
      # 容器长期显示 unhealthy 而站点其实是好的。
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # 声明为外部卷:这些数据先于本描述存在,compose 不该按项目名新建一套。
  judge-kiro-home:
    external: true
    name: ai-portal-be_judge-kiro-home
  judge-kiro-share:
    external: true
    name: ai-portal-be_judge-kiro-share
  grafana-data:
    external: true
    name: ai-portal-be_grafana-data
