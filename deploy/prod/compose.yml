# 生产环境。这个文件的 git 历史就是这台机器的部署记录。
#
# 发布 = 改 image: 那一行的标签并合并,然后手动触发 deploy-prod。
# 回滚 = revert 那次提交,再触发一次——不需要重新构建。
#
# 密钥不在这里:product-structure-information.env 由部署任务从 CI 的 File 变量
# PSI_PROD_ENV 投放到本目录。
services:
  product-structure-information:
    image: armdocker.rnd.ericsson.se/proj-rvc/rp-ai/product-structure-information:925f24b0
    container_name: product-structure-information
    restart: unless-stopped
    env_file:
      - product-structure-information.env
    # 容器内统一 8000;9010 是这台机器上对外的端口,属于环境的事实。
    ports:
      - "9010:8000"
    volumes:
      - /proj/rp_ait_prod/logs/product-structure-information:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  rtep-flow-manager:
    image: armdocker.rnd.ericsson.se/proj-rvc/rp-ai/rtep-flow-manager:ce5a702d
    container_name: rtep-flow-manager
    restart: unless-stopped
    ports:
      - "9201:8000"
    volumes:
      - /proj/rp_ait_prod/logs/rtep-flow-manager:/app/logs
      - /proj/rp_ait_prod/data/rtep-flow-manager:/app/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # 没有 env_file:该服务的 PROD_ENV 与服务器上的 .env 都是空的,生产从来没给它配过
    # 环境变量(代码里读的 RTEP_SMTP_* 目前全未设置)。这是既有状态,迁移不改它。

  # agent-artifex 在这台机器上已 Exited 6 天,10000 端口无人监听。
  # 这里如实记下它属于本环境但当前不运行:profiles 让 docker compose up 跳过它。
  # 要启动就删掉 profiles 这两行——那是一个功能决定,不属于基础设施迁移。
  agent-artifex:
    image: armdocker.rnd.ericsson.se/proj-rvc/rp-ai/agent-artifex:ead8343c
    container_name: agent-artifex
    restart: unless-stopped
    profiles:
      - stopped
    ports:
      - "10000:8000"
    volumes:
      - /proj/rp_ait_prod/logs/agent-artifex:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
