# 生产环境的 swarm 形态。与同目录的 compose.yml 并存:搬迁期间未搬的服务仍由 compose.yml
# 在 100.77.162.66 上跑,搬完的服务在这里。全部搬完后 compose.yml 删除。
#
# 一个环境一个 stack:Traefik 也在里面,发布这个环境的入口端口(prod 80 / test 8080),
# 网络是本 stack 自己的加密 overlay,所以两套环境不共享任何东西。
#
# 部署:在 manager 上 `docker stack deploy -c stack.yml --with-registry-auth prod`
#   * --with-registry-auth 必需:少了它,本地没缓存该镜像的节点会一直 Rejected: No such image
#   * 改 edge-*.yml 后要给 configs 的名字换一个版本号 —— swarm config 不可变
#   * env 文件不进 git,由部署任务从 CI 的 File 变量投放到 stack.yml 同目录

services:
  # ---------- 入口 ----------
  traefik:
    image: armdocker.rnd.ericsson.se/dockerhub-ericsson-remote/traefik:v3.5
    command: ["--configFile=/etc/traefik/static.yml"]
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
    networks: [inner]
    configs:
      - source: edge_static
        target: /etc/traefik/static.yml
      - source: edge_dynamic
        target: /etc/traefik/dynamic.yml
    deploy:
      replicas: 1
      # 不再限制在 manager:那个约束当初是为了读 docker socket 才加的,改用文件路由后
      # 已不需要,而钉在唯一 manager 上会让 manager 故障直接带走整个入口。
      # ingress 模式下入口端口在所有节点都监听,所以 Traefik 落在哪台都能对外服务。
      restart_policy:
        condition: any
      update_config:
        order: start-first

  # ---------- 已搬进集群的服务(一律不发布端口)----------
  psi:
    image: armdocker.rnd.ericsson.se/proj-rvc/rp-ai/product-structure-information:${PRODUCT_STRUCTURE_INFORMATION_TAG}
    env_file:
      # 文件名与 env-files.txt 里的目标名一致,由部署任务投放
      - product-structure-information.env
    networks: [inner]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      # 只能 1 个副本:这个服务把产品结构树缓存在容器本地磁盘
      # (hw_change_analysis/cache/<md5>.json)而且**永不过期**,失效只发生在调用方传
      # force_refresh 时、且只刷新处理那次请求的那个副本。两副本下同一个查询会得到不同答案,
      # 用户点刷新也只对其中一个生效。要多副本得先把缓存外置(服务侧的改动)。
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        order: start-first          # 新副本先起再撤旧的,更新期间无空窗
        failure_action: rollback    # 起不来就自动回到上一版
        monitor: 30s
      rollback_config:
        order: start-first
      resources:
        limits: {cpus: "1.0", memory: 512M}
        reservations: {memory: 128M}

configs:
  edge_static_v1:
    file: ./edge-static.yml
  # v1 -> v2:加了 /api/eridoc/ 这条路由。swarm config 不可变,所以改文件必须换名字。
  edge_dynamic_v2:
    file: ./edge-dynamic.yml

networks:
  inner:
    driver: overlay
    driver_opts:
      # 两个节点跨机房,数据面默认明文,所以必须加密
      encrypted: "true"
