# 对外入口。只做两件事:终止 TLS、把老入口 9001 跳到新域名。路由一概不管 ——
# /api/、/api/product-structure/、/grafana/ 全由前端容器内那层 nginx 决定,那是应用的
# 一部分(随前端版本变);这一层持有主机名、证书、TLS 参数(随环境变)。
#
# 本层刻意写得处处比前端容器内那层更宽松,这样前端调整自己的超时和上传上限时
# 这里不需要跟着改:
#   前端容器 /api/product-structure/ = 1800s (Refresh Product Tree 实测 1002s)
#   前端容器 /api/                   = 300s + client_max_body_size 200m (上传的包)
#   前端容器 /grafana/               = WebSocket (Grafana Live)
#
# 不挂 /var/log/nginx:本镜像把 access.log 与 error.log 做成了指向 /dev/stdout、
# /dev/stderr 的符号链接。用宿主机目录盖上去会把它们埋掉,docker logs 就什么都看不到,
# 而且会在没有轮转的情况下往磁盘堆文件(这台机器已用 78%)。日志走容器标准输出。

# 上游必须用变量 + resolver,不能写死服务名。理由不是启动顺序,而是:每次前端发版
# (release.sh apply-compose prod frontend) 都会重建容器、换 IP,而 nginx 对写死的
# upstream 名字只在启动时解析一次并永久缓存 —— 那样每次发版后站点会永久 502,
# 直到有人手动重启本容器,而且没人会想到是这个原因。
# 变量把解析推迟到请求时,代价是用不了 upstream keepalive,以及重建后最多 5 秒的 502 窗口。
resolver 127.0.0.11 valid=5s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- 健康检查专用,不发布到宿主机 ------------------------------------------
# 不拿 80 或 9001 做健康检查:那两个都返回 302,busybox wget 会跟着跳到外网域名上,
# 健康检查就变成了在测 DNS 和证书。
server {
    listen 8081;
    access_log off;
    location = /healthz { return 200 "ok\n"; }
}

# --- 老入口 http://100.77.162.66:9001 -------------------------------------
# 用 302 不用 301:301 会被浏览器永久缓存,万一需要让 9001 重新直接服务应用,
# 缓存过的浏览器会一直跳走而且没法让它们忘掉。确定不回头了再换 301。
server {
    listen 9001;
    listen [::]:9001;
    server_name _;

    # 根路径进技能页;其余路径原样带过去,不打断深链接
    # (前端路由:'' dashboard knowledge login market skills tools workspace)。
    location = / {
        return 302 https://rpai.ews.gic.ericsson.se/skills;
    }
    location / {
        return 302 https://rpai.ews.gic.ericsson.se$request_uri;
    }
}

# --- 80 -> 443 ------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    # 固定跳规范域名而不是 $host:按 IP 访问时 $host 是 IP,跳过去会撞证书 SAN
    # (证书只有 DNS:rpai.ews.gic.ericsson.se 一个 SAN)。
    return 302 https://rpai.ews.gic.ericsson.se$request_uri;
}

# --- 443 ------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name rpai.ews.gic.ericsson.se;

    # 证书目录以只读方式挂进来。必须挂**目录**而不是挂两个文件:续期时用 install
    # 替换证书会产生新 inode,挂文件的话容器内永远看不到新证书,reload 之后仍是旧证书
    # 且不报任何错。见 /proj/rp_ait_prod/certs/rpai/RENEWAL.md
    ssl_certificate     /etc/nginx/certs/rpai.crt;   # fullchain = 服务器证书 + EGADIssuingCA3
    ssl_certificate_key /etc/nginx/certs/rpai.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 暂不加 HSTS:9001 刚改成跳转,先观察一段时间。HSTS 一旦下发,max-age 内无法撤销,
    # 会让回退变难。

    # 不设上限,让前端容器里那一层成为唯一的上传上限 —— 否则本层默认 1m 会先用自己的
    # 413 打回上传,请求根本到不了前端,审计日志里什么都不会留下。
    #
    # 刻意不在这里写具体数字:上限归前端那一层管(现在是 200m,给 tool/agent 的包用),
    # 本层只负责"不比它更严"。原来这句注释复述了 50m,而前端改动时没人会想到回来改它。
    client_max_body_size 0;

    location / {
        set $fe frontend:80;
        proxy_pass http://$fe$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Grafana Live 走 websocket
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 取前端容器里最长的那个作为本层上限
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;

        # 不缓冲:后端有流式响应,缓冲会让增量输出攒到结束才吐出来
        proxy_buffering off;
    }
}