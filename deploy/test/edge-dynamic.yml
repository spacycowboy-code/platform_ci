# 复刻测试前端 nginx 现在的映射,后端先指向老机器上跑着的测试 compose 服务。
# 服务搬进集群后把对应的 servers 改成服务名(如 http://frontend:80),改完给 stack.yml 里
# configs 的名字换版本号 —— swarm config 不可变。
#
# 注意 psi 和 grafana:测试环境本来就没有自己的实例,前端一直指向生产那一份。这里照原样保留,
# 不在迁移中改变依赖关系。
http:
  routers:
    psi:
      rule: "PathPrefix(`/api/product-structure/`)"
      priority: 100
      entryPoints: [web]
      middlewares: [psi-strip, psi-add]
      service: psi
    audit:
      rule: "PathPrefix(`/api/`)"
      priority: 50
      entryPoints: [web]
      service: audit
    grafana:
      rule: "PathPrefix(`/grafana/`)"
      priority: 50
      entryPoints: [web]
      service: grafana
    # 时序图工具。自己的前缀,不能挂在 /api/ 下面 —— 那条已经是审计后端的。
    # 前端的资源引用是相对的(style.css / app.js),API 调用也是相对的(api/generate),所以
    # stripPrefix 之后前后端都对得上,服务本身不需要知道自己挂在哪个前缀下。
    seqdiag:
      rule: "PathPrefix(`/seqdiag/`)"
      priority: 100
      entryPoints: [web]
      middlewares: [seqdiag-strip]
      service: seqdiag
    # 少一个尾斜杠时重定向。不做这件事的话 /seqdiag 匹配不上上面那条,会落到优先级 1 的 fe,
    # 用户看到的是门户前端 —— 现象离原因很远。而且相对路径的 API 调用要靠尾斜杠才解析正确。
    seqdiag-slash:
      rule: "Path(`/seqdiag`)"
      priority: 110
      entryPoints: [web]
      middlewares: [seqdiag-slash-redirect]
      service: seqdiag
    # FI 分析工具。和 seqdiag 同样的做法:自己的前缀 + stripPrefix。
    # 那个服务的前端资源与 API 调用**都是相对路径**(app.css / api/jobs),所以 strip 之后
    # 前后端对得上,服务本身不需要知道自己挂在哪个前缀下。
    fi:
      rule: "PathPrefix(`/fi/`)"
      priority: 100
      entryPoints: [web]
      middlewares: [fi-strip]
      service: fi
    # 少一个尾斜杠时重定向。不做这件事的话 /fi 匹配不上上面那条,会落到优先级 1 的 fe,
    # 用户看到的是门户前端 —— 现象离原因很远。而且相对路径的 API 调用要靠尾斜杠才解析正确
    # (没有尾斜杠时 `api/jobs` 会被解析成 /api/jobs,那条路径在边缘上属于审计后端)。
    fi-slash:
      rule: "Path(`/fi`)"
      priority: 110
      entryPoints: [web]
      middlewares: [fi-slash-redirect]
      service: fi
    # ReqFlow 结果核查。和 seqdiag / fi / po 同一种情况:资源与 API 调用都是**相对路径**
    # (2026-09-20 把 webapp/static 里 11 处 '/api/...' 和 index.html 里 4 处 '/static/...'
    # 改成了相对路径,正是为了落进这一类),所以一个前缀 + stripPrefix 就够了,不需要第二条
    # 不剥前缀的路由。
    reqflow:
      rule: "PathPrefix(`/reqflow/`)"
      priority: 100
      entryPoints: [web]
      middlewares: [reqflow-strip]
      service: reqflow
    # 少一个尾斜杠时重定向,理由同 seqdiag-slash —— 而且对这个服务是**必需**的:
    # 相对路径的 API 调用要靠尾斜杠才解析正确,没有尾斜杠时 `api/runs` 会被解析成 /api/runs,
    # 那条路径在边缘上属于审计后端。
    reqflow-slash:
      rule: "Path(`/reqflow`)"
      priority: 110
      entryPoints: [web]
      middlewares: [reqflow-slash-redirect]
      service: reqflow
    # PO 报表门户。和 seqdiag / fi 同一种情况:资源与 API 调用都是相对路径,
    # 所以一个前缀 + stripPrefix 就够了,不需要第二条路由。
    # (历史:v1 是 Flask 多页版,落地页写死 `window.location.href="/pm/"+name` 绝对跳转,
    #  当时还要额外一条不 strip 的 /pm/ 路由。v2 改成 FastAPI 单页 + 相对路径后已去掉那条,
    #  见服务仓 docs/PLATFORM_CI_PATCH.md。)
    po:
      rule: "PathPrefix(`/po/`)"
      priority: 100
      entryPoints: [web]
      middlewares: [po-strip]
      service: po
    # 少一个尾斜杠时重定向,理由同 seqdiag-slash。
    po-slash:
      rule: "Path(`/po`)"
      priority: 110
      entryPoints: [web]
      middlewares: [po-slash-redirect]
      service: po
    # 拓扑配置工具。和 seqdiag / fi 同一种情况:整个工具是一个内联的 index.html,没有任何带
    # 路径的外部资源,也没有绝对路径跳转,所以一个前缀 + stripPrefix 就够了,不需要第二条路由。
    topology:
      rule: "PathPrefix(`/topology/`)"
      priority: 100
      entryPoints: [web]
      middlewares: [topology-strip]
      service: topology
    # 少一个尾斜杠时重定向,理由同 seqdiag-slash。
    topology-slash:
      rule: "Path(`/topology`)"
      priority: 110
      entryPoints: [web]
      middlewares: [topology-slash-redirect]
      service: topology
    fe:
      rule: "PathPrefix(`/`)"
      priority: 1
      entryPoints: [web]
      service: fe

  middlewares:
    psi-strip:
      stripPrefix:
        prefixes: ["/api/product-structure"]
    psi-add:
      addPrefix:
        prefix: "/api"
    seqdiag-strip:
      stripPrefix:
        prefixes: ["/seqdiag"]
    seqdiag-slash-redirect:
      # 评审时确认一下 ${1} 有没有被 stack deploy 的变量替换吃掉:这个文件是以 docker config
      # 下发的,compose 的变量替换只作用于 compose 文件本身、不作用于 configs 引用的文件内容,
      # 所以预期是原样保留。真被吃掉的话改成 $1。
      redirectRegex:
        regex: "^(https?://[^/]+)/seqdiag$"
        replacement: "${1}/seqdiag/"
        permanent: true
    fi-strip:
      stripPrefix:
        prefixes: ["/fi"]
    fi-slash-redirect:
      redirectRegex:
        regex: "^(https?://[^/]+)/fi$"
        replacement: "${1}/fi/"
        permanent: true
    reqflow-strip:
      stripPrefix:
        prefixes: ["/reqflow"]
    reqflow-slash-redirect:
      redirectRegex:
        regex: "^(https?://[^/]+)/reqflow$"
        replacement: "${1}/reqflow/"
        permanent: true
    po-strip:
      stripPrefix:
        prefixes: ["/po"]
    po-slash-redirect:
      redirectRegex:
        regex: "^(https?://[^/]+)/po$"
        replacement: "${1}/po/"
        permanent: true
    topology-strip:
      stripPrefix:
        prefixes: ["/topology"]
    topology-slash-redirect:
      redirectRegex:
        regex: "^(https?://[^/]+)/topology$"
        replacement: "${1}/topology/"
        permanent: true

  services:
    fe:
      loadBalancer:
        servers: [{url: "http://frontend:80"}]   # 已搬进集群,按服务名访问
    audit:
      loadBalancer:
        servers: [{url: "http://audit-backend:8000"}]   # 已搬进集群
    psi:
      loadBalancer:
        # 测试环境没有自己的 psi,原本就指生产那一份(现在生产的 psi 已在集群里)
        servers: [{url: "http://product-structure-information:8000"}]   # 测试环境自己的一份
    po:
      loadBalancer:
        servers: [{url: "http://po-reporting-portal:8000"}]   # 本环境自己的一份
    grafana:
      loadBalancer:
        # 这个地址是活的,而且是**必需**的:验收环境是 swarm、两个节点各一个副本,traefik
        # 刻意没有节点约束,所以它可能落在另一台机器上 —— 那时只有这台机器的局域网地址
        # 够得着生产那份 grafana。2026-08-30 把生产的 9401 收成只绑回环+网桥网关,这里
        # 立刻 502。代价写在 deploy/prod/compose.yml 的端口注释里(匿名 SQL 通道)。
        # 要关掉那个洞,得先让这个环境有自己的 grafana 实例(两个 stack 都还没有)。
        servers: [{url: "http://100.77.162.66:9401"}]
    seqdiag:
      loadBalancer:
        servers: [{url: "http://sequence-diagram:8000"}]
    fi:
      loadBalancer:
        servers: [{url: "http://fi-analysis:8000"}]
    reqflow:
      loadBalancer:
        # 只指界面。判定器不在这里出现 —— 它刻意不发布任何对外入口,
        # 端口就是模型额度本身,只有界面按服务名在 inner 网络里够得着它。
        servers: [{url: "http://reqflow-result-check:8000"}]
    topology:
      loadBalancer:
        # 纯静态 nginx,监听 80(不是 8000 —— 它不是那个 python 基础镜像)
        servers: [{url: "http://topology-configurator:80"}]

