# 这台机器上跑什么。镜像标签由部署任务写在环境目录的 .env 里;下面的默认值是上次已知的版本,
# 只在 .env 里没有对应项时生效——判断线上实际跑什么看 .env 或部署日志,不要看这里。
# 技能审计的验收环境。与生产同源:同样的镜像,不同的宿主机端口、路径与上游。
#
# 前端与生产是同一个 digest,区别只有 AUDIT_UPSTREAM 指向 9100。
services:
  db:
    image: mysql:8.0
    container_name: ai-portal-audit-staging-db
    restart: unless-stopped
    env_file:
      - audit-test.env
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  audit-backend:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/rp-ai-portal-be:${RP_AI_PORTAL_BE_TAG:-5f9660e8}
    container_name: ai-portal-audit-staging-backend
    restart: unless-stopped
    env_file:
      # 由部署任务从 File 变量 AUDIT_TEST_ENV 投放。除库/LDAP/JWT 外,rp-ai-portal-be v1.5.0
      # 起还要 GITLAB_USER_AGENTS_TOKEN(rp-ai/rp-ai-user-agents 的 group access token,
      # Owner + api,write_repository)。缺了只影响 Agent 包上传:答 503 并说明原因。
      - audit-test.env
    # 判定器地址不在这里配:调它的是**引擎**,用的是 audit_llm_base_url(默认
    # http://audit-judge:8790/v1)。这里原来有一行 AUDIT_JUDGE_URL,两个仓的代码都没有这个字段,
    # 门户读不到它 —— 留着只会让人以为改它有用。删掉它之后 environment 下没有任何一项了,所以
    # environment: 这个键也必须一起删 —— 空的 environment 是合法 YAML,但 compose 会报
    # "must be a mapping",而它是在部署时才报,把所有人的部署都挡住。
    ports:
      - "9100:8000"
    volumes:
      - /home/eniuiqr/audit-data/skillrepo:/data/skillrepo
      - /home/eniuiqr/audit-data/logs:/app/logs
      - /home/eniuiqr/audit-data/ssh:/root/.ssh
    depends_on:
      - db
      - audit-judge
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  audit-reconciler:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/rp-ai-portal-be:${RP_AI_PORTAL_BE_TAG:-5f9660e8}
    container_name: ai-portal-audit-staging-reconciler
    restart: unless-stopped
    env_file:
      - audit-test.env
    entrypoint: ["python", "-m", "app.reconcile", "--watch"]
    depends_on:
      - audit-backend

  audit-judge:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/skill-audit-judge:${SKILL_AUDIT_JUDGE_TAG:-5f9660e8}
    container_name: ai-portal-audit-staging-judge
    restart: unless-stopped
    env_file:
      - audit-test.env
    expose:
      - "8790"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8790/health').status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      # 卷名写死:登录态先于本描述存在,不能让 compose 按目录名新建一套空卷。
      - judge-kiro-home:/root/.kiro
      - judge-kiro-share:/root/.local/share/kiro-cli

  frontend:
    # 与生产同一个 digest,只有上游不同。
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/rp-ai-portal-fe:${RP_AI_PORTAL_FE_TAG:-61159855}
    container_name: rp-ai-portal-fe-audit
    restart: unless-stopped
    ports:
      - "9101:80"
    environment:
      AUDIT_UPSTREAM: "http://host.docker.internal:9100"
      # 产品结构与 grafana 这台机器上各只有一份,验收环境直接指过去。
      PSI_UPSTREAM: "http://host.docker.internal:9010"
      GRAFANA_UPSTREAM: "http://host.docker.internal:9401"
      # 这个环境没有 eridoc 实例。变量仍然必须给:前端镜像的 nginx 模板里有一条
      # proxy_pass ${ERIDOC_UPSTREAM}/api/,未设置会被 envsubst 渲成空串,整份配置非法,
      # 容器直接起不来。指向 discard 端口,该工具页在这里表现为 502。
      ERIDOC_UPSTREAM: "http://127.0.0.1:9"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  judge-kiro-home:
    external: true
    name: ai-portal-audit-staging_judge-kiro-home
  judge-kiro-share:
    external: true
    name: ai-portal-audit-staging_judge-kiro-share
  db-data:
    external: true
    name: ai-portal-audit-staging_db-data
