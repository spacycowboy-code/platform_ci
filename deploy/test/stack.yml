# 测试环境的目标状态:全部服务在集群里,对外只有 Traefik,端口沿用用户已经在用的 9101。
#
# 与 compose.yml 的关系:达到目标状态后 compose.yml 不再使用(保留一段时间用于回退),
# 全部验收通过再删。
#
# 有状态的三个服务(db / audit-backend / audit-judge)的数据都在 100.77.162.66 的硬盘上
# (命名卷 + bind mount),所以用放置约束钉在那台机器。它们**不能**与 compose 版本并行运行:
# 两个 MySQL 挂同一个数据目录会损坏数据。切换必须"先停 compose 再起集群"。
#
# depends_on 在 swarm 里无效,服务会并行启动。后端起得比 db 早就会崩,靠 restart_policy 重试
# 拉起来 —— 这是 swarm 的模型:不保证顺序,只保证最终收敛。
#
# 部署:manager 上 `docker stack deploy -c stack.yml --with-registry-auth test`

x-pin-to-old: &pin
  # 数据在这台机器的硬盘上,副本调度到别处就找不到数据
  constraints: [node.hostname == node-100-77-162-66]

services:
  # ---------- 入口 ----------
  traefik:
    image: armdocker.rnd.ericsson.se/dockerhub-ericsson-remote/traefik:v3.5
    command: ["--configFile=/etc/traefik/static.yml"]
    ports:
      # 沿用用户现在就在用的端口:切换后地址一个字都不用变
      - target: 9101
        published: 9101
        protocol: tcp
        mode: ingress
    networks: [inner]
    configs:
      - source: edge_static
        target: /etc/traefik/static.yml
      - source: edge_dynamic
        target: /etc/traefik/dynamic.yml
    deploy:
      replicas: 1
      # 不再限制在 manager:那个约束当初是为了读 docker socket 才加的,改用文件路由后
      # 已不需要,而钉在唯一 manager 上会让 manager 故障直接带走整个入口。
      # ingress 模式下入口端口在所有节点都监听,所以 Traefik 落在哪台都能对外服务。
      restart_policy:
        condition: any
      update_config:
        order: start-first

  # ---------- 无状态,可跨节点 ----------
  frontend:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/rp-ai-portal-fe:${RP_AI_PORTAL_FE_TAG}
    networks: [inner]
    environment:
      # 集群内按服务名;host.docker.internal 只解析到副本所在那台机器,不能用
      AUDIT_UPSTREAM: "http://audit-backend:8000"
      # psi 已经是测试环境自己的一份,按服务名访问
      PSI_UPSTREAM: "http://product-structure-information:8000"
      # grafana 还没有自己的实例,暂时仍指向生产那一份(只读看板)。
      # 这个环境跑在 swarm 上、两个节点各一个副本,所以只能用局域网地址 ——
      # host.docker.internal 只解析到副本所在那台机器(理由同上面那条注释),
      # 而生产那份 grafana 只在其中一台上。代价见 deploy/prod/compose.yml 的端口注释。
      GRAFANA_UPSTREAM: "http://100.77.162.66:9401"
      # 这个环境没有 eridoc 实例。变量仍然必须给:前端镜像的 nginx 模板里有一条
      # proxy_pass ${ERIDOC_UPSTREAM}/api/,不给会被 envsubst 渲成空串,整份配置非法,
      # 副本起不来。指向 discard 端口,那个工具页在这里表现为 502。
      # 生产的这条指向 eridoc-client 服务名(它不发布端口,鉴权在前端 nginx 做)。
      ERIDOC_UPSTREAM: "http://127.0.0.1:9"
    healthcheck:
      # 127.0.0.1 而不是 localhost:后者解析成 ::1,而镜像里的 nginx 只监听 IPv4(撞过)
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 2
      placement:
        # 约束,不是偏好。preferences: spread 只是"倾向于分开",实测滚动更新之后两个副本可以都落在
        # 同一台 —— 那台一挂服务就全没了,而界面上仍然显示 2/2,不会报警。审计引擎上就撞见过一次。
        # 它没有挂任何卷,所以两台都能跑,这个约束不会让它调度不上去。
        max_replicas_per_node: 1
      restart_policy: {condition: any}
      # stop-first 是被 max_replicas_per_node 逼出来的:两台各一个副本时,start-first 要先起新任务却
      # 没有地方放,更新会永远卡在 Pending("no suitable node"),而服务显示还是 2/2 —— 所以卡住了也
      # 看不出来。代价是更新期间有一小段只有单副本。
      update_config: {order: stop-first, failure_action: rollback, monitor: 30s, parallelism: 1}
      rollback_config: {order: stop-first, parallelism: 1}
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {memory: 64M}

  # 产品结构服务。测试环境从今天起有自己的一份,不再打生产那一份。
  #
  # 两个副本:产品结构缓存在共享数据库表 product_struct_cache 里,不是容器本地磁盘
  # (那层磁盘缓存是死代码,已删),所以两个副本对同一个查询给出同样的答案。这是后端服务里
  # 第一个真正能横向扩的,先在测试环境跑着看。
  #
  # 不挂日志目录:生产那份挂 /proj/rp_ait_prod/logs/…,而这个路径只在老机器上,挂了等于把副本
  # 钉死在一台机器。它同时写 stdout,用 docker service logs 看。
  product-structure-information:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/product-structure-information:${PRODUCT_STRUCTURE_INFORMATION_TAG}
    networks: [inner]
    env_file: [product-structure-information.env]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      placement:
        # 一台一个,而且是**约束**不是偏好。原来这里写的是 preferences: spread,注释还写着"尽量一台
        # 一个"——"尽量"就是问题:滚动更新后两个副本可以都落在同一台,那台一挂服务全没,而界面上仍然
        # 显示 2/2、不会报警。它没有挂任何卷,所以这个约束不会让它调度不上去。
        max_replicas_per_node: 1
      restart_policy: {condition: any}
      # stop-first 是被上面那个约束逼出来的:两台各一个副本时,start-first 要先起新任务却没有地方放,
      # 更新会永远卡在 Pending("no suitable node"),而服务仍显示 2/2,卡住了也看不出来。
      update_config: {order: stop-first, failure_action: rollback, monitor: 30s, parallelism: 1}
      rollback_config: {order: stop-first, parallelism: 1}
      resources:
        limits: {cpus: "1.0", memory: 1G}
        reservations: {memory: 128M}

  # 审计引擎。从门户仓解耦出来(仓库 rp-ai-miao/skill-audit),边界与理由见门户仓的
  # .kiro/specs/skill-audit/service-split.md。
  #
  # 这一步只是把它跑起来,**门户还没有切过去** —— 门户镜像里仍然装着扫描器、仍然在进程内审计。
  # 回退就是删掉这个服务,门户零改动。
  #
  # 无状态:不存任何东西,不挂卷,结果全在响应里返回,由门户的 gate 落库。所以可以两副本跨节点。
  # 不发布端口:同一 overlay 内按服务名访问,鉴权靠 ENGINE_TOKEN(它为空时服务拒绝启动)。
  #
  # 生产那份给它挂了 /proj/rp_ait_prod/logs/skill-audit,**这里刻意不挂** —— 同 product-structure-information
  # 上面那条:那个路径只在一台机器上,挂了就把副本钉死在那台,而这个服务的整个 placement 配置都是
  # 为了两副本落在两台机器上。镜像里的 log_conf.yaml 照样在写 /app/logs,只是那是容器内的临时盘,
  # 用 `docker service logs test_skill-audit` 看 stdout 就够了(同一份内容)。
  skill-audit:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/skill-audit:${SKILL_AUDIT_TAG}
    networks: [inner]
    env_file: [skill-audit.env]
    healthcheck:
      # 只证明进程活着。它不检查判定器与扫描器 —— 引擎 healthy 不等于审计链路 healthy。
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      placement:
        # preferences 只是**偏好**:实测滚动更新之后两个副本都落在了 manager 上,那一台一挂引擎就全没
        # 了,两副本白给。max_replicas_per_node 是约束,两台两副本正好一台一个。
        # 代价说清楚:一台下线时第二个副本会一直 pending 调度不上去 —— 这是想要的,剩下那个照常服务,
        # 而挤在一起才是把"两副本"变成一句空话。
        max_replicas_per_node: 1
      restart_policy: {condition: any}
      # stop-first,不是 start-first。两台两副本 + 每台最多一个 = 更新时新任务无处可放:实测第二个
      # 副本卡在 Pending "no suitable node (max replica…)",更新永远完不了。
      # 代价是更新过程中有一小段只有一个副本在跑(parallelism 1,所以不会到零)。这个代价比"两个副本
      # 挤在同一台、那台一挂就全没了"小得多,而后者是 preferences 的真实结果。
      update_config: {order: stop-first, failure_action: rollback, monitor: 30s, parallelism: 1}
      rollback_config: {order: stop-first, parallelism: 1}
      resources:
        # 一次扫描的上限是 900 秒,行为分析默认关。给的额度按门户后端今天的量级来。
        limits: {cpus: "2.0", memory: 2G}
        reservations: {memory: 256M}

  # 时序图工具的引擎(仓库 rp-ai-miao/sequence_diagram)。自然语言 → PlantUML → SVG。
  # 无状态:不挂卷、不写盘,SVG 全在响应里返回,所以和 skill-audit 一样两副本一台一个。
  # 它自己不持有模型凭据,通过 LLM_API_BASE 指向下面的 sequence-diagram-judge。
  sequence-diagram:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/sequence-diagram:${SEQUENCE_DIAGRAM_TAG}
    networks: [inner]
    env_file: [sequence-diagram.env]
    healthcheck:
      # 只证明进程活着。刻意不探判定器 —— 探它要真跑一次 ACP(几十秒、花配额),而健康检查失败
      # 会让编排换掉容器:判定器登录态失效时不该连带把好的引擎副本重启一遍。
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      placement:
        # 和 skill-audit 同样的理由:preferences 只是偏好,实测滚动更新后两副本会挤在同一台。
        max_replicas_per_node: 1
      restart_policy: {condition: any}
      # stop-first:两台两副本 + 每台最多一个 = start-first 时新任务无处可放,更新永远 Pending。
      update_config: {order: stop-first, failure_action: rollback, monitor: 30s, parallelism: 1}
      rollback_config: {order: stop-first, parallelism: 1}
      resources:
        # 渲染是一个 java 子进程(plantuml.jar),一次生成的上限 30 秒。JVM 起停是主要开销。
        limits: {cpus: "2.0", memory: 2G}
        reservations: {memory: 256M}

  # Feature & Function Interaction 分析的引擎(仓库 rp-ai-miao/feature-and-function-interaction-analysis)。
  # 上传 NDS/OA/SA → 三层知识库检索 → LLM 收敛 → FI 分析 PPT + ego 冲突图。
  # 它自己不持有模型凭据,通过 LLM_API_BASE 指向下面的 fi-analysis-judge。
  #
  # **单副本,和 sequence-diagram 不同。** 一次分析要几分钟,所以是作业式的:前端拿到 job_id
  # 之后轮询进度,产物落在容器的 /tmp/fi-jobs/<job_id>/。作业状态在内存里 —— 两个副本时
  # 轮询会打到另一个副本上,表现是"作业不存在"。要多副本得先把作业状态挪到共享存储。
  # 同理不挂卷:产物只在本次会话里能下载,进程重启即丢(服务仓 DEPLOY.md 里写明了这个取舍)。
  fi-analysis:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/fi-analysis:${FI_ANALYSIS_TAG}
    networks: [inner]
    # fi-analysis.env(File 型 CI 变量 FI_ANALYSIS_TEST_ENV)里的键 —— 那份文件不在 git 里,
    # 键的存在在这个仓库中完全不可见,所以按 PLATFORM.md 的约定列在这里:
    #   AUTH_MODE=token        引擎侧鉴权形态。这个服务接收上传的内部文档并落盘,不要改成 none
    #   ENGINE_TOKEN           使用者在界面上粘的那串。为空时服务**拒绝启动**(刻意的)
    #   LLM_API_BASE           指向 fi-analysis-judge
    #   LLM_API_KEY            引擎认判定器用,必须与下面的 FI_JUDGE_TOKEN 同值,否则每次分析 401
    #   FI_JUDGE_TOKEN         判定器侧校验的那一串(同上)
    #   FI_KIRO_MODEL          判定器用哪个模型
    #   FI_JUDGE_TIMEOUT=300   一次收敛的总预算(秒)。候选多时 30 秒必超,所以不是默认值
    #   LLM_HTTP_TIMEOUT=330   引擎等判定器的 HTTP 超时,**必须大于上一个**,否则判定器给出的
    #                          具体失败原因(未登录、模型名错)会被引擎的超时吞掉
    env_file: [fi-analysis.env]
    healthcheck:
      # 只证明进程活着。刻意不探判定器 —— 探它要真跑一次 ACP(几分钟、花配额),而健康检查失败
      # 会让编排换掉容器。判定器登录态失效的表现是每次分析都失败,不是引擎 unhealthy。
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 比 sequence-diagram 长:这个镜像启动时要 import 的东西多(openpyxl / python-pptx /
      # markitdown 那条链),冷启动明显慢一截。
      start_period: 40s
    deploy:
      # 见上面:单副本是这个服务的约束,不是保守取值。
      replicas: 1
      restart_policy: {condition: any}
      # start-first:单副本 + 无卷,新任务可以先起来,切换时不留空窗。
      update_config: {order: start-first, failure_action: rollback, monitor: 40s}
      rollback_config: {order: start-first}
      resources:
        # 内存是这里的主项:一次分析要把三层知识库读进内存(CPI 292 条含 4500 字摘要、
        # FD 1494 个功能、FS 2302 条需求),峰值几百 MB。进程内同时只跑一个分析(一位信号量),
        # 所以 4G 够;调小了会在"载入 FS 知识库"那一步被 OOM kill,现象是分析中途消失。
        limits: {cpus: "2.0", memory: 4G}
        reservations: {memory: 512M}

  audit-reconciler:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/rp-ai-portal-be:${RP_AI_PORTAL_BE_TAG}
    networks: [inner]
    env_file: [audit-test.env]
    deploy:
      # 无状态,但只需要一个:它是周期性对账,多副本只会重复做同一件事
      replicas: 1
      restart_policy: {condition: any}
      resources:
        limits: {cpus: "0.5", memory: 512M}

  # ---------- 有状态,钉在老机器 ----------
  db:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    networks: [inner]
    env_file: [audit-test.env]
    healthcheck:
      # compose 里本来有,写 stack 时漏了 —— 没有它,MySQL 挂了也不会被发现
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      - db-data:/var/lib/mysql
    deploy:
      replicas: 1
      placement: *pin
      restart_policy: {condition: any}
      resources:
        limits: {memory: 1G}

  audit-backend:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/rp-ai-portal-be:${RP_AI_PORTAL_BE_TAG}
    networks: [inner]
    # audit-test.env 来自 File 变量 AUDIT_TEST_ENV。v1.5.0 起需要多一项
    # GITLAB_USER_AGENTS_TOKEN(理由见 deploy/test/compose.yml 里的说明);缺了只影响 Agent
    # 包上传,答 503。tool 也能传包那一版起再多一项 GITLAB_USER_TOOLS_TOKEN —— 另一个组、
    # 另一个组访问令牌,缺了只影响 tool 包上传。
    #
    # **这个环境目前没有配提交签名密钥(GIT_SIGNING_KEY),所以 test 上的包上传会失败。**
    # 上传的目标组开着 GitLab 的「Reject unsigned commits」推送规则,门户不签名就会在最后
    # 一步被 pre-receive 钩子拒收;门户会答 503 并点名这个变量,不会静默失败。
    #
    # 要在 test 上启用它,**不能照生产那样 bind mount 一个密钥目录**:这个服务下面刻意
    # 取消了机器绑定(见 deploy 那一段的注释),bind mount 会把它悄悄钉回一台机器,或者副本
    # 落到没有那个文件的节点上、只在有人上传时才失败。swarm 里该用的是 docker secret ——
    # 它跟着任务分发到实际运行的节点。做这件事的人改这里:两个 secret(私钥 portal-signing
    # 与公钥 portal-signing.pub,target 名必须是这两个,因为 ssh-keygen 按同名去掉 .pub 找
    # 私钥),然后加 GIT_SIGNING_KEY=/run/secrets/portal-signing.pub。
    env_file: [audit-test.env]
    # 判定器地址不在这里配:调它的是**引擎**,用的是 audit_llm_base_url(默认
    # http://audit-judge:8790/v1)。这里原来有一行 AUDIT_JUDGE_URL,两个仓的代码都没有这个字段,
    # 门户读不到它 —— 留着只会让人以为改它有用。删掉它之后 environment 下没有任何一项了,所以
    # environment: 这个键也必须一起删 —— 空的 environment 是合法 YAML,但 compose 会报
    # "must be a mapping",而它是在部署时才报,把所有人的部署都挡住。
    volumes:
      # 只剩日志。技能仓的工作副本和推送私钥都去掉了:内容按引用走 GitLab 接口读写,鉴权是一个
      # 项目访问令牌。少了这两个挂载,这个服务就没有本地状态,可以在任意一台机器上起来 ——
      # 这才是那次重构的目的。按 sha 的内容缓存在容器本地(/tmp),丢了下次重取,不能挂出来。
      - /home/eniuiqr/audit-data/logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
      # 不再钉机器。原来钉在 node-100-77-162-66 上是因为技能仓的工作副本和推送私钥都在那台
      # 机器的硬盘上;内容改成按引用走 GitLab 接口读写、两个挂载去掉之后,这个服务没有本地
      # 状态了(只剩日志挂载,而日志本来就是每个副本各自的)。db 与 audit-judge 仍然要钉:
      # MySQL 的数据目录和判定器的登录态确实在那台机器上。
      restart_policy: {condition: any}
      # 没有本地状态,新旧副本可以并存,滚动时不必先断服务
      update_config: {order: start-first}
      resources:
        limits: {cpus: "2.0", memory: 2G}

  audit-judge:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/skill-audit-judge:${SKILL_AUDIT_JUDGE_TAG}
    networks: [inner]
    env_file: [audit-test.env]
    volumes:
      # kiro-cli 的登录状态:丢了就所有上传都因判定器不可用而落到人工复核
      - judge-kiro-home:/root/.kiro
      - judge-kiro-share:/root/.local/share/kiro-cli
    deploy:
      replicas: 1
      placement: *pin
      restart_policy: {condition: any}
      update_config: {order: stop-first}
      resources:
        limits: {cpus: "2.0", memory: 4G}

  # 时序图工具的判定器。和 audit-judge 是同一个形状、**各自独立的一份登录态**:
  # 两个服务不能共用一个卷(同一个 kiro-cli 配置目录被两个容器同时写会互相踩)。
  # 之所以不复用 audit-judge:它的 /v1/chat/completions 走 complete_json(),硬性要求回复是一个
  # JSON 对象(extract_json + "必须以 { 开头"),喂它 PlantUML 请求会两次尝试全部白跑。
  # 那个 JSON 强制是有意的(解析失败会让审计闸门读成"这一层没跑"),所以没有去改它。
  sequence-diagram-judge:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/sequence-diagram-judge:${SEQUENCE_DIAGRAM_JUDGE_TAG}
    networks: [inner]
    env_file: [sequence-diagram.env]
    volumes:
      # kiro-cli 的登录状态。**不在任何备份里**,失效只能人工重新 kiro-cli login。
      - seqdiag-kiro-home:/root/.kiro
      - seqdiag-kiro-share:/root/.local/share/kiro-cli
    deploy:
      # 单副本且必须钉住某一台:登录态在那台机器的命名卷里,调度到别处就是一对空卷。
      # **钉在新机器(manager),不用 *pin**。新服务没有历史数据,所以这是一次自由选择:
      #   老机器 100.77.162.66 跑着生产容器、另外 4 个项目的容器,且没有磁盘清理机制
      #     (2026-08-18 因磁盘满导致构建失败,手工清了 12.9GB,/etc/cron.daily 我们写不了)。
      #   新机器 100.78.224.45 只有我们的东西。
      # 代价说清楚:CI runner(581845, concurrent=3)也在新机器上,一个 JVM 密集的服务会和构建
      # 抢 CPU。要换回老机器就把下面这两行替换成 `placement: *pin`,并把卷建到那台机器上。
      replicas: 1
      placement:
        constraints: [node.hostname == node-100-78-224-45]
      restart_policy: {condition: any}
      update_config: {order: stop-first}
      resources:
        limits: {cpus: "2.0", memory: 4G}

  # FI 分析的判定器。和 sequence-diagram-judge 是**两个**服务,不能共用:两个服务共用一个
  # kiro-cli 配置目录会互相踩(同一份凭据被两个容器同时写)。而且它们的端点 agent 不同 ——
  # 这个用 fi-endpoint(要求回复是 JSON 数组),那个用 puml-endpoint(要求是 PlantUML)。
  fi-analysis-judge:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/fi-analysis-judge:${FI_ANALYSIS_JUDGE_TAG}
    networks: [inner]
    # 和引擎共用同一份 .env(键的清单见上面 fi-analysis 的注释)。判定器只用到其中三个:
    # FI_JUDGE_TOKEN(校验引擎)、FI_KIRO_MODEL、FI_JUDGE_TIMEOUT。共用一份的理由是
    # LLM_API_KEY 与 FI_JUDGE_TOKEN 必须同值 —— 分成两份文件迟早会漂,而漂了的现象是 401。
    env_file: [fi-analysis.env]
    volumes:
      # kiro-cli 的登录状态。**不在任何备份里**,失效只能人工重新 kiro-cli login。
      - fi-kiro-home:/root/.kiro
      - fi-kiro-share:/root/.local/share/kiro-cli
    deploy:
      # 单副本且必须钉住某一台:登录态在那台机器的命名卷里,调度到别处就是一对空卷。
      # 钉在新机器(和 sequence-diagram-judge 同一台)。代价:CI runner 也在那台,
      # 三个东西会抢 CPU。要换回老机器就把下面两行替换成 `placement: *pin`,
      # 并把卷建到那台机器上。
      replicas: 1
      placement:
        constraints: [node.hostname == node-100-78-224-45]
      restart_policy: {condition: any}
      # stop-first:卷是独占的,start-first 会让两个容器同时挂同一个 kiro 配置目录。
      update_config: {order: stop-first}
      resources:
        # 一次收敛的预算是 300 秒(FI_JUDGE_TIMEOUT),候选 JSON 几十 KB。开销主要在
        # kiro-cli 子进程上,内存给 4G 与 seqdiag 判定器持平。
        limits: {cpus: "2.0", memory: 4G}

  # PO 报表门户(仓库 rp-ai-miao/pmo/dashboard-portal,平台里注册的服务名是 po-reporting-portal)。
  #
  # 与生产的三处刻意不同,都是被这个环境的形态逼出来的:
  #  * **不发布端口**。生产是单机 compose、直接 9020:8000 对外(它没有走 nginx)。这里不能照搬:
  #    swarm 发布端口走 ingress mesh、会在**每个**节点上绑,而 100.77.162.66 既是 test 集群的
  #    节点、又是生产那台单机 —— 它上面的 9020 已经被生产容器占着(实测 /health 返回 200)。
  #    照搬就是端口冲突。所以走边缘代理,和 seqdiag / fi 一样。
  #  * **不挂日志卷**。/proj 只在一台机器上有,挂了就等于把副本钉死在那台;这是本环境既有的约定。
  #  * **replicas: 1**,与生产的容器数一致。不写 2 是因为无法确认这个应用有没有服务端的按人状态,
  #    而 test 的作用是预测生产 —— 副本数不一致会让"在 test 上没问题"这句话变弱。它没挂任何卷,
  #    所以将来确认无状态后直接改 2 即可(那时要按本文件其它服务的样子补 max_replicas_per_node
  #    与 stop-first)。
  #  * 生产没有给它任何 env_file(prod/env-files.txt 里也没有它),所以这里同样不需要密钥变量。
  po-reporting-portal:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/po-reporting-portal:${PO_REPORTING_PORTAL_TAG}
    networks: [inner]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      restart_policy: {condition: any}
      # 单副本 + 两个可用节点,所以 start-first 能在另一台先起新任务、更新期间不断服务。
      # (本文件里那些 stop-first 是被 max_replicas_per_node: 1 逼出来的,这里没有那个约束。)
      update_config: {order: start-first, failure_action: rollback, monitor: 30s}
      rollback_config: {order: start-first}
      resources:
        # 报表数据打包在镜像里,自己不算重活;按 psi 那档给。
        limits: {cpus: "1.0", memory: 1G}
        reservations: {memory: 128M}

  # ---------- 拓扑配置工具(纯静态单页)----------
  # 仓库 rp-ai-miao/rsw/digital-chip-topology-configurator。一个自包含的 index.html
  # (HTML/CSS/JS 全内联、无外部资源)。
  #
  # 与生产的两处不同,都是这个环境的形态决定的:
  #  * **不发布端口**。生产是单机 compose、直接 9030:80 对外。这里不能照搬:swarm 发布端口走
  #    ingress mesh 会在**每个**节点上绑,而 100.77.162.66 既是 test 集群的节点、又是生产那台
  #    单机 —— 撞上生产已占的端口就起不来。所以走边缘代理,和 seqdiag / fi / po 一样。
  #    对外地址是 :9101/topology/(路由在 edge-dynamic.yml)。
  #  * **replicas: 1**,与生产的容器数一致 —— test 的作用是预测生产。它是纯静态、无状态、不挂卷,
  #    真要两副本直接改 2 并补 max_replicas_per_node 与 stop-first 即可。
  #
  # 挂前缀不需要改这个镜像:整个工具是一个内联的 index.html,没有带路径的外部资源,
  # 而它的 nginx 是 `try_files $uri $uri/ /index.html`,stripPrefix 之后任何路径都回它。
  topology-configurator:
    image: armdocker.rnd.ericsson.se/proj-rp-ps-ai/digital-chip-topology-configurator:${DIGITAL_CHIP_TOPOLOGY_CONFIGURATOR_TAG}
    networks: [inner]
    healthcheck:
      # 127.0.0.1 而不是 localhost:后者解析成 ::1,而镜像里的 nginx 只监听 IPv4(撞过)
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      restart_policy: {condition: any}
      # 单副本 + 两个可用节点,所以 start-first 能在另一台先起新任务、更新期间不断服务。
      update_config: {order: start-first, failure_action: rollback, monitor: 30s}
      rollback_config: {order: start-first}
      resources:
        # 一个 nginx 发 85KB 的静态文件,给多了是浪费。
        limits: {cpus: "0.25", memory: 64M}
        reservations: {memory: 16M}

configs:
  # 键名固定;真实对象名由内容哈希决定(见下),避免"忘记改版本号"导致静默不生效
  edge_static:
    file: ./edge-static.yml
    name: edge_static_${EDGE_STATIC_HASH}
  edge_dynamic:
    file: ./edge-dynamic.yml
    name: edge_dynamic_${EDGE_DYNAMIC_HASH}

networks:
  inner:
    driver: overlay
    driver_opts:
      encrypted: "true"

volumes:
  # 沿用 compose 建的那几个卷,名字写死:换名等于丢数据
  judge-kiro-home:
    external: true
    name: ai-portal-audit-staging_judge-kiro-home
  judge-kiro-share:
    external: true
    name: ai-portal-audit-staging_judge-kiro-share
  # 时序图判定器的登录态。新服务没有历史包袱,所以名字是干净的 —— 但同样必须 external 且写死:
  # compose 默认按项目目录派生卷名,换目录就会挂到一对空卷上,表现是"未登录"。
  # **这两个卷要先在跑判定器的那台机器上手工建出来** —— 卷是节点本地的,而这个服务钉在
  # node-100-78-224-45(见上面的 placement)。external 卷不存在时 stack deploy 直接失败:
  #   ssh node-100-78-224-45 'docker volume create seqdiag_judge-kiro-home
  #                           docker volume create seqdiag_judge-kiro-share'
  seqdiag-kiro-home:
    external: true
    name: seqdiag_judge-kiro-home
  seqdiag-kiro-share:
    external: true
    name: seqdiag_judge-kiro-share
  # FI 分析判定器的登录态。同样 external + 写死名字,同样**要先在跑它的那台机器上手工建**
  # (钉在 node-100-78-224-45)。external 卷不存在时 stack deploy 直接失败:
  #   ssh node-100-78-224-45 'docker volume create fi-analysis_judge-kiro-home;
  #                           docker volume create fi-analysis_judge-kiro-share'
  fi-kiro-home:
    external: true
    name: fi-analysis_judge-kiro-home
  fi-kiro-share:
    external: true
    name: fi-analysis_judge-kiro-share
  db-data:
    external: true
    name: ai-portal-audit-staging_db-data