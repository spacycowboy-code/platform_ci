# 测试环境的 swarm 形态。与同目录的 compose.yml 并存:未搬的服务仍由 compose.yml 在
# 100.77.162.66 上跑,搬完的在这里。
#
# 部署:manager 上 `docker stack deploy -c stack.yml --with-registry-auth test`
services:
  traefik:
    image: armdocker.rnd.ericsson.se/dockerhub-ericsson-remote/traefik:v3.5
    command: ["--configFile=/etc/traefik/static.yml"]
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    networks: [inner]
    configs:
      - source: edge_static_v1
        target: /etc/traefik/static.yml
      - source: edge_dynamic_v1
        target: /etc/traefik/dynamic.yml
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
      update_config:
        order: start-first

  # ---------- 已搬进集群的服务(一律不发布端口)----------
  frontend:
    image: armdocker.rnd.ericsson.se/proj-rvc/rp-ai/rp-ai-portal-fe:${RP_AI_PORTAL_FE_TAG:-e70a3471}
    networks: [inner]
    environment:
      # 不能再用 host.docker.internal:它只解析到副本所在那台机器,而这些后端只在老机器上。
      # 这几个地址是环境的事实,写在环境描述里。
      AUDIT_UPSTREAM: "http://100.77.162.66:9100"
      PSI_UPSTREAM: "http://100.77.162.66:9010"
      GRAFANA_UPSTREAM: "http://100.77.162.66:9401"
    healthcheck:
      # 用 127.0.0.1 而不是 localhost:localhost 会解析成 ::1,而 nginx 只听 IPv4(撞过)
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 2
      restart_policy:
        condition: any
      update_config:
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        order: start-first
      resources:
        limits: {cpus: "0.5", memory: 256M}
        reservations: {memory: 64M}

configs:
  edge_static_v1:
    file: ./edge-static.yml
  edge_dynamic_v1:
    file: ./edge-dynamic.yml

networks:
  inner:
    driver: overlay
    driver_opts:
      encrypted: "true"
